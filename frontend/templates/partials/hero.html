{# Encabezado de pagina: title, subtitle, tone (executive, operations, commercial), icon y eyebrow. #}
<section class="pgh" data-tone="{{ tone|default:'operations' }}">
<div class="pgh-i" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{% if icon == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>{% elif icon == "users" %}<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.5-3.5 3-5.5 6-5.5s5.5 2 6 5.5M16 5.3a3.2 3.2 0 010 5.8M18 14.8c2 .6 3.4 2.5 3.8 5.2"/>{% elif icon == "wallet" %}<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/>{% elif icon == "target" %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>{% elif icon == "folder" %}<path d="M3 7.5A2.5 2.5 0 015.5 5H10l2 2.5h6.5A2.5 2.5 0 0121 10v7.5a2.5 2.5 0 01-2.5 2.5h-13A2.5 2.5 0 013 17.5z"/>{% else %}<path d="M6 20V10M12 20V4M18 20v-7"/>{% endif %}</svg></div>
<div>{% if eyebrow %}<div class="pgh-e">{{ eyebrow }}</div>{% endif %}<h1>{{ title }}</h1>{% if subtitle %}<p>{{ subtitle }}</p>{% endif %}</div>
</section>
