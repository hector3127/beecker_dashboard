  function cargarCapacidadInstalada() {
    const loading = document.getElementById('capacidad-loading');
    const contenedor = document.getElementById('capacidad-tabla-contenedor');
    if (!loading) return; // vista ya no está en el DOM

    loading.style.display = 'block';
    loading.textContent = 'Cargando capacidad instalada...';
    contenedor.style.display = 'none';

    google.script.run
      .withSuccessHandler((resp) => {
        if (!document.getElementById('capacidad-loading')) return; // DOM guard
        if (!resp || !resp.ok) {
          loading.textContent = 'Error al cargar capacidad instalada: ' + (resp && resp.error ? resp.error : 'desconocido');
          return;
        }
        _pintarTablaCapacidad(resp.personas, resp.maxAsignaciones);
        loading.style.display = 'none';
        contenedor.style.display = 'block';
      })
      .withFailureHandler((err) => {
        if (!document.getElementById('capacidad-loading')) return;
        loading.textContent = 'Error: ' + (err && err.message ? err.message : err);
      })
      .getCapacidadInstaladaTabla();
  }

  function _fmtFechaCapacidad(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  }

  /**
   * Tabla ancha: Nombre + Rol fijos, y un bloque de 7 columnas
   * (Id Proyecto, Asignación, Horas, DH Modelo, Etapa, Inicio, Fin)
   * repetido dinámicamente por cada asignación que tenga la persona
   * (hasta maxAsignaciones, el máximo entre todas las personas).
   */
  function _pintarTablaCapacidad(personas, maxAsignaciones) {
    const row1 = document.getElementById('capacidad-header-row1');
    const row2 = document.getElementById('capacidad-header-row2');
    const body = document.getElementById('capacidad-body');

    // Fila 1 de encabezado: "Nombre" / "Rol" con rowspan 2, y "Proyecto N" con colspan 7.
    let html1 = '<th class="col-persona" rowspan="2">Nombre</th><th rowspan="2">Rol</th>';
    for (let i = 0; i < maxAsignaciones; i++) {
      html1 += '<th colspan="7">Proyecto ' + (i + 1) + '</th>';
    }
    row1.innerHTML = html1;

    // Fila 2 de encabezado: subcolumnas repetidas por cada bloque de proyecto.
    let html2 = '';
    for (let i = 0; i < maxAsignaciones; i++) {
      html2 += '<th>Id Proyecto</th><th>Asignación</th><th>Horas</th><th>DH Modelo</th><th>Etapa</th><th>Inicio</th><th>Fin</th>';
    }
    row2.innerHTML = html2;

    body.innerHTML = personas.map(persona => {
      let celdas = '';
      for (let i = 0; i < maxAsignaciones; i++) {
        const a = persona.asignaciones[i];
        if (!a) {
          celdas += '<td></td><td></td><td></td><td></td><td></td><td></td><td></td>';
          continue;
        }
        const claseNivel = 'capacidad-bloque-' + a.nivel;
        celdas += '<td class="' + claseNivel + '">' + _escaparHtmlDaily(a.idProyecto) + '</td>' +
          '<td class="' + claseNivel + '" style="text-align:left;">' + _escaparHtmlDaily(a.asignacion) + '</td>' +
          '<td class="' + claseNivel + '">' + a.horas + '</td>' +
          '<td class="' + claseNivel + '">' + (a.diasHabiles != null ? a.diasHabiles : '') + '</td>' +
          '<td class="' + claseNivel + '">' + _escaparHtmlDaily(a.etapa) + '</td>' +
          '<td class="' + claseNivel + '">' + _fmtFechaCapacidad(a.inicio) + '</td>' +
          '<td class="' + claseNivel + '">' + _fmtFechaCapacidad(a.fin) + '</td>';
      }
      return '<tr><td class="col-persona">' + _escaparHtmlDaily(persona.nombre) + '</td><td>' + _escaparHtmlDaily(persona.rol || '') + '</td>' + celdas + '</tr>';
    }).join('');
  }

   */
  function _poblarSelectorProyectoRapido() {
    const select = document.getElementById('az-select-proyecto-rapido');

          return;
        }
        if (res.sinPAT) {
          select.innerHTML = '<option value="">Conecta tu cuenta primero</option>';
          return;
        }
        if (!res.proyectos.length) {
          select.innerHTML = '<option value="">Sin proyectos accesibles</option>';
          return;
        }
        select.innerHTML = res.proyectos.map(p =>
          `<option value="${p.nombre}">${_escaparHtmlDaily(p.nombre)}</option>`
        ).join('');

          select.value = res.proyectoActivo;

  /**
   * Lista los IDs internos (Proyectos) que comparten la misma base que el
   * proyecto de Azure elegido (ej. "AMK.008" -> AMK.008_S1, _S2, _S3), y
   * llena el selector de sprint. Si solo hay 0-1 candidato, el selector
   * queda oculto pero SU VALUE sigue trayendo ese único ID — nunca se cae
   * de vuelta al nombre crudo de Azure (que puede no existir tal cual en
   * Historico_Proyectos cuando el proyecto está dividido en sprints).
   * Con 2+ candidatos, se preselecciona el "activo" (no Cerrado/Cancelado).
   */
  function _poblarSelectorSprint(nombreProyectoAzure) {
    const selectSprint = document.getElementById('az-select-sprint-proyecto');
    if (!selectSprint) { _actualizarProyectoDailyConSprint(); return; }

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok || !res.sprints || !res.sprints.length) {
          selectSprint.style.display = 'none';
          selectSprint.innerHTML = '<option value="">Todos los sprints</option>';
          _actualizarProyectoDailyConSprint();
          return;
        }
        if (res.sprints.length === 1) {
          selectSprint.style.display = 'none';
          selectSprint.innerHTML = `<option value="${res.sprints[0].idProyecto}" selected>${_escaparHtmlDaily(res.sprints[0].idProyecto)}</option>`;
          _actualizarProyectoDailyConSprint();
          return;
        }
        const activo = res.sprints.find(s => s.estado !== 'Cerrado' && s.estado !== 'Cancelado') || res.sprints[0];
        selectSprint.innerHTML = res.sprints.map(s =>
          `<option value="${s.idProyecto}" ${s.idProyecto === activo.idProyecto ? 'selected' : ''}>${_escaparHtmlDaily(s.idProyecto)} — ${_escaparHtmlDaily(s.nombre)}</option>`
        ).join('');
        selectSprint.style.display = 'inline-block';
        _actualizarProyectoDailyConSprint();
      })
      .withFailureHandler(() => {
        selectSprint.style.display = 'none';
        _actualizarProyectoDailyConSprint();
      })
      .listarSprintsProyecto(nombreProyectoAzure);
  }

  /**
   * Vuelve a cargar Resumen Ejecutivo y Registros mal registrados usando
   * el sprint que quede en el selector (visible u oculto, da igual — lo
   * que importa es su .value). Azure DevOps (Work Items, Riesgos, etc.)
   * NO cambia, sigue usando el proyecto de Azure tal cual.
   */
  function _actualizarProyectoDailyConSprint() {
    const proyectoAzure = document.getElementById('az-select-proyecto-rapido').value;
    const selectSprint = document.getElementById('az-select-sprint-proyecto');
    const sprintElegido = (selectSprint && selectSprint.value) ? selectSprint.value : '';

    if (!proyectoAzure) return;
    cargarResumenEjecutivoDaily(proyectoAzure, sprintElegido);
    cargarRegistrosMalRegistrados(sprintElegido || proyectoAzure);
  }

   * Oculta, SOLO dentro de la vista Daily, los bloques que en esta pantalla

   * Recurso, y Riesgos Críticos + RAID Resumen. El Dashboard Ejecutivo
   * original (vista Proyectos) sigue mostrando estos 3 bloques normal,
   * porque esto solo actúa dentro de #dashboard-proyecto-detalle cuando

  function _ocultarBloquesNoDeseadosEnDaily() {

  /**
   * Trae el Resumen Ejecutivo del proyecto interno vinculado al nombre
   * elegido en Azure DevOps, y lo pinta reutilizando EXACTAMENTE la misma
   * función que ya usa tu Dashboard Ejecutivo original (incluye el Gantt
   * Plan vs Real, distribución por área, RAID, hitos adicionales, etc.).
   * No se reconstruye nada — mismo diseño, mismo código de render.
   */
  function cargarResumenEjecutivoDaily(nombreProyectoAzure, idProyectoInternoForzado) {
    const wrapper = document.getElementById('az-exec-wrapper');
    if (!wrapper || !nombreProyectoAzure) return;

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          wrapper.style.display = 'none';
          console.warn('Resumen ejecutivo no disponible:', res ? res.error : 'sin respuesta');
          return;
        }
        wrapper.style.display = 'block';
        renderDashboardEjecutivoProyecto(res.data); // función original, ya definida arriba en este mismo archivo
        _ocultarBloquesNoDeseadosEnDaily();
      })
      .withFailureHandler((err) => {
        wrapper.style.display = 'none';
        console.error('Error cargando resumen ejecutivo:', err);
      })
            .obtenerResumenEjecutivoParaDaily(nombreProyectoAzure, idProyectoInternoForzado || null);

  // ---------- Registros mal registrados (validación Clockify) ----------

  const _COLOR_PROBLEMA = { amarillo: 'badge-medio', rojo: 'badge-alto', morado: null };

  function cargarRegistrosMalRegistrados(idProyecto) {
    const cont = document.getElementById('lista-registros-mal-registrados');
    if (!cont || !idProyecto) return;
    cont.innerHTML = '<div class="loading">Cargando...</div>';

    google.script.run
      .withSuccessHandler((res) => {
        const c = document.getElementById('lista-registros-mal-registrados');
        if (!c) return;
        if (!res || !res.ok) { c.innerHTML = '<div class="loading">Error: ' + (res ? res.error : '') + '</div>'; return; }

        document.getElementById('kpi-mal-registro-sintag').textContent = res.contadores.sinTag;
        document.getElementById('kpi-mal-registro-horario').textContent = res.contadores.fueraHorario;
        document.getElementById('kpi-mal-registro-area').textContent = res.contadores.reglaArea;

        if (!res.alertas.length) { c.innerHTML = '<div class="loading">Sin registros con problemas 🎉</div>'; return; }

        const renderTarjeta = (a) => {
          const iniciales = a.recurso.split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
          const badges = a.problemas.map(p => {
            const claseBadge = _COLOR_PROBLEMA[p.color] || 'badge-medio';
            const estiloExtra = p.color === 'morado' ? 'style="background:#4A2A94;"' : '';
            return `<span class="badge ${claseBadge}" ${estiloExtra}>${_escaparHtmlDaily(p.mensaje)}</span>`;
          }).join(' ');

          return `
            <div class="alert-item" style="align-items:flex-start;padding:10px 0;">
              <div style="width:32px;height:32px;border-radius:50%;background:var(--vino);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">${iniciales}</div>
              <div style="flex:1;">
                <div style="font-weight:600;font-size:12.5px;">${_escaparHtmlDaily(a.recurso)}</div>
                <div style="font-size:11px;color:var(--gris);margin-bottom:4px;">${_escaparHtmlDaily(a.area)} · ${a.fecha} · ${a.duracionHrs}h${a.descripcion ? ' · ' + _escaparHtmlDaily(a.descripcion) : ''}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">${badges}</div>
              </div>
            </div>`;
        };

        const visibles = res.alertas.slice(0, 5).map(renderTarjeta).join('');
        const ocultos = res.alertas.slice(5).map(renderTarjeta).join('');

        c.innerHTML = visibles +
          (res.alertas.length > 5 ? `
            <div id="mal-registrados-ocultos" style="display:none;">${ocultos}</div>
            <div style="text-align:center;margin-top:8px;">
              <a href="#" id="toggle-mal-registrados" style="font-size:12px;color:var(--vino);text-decoration:none;">Ver todas las alertas (${res.alertas.length - 5} más)</a>
            </div>` : '');

        if (res.alertas.length > 5) {
          const toggle = document.getElementById('toggle-mal-registrados');
          toggle.onclick = (ev) => {
            ev.preventDefault();
            const bloque = document.getElementById('mal-registrados-ocultos');
            const abierto = bloque.style.display !== 'none';
            bloque.style.display = abierto ? 'none' : 'block';
            toggle.textContent = abierto ? `Ver todas las alertas (${res.alertas.length - 5} más)` : 'Ver menos';
          };
        }
      })
      .withFailureHandler((err) => {
        const c = document.getElementById('lista-registros-mal-registrados');
        if (c) c.innerHTML = '<div class="loading">Error: ' + err.message + '</div>';
      })
      .obtenerRegistrosMalRegistrados(idProyecto);
  }

  function _escaparHtmlDaily(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /**
   * Work Items sin seguimiento: no se han tocado en Azure DevOps en más
   * de 7 días (System.ChangedDate). Se muestran ordenados de más días
   * sin actualizar a menos, para dar seguimiento en el Daily.
   */
  function cargarWorkItemsSinSeguimiento() {
    const c = document.getElementById('az-sin-seguimiento-container');
    if (!c) return;
    c.innerHTML = '<div class="loading">Cargando...</div>';

    google.script.run
      .withSuccessHandler((res) => {
        const cont = document.getElementById('az-sin-seguimiento-container');
        if (!cont) return;
        if (!res || !res.ok) { cont.innerHTML = '<div class="loading">Error: ' + (res ? res.error : '') + '</div>'; return; }
        if (res.sinPAT) { cont.innerHTML = '<div class="loading">Conecta Azure DevOps para ver esto.</div>'; return; }
        if (!res.items.length) { cont.innerHTML = '<div class="loading">Todo al día — nada lleva más de 7 días sin actualizar 🎉</div>'; return; }

        cont.innerHTML = '<table class="data-table"><thead><tr>' +
          '<th>#</th><th>Título</th><th>Tipo</th><th>Estado</th><th>Asignado</th><th>Último seguimiento</th><th>Días sin actualizar</th><th></th>' +
          '</tr></thead><tbody>' +
          res.items.map(it => {
            const fecha = it.ultimoSeguimiento ? new Date(it.ultimoSeguimiento).toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
            const badgeClass = it.diasSinActualizar >= 14 ? 'badge-alto' : 'badge-medio';
            return `<tr>
              <td>#${it.id}</td>
              <td>${_escaparHtmlDaily(it.titulo)}</td>
              <td>${_escaparHtmlDaily(it.tipo)}</td>
              <td><span class="badge badge-activo">${_escaparHtmlDaily(it.estado)}</span></td>
              <td>${_escaparHtmlDaily(it.asignadoA)}</td>
              <td>${fecha}</td>
              <td><span class="badge ${badgeClass}">${it.diasSinActualizar} días</span></td>
              <td><a href="${it.url}" target="_top">Ver ↗</a></td>
            </tr>`;
          }).join('') + '</tbody></table>';
      })
      .withFailureHandler((err) => {
        const cont = document.getElementById('az-sin-seguimiento-container');
        if (cont) cont.innerHTML = '<div class="loading">Error: ' + err.message + '</div>';
      })
      .obtenerWorkItemsSinSeguimiento(7);
  }

  /**
   * Llama al backend para listar los proyectos a los que el PAT actual
   * (guardado o recien escrito en el input) tiene acceso, y llena el
   * <select id="az-select-proyecto">. proyectoAPreseleccionar es opcional.
   */
  function buscarProyectosAzureDevOpsUI(proyectoAPreseleccionar) {

  function _guardarConfigClockifyUI() {
    const apiKey = document.getElementById('clockify-input-apikey').value.trim();
    const select = document.getElementById('clockify-select-workspace');
    const workspaceId = select.value;
    const workspaceNombre = select.options[select.selectedIndex] ? (select.options[select.selectedIndex].dataset.nombre || select.options[select.selectedIndex].text) : '';

    if (!workspaceId) { _mostrarMensajeClockify('Busca y elige un workspace primero.', 'error'); return; }

    _mostrarMensajeClockify('Guardando...', 'info');

    const guardarWorkspace = () => {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) {
            _mostrarMensajeClockify('✓ Configuración guardada.', 'ok');
            setTimeout(cerrarModalClockify, 1200);
          } else {
            _mostrarMensajeClockify('Error al guardar workspace: ' + (res ? res.error : 'desconocido'), 'error');
          }
        })
        .guardarWorkspaceClockify(workspaceId, workspaceNombre);
    };

    if (apiKey) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok) guardarWorkspace();
          else _mostrarMensajeClockify('Error al guardar API key: ' + (res ? res.error : 'desconocido'), 'error');
        })
        .guardarApiKeyClockify(apiKey);
    } else {
      guardarWorkspace(); // ya tenía una API key guardada, solo se actualiza el workspace
    }
  }

                <th style="padding:10px 12px;text-align:left;color:#fff;font-weight:600;">Demo</th>
                <th style="padding:10px 12px;text-align:left;color:#fff;font-weight:600;">% Avance Total</th>
                <th style="padding:10px 12px;text-align:left;color:#fff;font-weight:600;border-radius:0 8px 0 0;">Comentario</th>
              </tr>
            </thead>
            <tbody>
              ${itemsOrdenados.map((it, idx) => `
              <tr id="wi-row-${it.id}" style="background:${idx % 2 === 0 ? '#fff' : '#FAFAFB'};transition:background .15s;"
                  onmouseover="this.style.background='#F3EEF9'" onmouseout="this.style.background='${idx % 2 === 0 ? '#fff' : '#FAFAFB'}'">
                <td style="padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;">
                  <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorEstado(it.estado)};margin-right:6px;"></span>
                  <a href="${it.url}" target="_top" style="color:var(--vino);font-weight:700;text-decoration:none;">#${it.id}</a>
                </td>
                <td style="padding:9px 12px;border-bottom:1px solid var(--border);max-width:260px;">
                  ${_escaparHtmlDaily(it.titulo)}
                </td>
                <td style="padding:9px 12px;border-bottom:1px solid var(--border);color:var(--gris-oscuro);">${_escaparHtmlDaily(it.asignadoA)}</td>
                <td style="padding:9px 12px;border-bottom:1px solid var(--border);">
                  <span class="badge badge-activo">${_escaparHtmlDaily(it.estado)}</span>
                </td>
                <td style="padding:9px 12px;border-bottom:1px solid var(--border);">
                  <input type="number" min="0" max="100" value="${it.devConstruidoPct}" style="width:56px;padding:4px 5px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;"
                    onchange="_actualizarCampoWorkItemUI(${it.id}, 'devConstruido', Number(this.value))">%

                    onchange="_actualizarCampoWorkItemUI(${it.id}, 'fechaLimiteDev', this.value)">

                  <input type="text" value="${_escaparHtmlDaily(it.demo || '')}" placeholder="ej. Demo 2" style="width:90px;padding:4px 5px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;"

  /**
   * Guarda un cambio de campo en la hoja propia WorkItems_Avance (NO en
   * Azure DevOps). Tras guardar, recalcula localmente el % Avance Total
   * sin esperar un refresh completo, para que se sienta instantáneo.
   */
  function _actualizarCampoWorkItemUI(idWorkItem, campo, valor) {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          alert('Error al guardar: ' + (res ? res.error : 'desconocido'));
          return;
        }
        _recalcularAvanceFilaWorkItem(idWorkItem);
        if(ixsTabActual==='planeacion'&&campo==='fechaLimiteDev'){
          const item=ixsPlanAzureState.items.find(x=>Number(x.id)===Number(idWorkItem));
          if(item)item.fechaLimiteDev=valor||'';
          _ixsPintarPlaneacion();
        }
      })
      .withFailureHandler((err) => alert('Error: ' + err.message))
      .guardarCampoAvanceWorkItem(idWorkItem, campo, valor);
  }

  /**
   * Recalcula visualmente % Avance Total = DevConstruido*0.8 + (QA?20:0),
   * leyendo los valores actuales directo de los inputs de esa fila —
   * evita tener que recargar toda la tabla tras cada cambio.
   */
  function _recalcularAvanceFilaWorkItem(idWorkItem) {
    const fila = document.getElementById('wi-row-' + idWorkItem);
    if (!fila) return;
    const devInput = fila.querySelector('td:nth-child(5) input');
    const qaInput = fila.querySelector('td:nth-child(6) input');
    const devPct = Number(devInput ? devInput.value : 0) || 0;
    const qaOk = qaInput ? qaInput.checked : false;
    const avance = Math.round(devPct * 0.8 + (qaOk ? 20 : 0));

    const celda = document.getElementById('wi-avance-' + idWorkItem);
    if (celda) {
      celda.innerHTML = `<div class="progress-bar-bg" style="width:80px;display:inline-block;vertical-align:middle;margin-right:6px;">
        <div class="progress-bar-fill" style="width:${avance}%;background:var(--verde);"></div>
      </div>${avance}%`;
    }
  }

  /**
   * Publica el texto del input de comentario de esa fila en la pestaña
   * "Discussion" del Work Item en Azure DevOps, con formato
   * "DD/MM/YYYY - comentario" (la fecha la agrega el backend).
   */
  function _enviarComentarioWorkItemUI(idWorkItem) {
    const input = document.getElementById('wi-comentario-' + idWorkItem);
    const status = document.getElementById('wi-comentario-status-' + idWorkItem);
    if (!input) return;
    const texto = input.value.trim();
    if (!texto) { alert('Escribe un comentario antes de enviar.'); return; }

    if (status) status.textContent = 'Enviando...';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res || !res.ok) {
          if (status) status.textContent = '';
          alert('Error al enviar comentario: ' + (res ? res.error : 'desconocido'));
          return;
        }
        input.value = '';
        if (status) {
          status.textContent = '✓ Publicado en Azure DevOps';
          setTimeout(() => { status.textContent = ''; }, 3000);
        }
      })
      .withFailureHandler((err) => {
        if (status) status.textContent = '';
        alert('Error: ' + err.message);
      })
      .agregarComentarioWorkItem(idWorkItem, texto);
  }

  function _cargarOpcionesRealesRiesgo() {

        };
        llenarSelect('riesgo-categoria', res.campos.categoria, true);
        llenarSelect('riesgo-estrategia', res.campos.estrategiaGestion, false);
        llenarSelect('riesgo-nivel', res.campos.severidad, false);

  // ---------- Buscador genérico (typeahead) reutilizado por Iteration Path, ----------
  // ---------- Responsable, Persona a la que se escala, y Related Work ----------

  let _debounceTimers = {};

  function _activarTypeahead(config) {
    const input = document.getElementById(config.inputId);
    const contenedor = document.getElementById(config.contenedorId);
    if (!input || !contenedor) return;

    input.oninput = () => {
      clearTimeout(_debounceTimers[config.inputId]);
      const query = input.value.trim();
      _debounceTimers[config.inputId] = setTimeout(() => {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.ok) {
              // Antes esto se escondía en silencio — ahora se muestra el
              // error real (ej. "tu PAT necesita el scope User Profile Read"),
              // para saber exactamente qué falta configurar.
              contenedor.innerHTML = `<div style="position:absolute;z-index:20;background:#FDECEA;color:#C62828;border:1px solid #C62828;border-radius:8px;padding:8px 10px;font-size:11.5px;width:100%;">${res ? res.error : 'Error desconocido'}</div>`;
              contenedor.style.display = 'block';
              return;
            }
            const lista = res[config.listKey] || [];
            if (!lista.length) {
              contenedor.innerHTML = `<div style="position:absolute;z-index:20;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--gris);width:100%;">Sin resultados.</div>`;
              contenedor.style.display = 'block';
              return;
            }
            contenedor.innerHTML = `<div style="position:absolute;z-index:20;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);width:100%;max-height:200px;overflow-y:auto;">` +
              lista.map((item, i) => `<div class="typeahead-item" data-idx="${i}" style="padding:7px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);">${config.renderItem(item)}</div>`).join('') +
              `</div>`;
            contenedor.style.display = 'block';
            contenedor.querySelectorAll('.typeahead-item').forEach(el => {
              el.onmouseenter = () => { el.style.background = '#F3EEF9'; };
              el.onmouseleave = () => { el.style.background = '#fff'; };
              // IMPORTANTE: se usa "mousedown" (no "click"), porque el input
              // pierde el foco (blur) ANTES de que se dispare el evento click,
              // y eso escondía la lista antes de registrar la selección.
              // mousedown ocurre primero, así que sí alcanza a seleccionar.
              el.onmousedown = (ev) => {
                ev.preventDefault(); // evita que el input pierda el foco de forma abrupta
                config.onSelect(lista[Number(el.dataset.idx)]);
                contenedor.style.display = 'none';
              };
            });
          })
          .withFailureHandler((err) => {
            contenedor.innerHTML = `<div style="position:absolute;z-index:20;background:#FDECEA;color:#C62828;border:1px solid #C62828;border-radius:8px;padding:8px 10px;font-size:11.5px;width:100%;">Error: ${err.message}</div>`;
            contenedor.style.display = 'block';
          })
          [config.backendFn](query);
      }, 250);
    };

    input.onblur = () => setTimeout(() => { contenedor.style.display = 'none'; }, 250);
  }

  function _inicializarBuscadoresRiesgo() {
    // Iteration Path: usa clasificación real de tu proyecto con fechas
    _activarTypeahead({
      inputId: 'riesgo-iteration-path', contenedorId: 'sugerencias-iteration',
      backendFn: 'buscarIteraciones', listKey: 'iteraciones',
      renderItem: (it) => `${it.path}${it.fechaInicio ? ` <span style="color:var(--gris);font-size:10.5px;">(${new Date(it.fechaInicio).toLocaleDateString('es-MX')} - ${it.fechaFin ? new Date(it.fechaFin).toLocaleDateString('es-MX') : '—'})</span>` : ''}`,
      onSelect: (it) => { document.getElementById('riesgo-iteration-path').value = it.path; }
    });

    // Responsable
    _activarTypeahead({
      inputId: 'riesgo-responsable', contenedorId: 'sugerencias-responsable',
      backendFn: 'buscarUsuariosAzureDevOps', listKey: 'usuarios',
      renderItem: (u) => `<b>${u.nombre}</b><br><span style="color:var(--gris);font-size:10.5px;">${u.email}</span>`,
      onSelect: (u) => { document.getElementById('riesgo-responsable').value = u.email; }
    });

    // Persona a la que se escala
    _activarTypeahead({
      inputId: 'riesgo-persona-escala', contenedorId: 'sugerencias-persona-escala',
      backendFn: 'buscarUsuariosAzureDevOps', listKey: 'usuarios',
      renderItem: (u) => `<b>${u.nombre}</b><br><span style="color:var(--gris);font-size:10.5px;">${u.email}</span>`,
      onSelect: (u) => { document.getElementById('riesgo-persona-escala').value = u.email; }
    });

    // Related Work
    _activarTypeahead({
      inputId: 'riesgo-related-work-buscar', contenedorId: 'sugerencias-related-work',
      backendFn: 'buscarWorkItemsParaRelacionar', listKey: 'items',
      renderItem: (it) => `<span style="color:var(--gris);">#${it.id}</span> ${_escaparHtmlDaily(it.titulo)} <span style="color:var(--gris);font-size:10px;">(${it.tipo})</span>`,

        const sel = document.getElementById('related-work-seleccionado');
        sel.textContent = '✓ Se vinculará a #' + it.id;
        sel.style.display = 'block';
      }
    });
  }

  function aerIAHechos(){
    const c=aerIAContexto(),h=c.fecha,lim=new Date(h+'T12:00:00');lim.setDate(lim.getDate()+30);
    const to=lim.toISOString().slice(0,10);

    const alerts=[];
    if(venc.length)alerts.push(venc.length+' compromiso(s) vencido(s)');

    if(c.k.horas>c.k.presupuesto&&c.k.presupuesto)alerts.push('Horas consumidas superan el presupuesto');

  function aerIAPreviewEstatus(){

  // Esta tarjeta pertenece a las MINUTAS guardadas, no al resumen ejecutivo.
  // Si existe un bloque RESUMEN extraemos solo ese bloque; nunca duplicamos el reporte completo.
  function aerIAResumenDeUltimaMinuta(contenido){
    const raw=String(contenido||'').replace(/\r\n?/g,'\n').trim();
    if(!raw)return '';
    const pattern=/(?:^|\n)\s*(?:#{1,4}\s*)?(?:\*\*|__)?\s*(?:RESUMEN(?:\s+(?:DE\s+LA\s+MINUTA|GENERAL))?|RESUMEN\s+DE\s+LA\s+REUNI[ÓO]N)\s*:?\s*(?:\*\*|__)?\s*/i;
    let m=pattern.exec(raw),found='';
    if(m){
      let next=raw.slice(m.index+m[0].length);
      // Cortar antes de la siguiente sección, no antes de bullets normales.
      const end=next.search(/\n\s*(?:#{1,4}\s+|(?:\*\*|__)\s*(?:PENDIENTES|ACUERDOS|AVANCE|ESTADO|PUNTOS DE ATENCI[ÓO]N|GENERALES|NOTA|RESPONSABLES|PR[ÓO]XIMOS PASOS)[^\n]{0,70}(?:\*\*|__)?\s*:?)\s*\n/i);
      if(end>=0)next=next.slice(0,end);
      found=next.trim();
    }
    // Formato de reporte nuevo sin bloque RESUMEN: usar el bloque Estado/Avance.
    if(!found){
      const stage=/(?:^|\n)\s*(?:#{1,4}\s*)?(?:📊\s*)?(?:\*\*|__)?\s*(?:AVANCE\s*\/\s*ESTADO ACTUAL|ESTADO GENERAL)\s*(?:\*\*|__)?\s*:?/i.exec(raw);
      if(stage){
        let rest=raw.slice(stage.index+stage[0].length);
        const stop=rest.search(/\n\s*(?:⚠️?|📍|📌|#{1,4}\s*(?:PUNTOS DE ATENCI[ÓO]N|GENERALES|PENDIENTES))/i);
        if(stop>=0)rest=rest.slice(0,stop);
        found=rest.trim();
      }
    }
    // Minutas antiguas sin encabezado de resumen: SOLO vista previa, sin inventar información.
    if(!found)found=raw.replace(/^\s*(?:#{1,4}\s*)?\*\*MINUTA[^\n]*\n?/i,'').trim();
    return found.length>440?found.slice(0,437).trimEnd()+'…':found;
  }

  function aerIAMetro(name,num,color,right){let n=Math.max(0,Number(num)||0);return `<div class="aeri-metric"><span title="${_aerEsc(name)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_aerEsc(name)}</span><span class="aeri-track"><i class="aeri-fill" style="display:block;width:${Math.min(100,n)}%;background:${color}"></i></span><b style="text-align:right;font-size:10px">${_aerEsc(right==null?Math.round(n)+'%':right)}</b></div>`;}

  function aerIACargarAnalisis(){
    if(!aerDashboardData || aerIAState.cargandoAnalisis || aerIAState.analisis || aerIAState.analisisConsultado)return;
    const id=aerDashboardData.proyecto.id,ctx=aerIAContexto();
    aerIAState.cargandoAnalisis=true;
    google.script.run.withSuccessHandler(r=>{
      if(aerIAState.id!==id)return;
      aerIAState.cargandoAnalisis=false;
      aerIAState.analisisConsultado=true;
      if(r&&r.ok&&r.resultado&&r.resultado.analisis&&!aerIAState.analisis&&!aerIAState.cargando){
        aerIAState.analisis=Object.assign({},r.resultado,{restaurado:true});
      }
      if(aerTabActual==='ia')_aerRenderTab();
    }).withFailureHandler(e=>{
      if(aerIAState.id!==id)return;
      aerIAState.cargandoAnalisis=false;
      aerIAState.analisisConsultado=true;
      console.warn('No se pudo recuperar el último análisis IA:',e&&e.message||e);
      if(aerTabActual==='ia')_aerRenderTab();
    }).obtenerUltimoAnalisisProyectoAER(id,ctx);
  }
  function aerIAAnalizar(force){
    if(!aerDashboardData || aerIAState.cargando)return;
    const id=aerDashboardData.proyecto.id,ctx=aerIAContexto(),btn=document.getElementById('aeri-analyze');
    aerIAState.cargando=true; if(btn){btn.textContent='Analizando…';btn.disabled=true;}
    google.script.run.withSuccessHandler(r=>{
      if(aerIAState.id!==id)return;
      aerIAState.cargando=false;
      if(!r||!r.ok){if(btn){btn.textContent='Reintentar análisis';btn.disabled=false;}showError(r&&r.error?r.error:'Error al analizar');return;}
      aerIAState.analisis=Object.assign({},r,{restaurado:false});
      aerIAState.analisisConsultado=true;
      if(aerTabActual==='ia')_aerRenderTab();
      _aerToast((r.cache?'Análisis recuperado del caché':'Análisis generado')+(r.persistido?' y guardado':'')+' · costo est. $'+(r.uso&&r.uso.usd||0)+' USD');
      if(r.aviso)console.warn('Persistencia del análisis IA: '+r.aviso);
    }).withFailureHandler(e=>{aerIAState.cargando=false;if(btn){btn.textContent='Reintentar análisis';btn.disabled=false;}showError(e);}).analizarProyectoClaudeAER(id,ctx,!!force);
  }
  function aerIASetPregunta(q){const e=document.getElementById('aeri-question');if(e){e.value=q;e.focus();}}
  function aerIAPreguntar(){
    const input=document.getElementById('aeri-question');
    const question=(input||{}).value||'',box=document.getElementById('aeri-response');
    if(question.trim().length<5)return aerIAAviso(box,'Escribe una pregunta antes de consultar a Claude.',true);
    const id=aerDashboardData.proyecto.id,btn=document.getElementById('aeri-ask');
    const normalized=question.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    const isSummary=normalized.includes('resume el proyecto para comite') || normalized.includes('resumen ejecutivo');
    if(btn){btn.disabled=true;btn.textContent='…';}
    aerIAAviso(box,isSummary?'Preparando resumen ejecutivo…':'Consultando Claude Haiku 4.5…');
    const runner=google.script.run.withSuccessHandler(r=>{
      if(btn){btn.disabled=false;btn.textContent='➤';}
      if(aerIAState.id!==id)return;
      if(!r||!r.ok){aerIAAviso(document.getElementById('aeri-response'),r&&r.error||'No hubo respuesta',true);return;}
      // Mostrar el texto COMPLETO en este chat y conservarlo tras re-renderizar.
      // Solo la tarjeta DERECHA se actualiza con el resumen persistido en Sheets.
      if(isSummary){
        if(r.resumen){aerIAState.resumenEjecutivo=r.resumen;aerIAState.resumenConsultado=true;}
        aerIAState.respuestaChatResumen={
          texto:String(r.texto||((r.resumen||{}).contenido)||''),
          persistido:!!r.persistido,guardado:(r.resumen||{}).guardado||''
        };
        if(aerTabActual==='ia')_aerRenderTab();
        if(!r.persistido)_aerToast(r.aviso||'Claude respondió, pero no se guardó el resumen en Sheets.','error');
      }else{
        aerIAAviso(document.getElementById('aeri-response'),r.texto+'\n\n'+(r.cache?'♻ Respuesta en caché':'Costo est. $'+(r.uso&&r.uso.usd||0)+' USD'),false);
      }
      const currentInput=document.getElementById('aeri-question');
      if(currentInput&&currentInput.value===question)currentInput.value='';
    }).withFailureHandler(e=>{
      if(btn){btn.disabled=false;btn.textContent='➤';}
      if(aerIAState.id===id)aerIAAviso(document.getElementById('aeri-response'),e&&e.message||String(e),true);
    });
    if(isSummary)runner.generarResumenEjecutivoClaudeAER(id,aerIAContexto(),{ids:(aerIAState.seleccion||[]).slice(0,5),instrucciones:question});
    else runner.preguntarClaudeProyectoAER(id,aerIAContexto(),question);
  }

  function aerIAVerMinuta(index){

  function aerIACopiarMinutaGuardada(){
    const box=document.getElementById('aeri-minuta-read');
    if(!box)return;
    const temp=document.createElement('textarea');
    temp.value=box.textContent||'';
    temp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(temp);
    temp.select();
    let copiado=false;
    try{copiado=document.execCommand('copy');}catch(e){copiado=false;}
    temp.remove();
    _aerToast(copiado?'Contenido de la minuta copiado':'No se pudo copiar. Selecciona el texto manualmente.',copiado?'success':'error');
  }

    matches.sort((a,b)=>{const av=s.sort==='hours'?beeCuentaHoraNumero(a.hours):String(a[s.sort]||''),bv=s.sort==='hours'?beeCuentaHoraNumero(b.hours):String(b[s.sort]||'');const result=s.sort==='hours'?av-bv:String(av).localeCompare(String(bv),'es',{numeric:true});return s.desc?-result:result;});
    const pages=Math.max(1,Math.ceil(matches.length/8));s.page=Math.min(Math.max(1,s.page),pages);
    body.innerHTML=matches.slice((s.page-1)*8,s.page*8).map(x=>{const klass=/ganad/i.test(x.stage)?'ganada':/propuest/i.test(x.stage)?'propuesta':/evaluac/i.test(x.stage)?'evaluacion':/negociac/i.test(x.stage)?'negociacion':'';const initials=String(x.manager||'?').split(/\s+/).slice(0,2).map(n=>n[0]||'').join('').toUpperCase();return `<tr><td><b>${esc(x.account)}</b></td><td>${esc(x.name)}</td><td><span class="bee-backlog-manager"><span class="bee-backlog-avatar">${esc(initials)}</span>${esc(x.manager||'—')}</span></td><td><span class="bee-backlog-stage ${klass}">${esc(x.stage||'—')}</span></td><td>${esc(x.close||'—')}</td><td><b>${beeCuentaHoraNumero(x.hours).toLocaleString('es-MX',{maximumFractionDigits:1})} h</b></td></tr>`;}).join('')||`<tr><td colspan="6">${s.source?'No hay oportunidades para esta cuenta o los filtros actuales.':'No se encontró una hoja con las columnas de oportunidades.'}</td></tr>`;
    const buttons=Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,s.page-3),Math.min(pages,s.page+2)).map(n=>`<button type="button" class="${n===s.page?'active':''}" onclick="beeCuentaBacklogPagina(${n})" aria-label="Página ${n}">${n}</button>`).join('');
    footer.innerHTML=`<span>Mostrando ${matches.length?((s.page-1)*8+1):0}–${Math.min(s.page*8,matches.length)} de ${matches.length} oportunidades</span><span class="bee-backlog-pages"><button type="button" onclick="beeCuentaBacklogPagina(${Math.max(1,s.page-1)})">‹</button>${buttons}<button type="button" onclick="beeCuentaBacklogPagina(${Math.min(pages,s.page+1)})">›</button></span>`;
    const stats=[['folder','Total de oportunidades',s.items.length],['clock','Horas totales',s.items.reduce((sum,x)=>sum+beeCuentaHoraNumero(x.hours),0).toLocaleString('es-MX',{maximumFractionDigits:1})+' h'],['people','Delivery Managers',new Set(s.items.map(x=>String(x.manager||'').trim().toLocaleLowerCase('es')).filter(Boolean)).size]];
    metrics.innerHTML=stats.map(([icon,label,val])=>`<div class="bee-backlog-stat"><span class="icon">${beeCuentaIcon(icon)}</span><small>${label}</small><b>${esc(val)}</b></div>`).join('');
  }
  function beeCuentaCargarMPB(res,root,offset){
    if(!root||!root.isConnected)return;
    google.script.run.withSuccessHandler(batch=>{
      if(!root.isConnected||!batch||!batch.ok){if(batch&&!batch.ok)beeCuentaMPBError(res,root,batch.error);return;}
      (batch.items||[]).forEach(item=>{const row=(res.proyectos||[]).find(p=>String(p.id).toLowerCase()===String(item.id).toLowerCase());if(!row)return;row.burn=item.error?null:beeCuentaHoraNumero(item.burn);row.clockifyPending=false;row.clockifyError=item.error||'';row.excedido=!item.error&&row.budget>0&&row.burn>row.budget;});
      res.mpbPendientes=Math.max(0,batch.total-batch.next);
      beeCuentaRender(res,root);
      if(batch.next<batch.total)beeCuentaCargarMPB(res,root,batch.next);
    }).withFailureHandler(e=>beeCuentaMPBError(res,root,e&&e.message||String(e))).obtenerConsumosMPBCuenta(res.cliente,offset,3,res._mpbQueue||(res._mpbQueue=(res.proyectos||[]).filter(p=>p.clockifyPending).map(p=>p.id)));
  }
  function beeCuentaMPBError(res,root,error){
    (res.proyectos||[]).filter(p=>p.clockifyPending).forEach(p=>{p.clockifyPending=false;p.burn=null;p.clockifyError=String(error||'No se pudo consultar Clockify');});
    res.mpbPendientes=0;beeCuentaRender(res,root);
  }
  let beeCuentaProyectoPagina=1,beeCuentaRocPagina=1,beeCuentaClientePaginado='';
  function beeCuentaPaginas(total,page,fn){
    const max=Math.max(1,Math.ceil(total/6));page=Math.min(Math.max(1,page),max);
    const nums=Array.from({length:max},(_,i)=>i+1).filter(n=>n===1||n===max||Math.abs(n-page)<=1);
    const buttons=nums.map((n,i)=>`${i&&n>nums[i-1]+1?'<span>…</span>':''}<button type="button" class="${n===page?'active':''}" onclick="${fn}(${n})">${n}</button>`).join('');
    return `<span class="bee-backlog-pages"><button type="button" onclick="${fn}(${Math.max(1,page-1)})" aria-label="Página anterior">‹</button>${buttons}<button type="button" onclick="${fn}(${Math.min(max,page+1)})" aria-label="Página siguiente">›</button></span>`;
  }
  function beeCuentaFilterProjects(){beeCuentaProyectoPagina=1;beeCuentaPaginarProyectos();}
  function beeCuentaPaginarProyectos(page){
    if(page)beeCuentaProyectoPagina=page;
    const box=document.getElementById('bee-account-projects');if(!box)return;
    const [query,stage,model]=box.querySelectorAll('.bee-project-filters input,.bee-project-filters select');
    const q=(query.value||'').toLocaleLowerCase('es').trim();
    const rows=[...box.querySelectorAll('.bee-project-entry')];
    const matches=rows.filter(row=>(!q||row.dataset.search.includes(q))&&(!stage.value||row.dataset.stage===stage.value)&&(!model.value||row.dataset.model===model.value));
    beeCuentaProyectoPagina=Math.min(Math.max(1,beeCuentaProyectoPagina),Math.max(1,Math.ceil(matches.length/6)));
    rows.forEach(row=>row.hidden=true);matches.slice((beeCuentaProyectoPagina-1)*6,beeCuentaProyectoPagina*6).forEach(row=>row.hidden=false);
    box.querySelector('#bee-project-footer').innerHTML=`<span>Mostrando ${matches.length?(beeCuentaProyectoPagina-1)*6+1:0}–${Math.min(beeCuentaProyectoPagina*6,matches.length)} de ${matches.length} proyectos</span>${beeCuentaPaginas(matches.length,beeCuentaProyectoPagina,'beeCuentaPaginarProyectos')}`;
  }
  function beeCuentaPaginarROC(page){
    if(page)beeCuentaRocPagina=page;
    const box=document.getElementById('bee-account-roc');if(!box)return;
    const rows=[...box.querySelectorAll('.bee-roc-row')];beeCuentaRocPagina=Math.min(Math.max(1,beeCuentaRocPagina),Math.max(1,Math.ceil(rows.length/6)));
    rows.forEach((row,i)=>row.hidden=i<(beeCuentaRocPagina-1)*6||i>=beeCuentaRocPagina*6);
    box.querySelector('#bee-roc-footer').innerHTML=rows.length>6?`<span>Mostrando ${(beeCuentaRocPagina-1)*6+1}–${Math.min(beeCuentaRocPagina*6,rows.length)} de ${rows.length} procesos</span>${beeCuentaPaginas(rows.length,beeCuentaRocPagina,'beeCuentaPaginarROC')}`:'';
  }
  function beeCuentaEsc(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  renderView('dashboard');
</script>
