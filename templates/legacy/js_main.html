<script>
  // ENTREGA CLOCKIFY 2026-09-28-V16: diagnóstico con versión y consumos no disponibles.
  const badgeClass = (nivel) => {
    if (!nivel) return '';
    const n = nivel.toLowerCase();
    if (n === 'alto') return 'badge-alto';
    if (n === 'medio') return 'badge-medio';
    if (n === 'bajo') return 'badge-bajo';
    return '';
  };

  const badgeClassEstado = (estado) => {
    const e = String(estado || '').trim().toLowerCase();
    if (e === 'discovery') return 'badge-medio'; // azul/amarillo: en planificación
    if (e === 'development' || e === 'deployment') return 'badge-activo'; // verde: en curso
    if (e === 'suspendido') return 'badge-warning'; // ambar: en pausa
    if (e === 'cancelado') return 'badge-error'; // rojo: cerrado/cancelado
    return 'badge-activo';
  };


  function renderView(viewName) {
    const container = document.getElementById('view-container');
    beeComAsegurarMenu();
    if(viewName!=='dashboard')document.body.classList.remove('bee-account-mode');
    if (viewName === 'dashboard') {
      const tpl = document.getElementById('tpl-dashboard');
      container.innerHTML = '';
      container.appendChild(tpl.content.cloneNode(true));
      initDashboard();
    } else if (viewName === 'comunicacion') {
      container.innerHTML='<div id="bee-com-root"></div>';
      beeComCargar();
    } else if (viewName === 'minutas') {
      const tpl = document.getElementById('tpl-minutas');
      container.innerHTML = '';
      container.appendChild(tpl.content.cloneNode(true));
      initMinutas();
    } else if (viewName === 'horas') {
      const tpl = document.getElementById('tpl-horas');
      container.innerHTML = '';
      container.appendChild(tpl.content.cloneNode(true));
      initHoras();
    } else if (viewName === 'azure') {
      const tpl = document.getElementById('tpl-azure');
      container.innerHTML = '';
      container.appendChild(tpl.content.cloneNode(true));
      initDaily();
      } else if (viewName === 'reportes') {
    const tpl = document.getElementById('tpl-reportes');
    container.innerHTML = '';
    container.appendChild(tpl.content.cloneNode(true));
    initReportes();
    
    } else {
      container.innerHTML = '<div class="loading">Módulo "' + viewName + '" — próximo entregable.</div>';
    }
  }

  function beeComIcono(tipo){
    const paths={Aviso:'<path d="M3 11v2l11 4V7L3 11Z"/><path d="M14 8c3-1 5-3 7-4v16c-2-1-4-3-7-4M5 16l2 5h3l-2-6"/>',Lineamiento:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>','Nuevo proceso':'<path d="M10 2h4l.6 2.2 2 1.1 2.1-.8 2 3.5-1.7 1.5v2.4l1.7 1.5-2 3.5-2.1-.8-2 1.1L14 22h-4l-.6-2.2-2-1.1-2.1.8-2-3.5L5 14.5v-2.4L3.3 10.6l2-3.5 2.1.8 2-1.1L10 2Z"/><circle cx="12" cy="12" r="3"/>',Cambio:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',Otro:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',Importante:'<path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 18h.01"/>'};
    return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[tipo]||paths.Otro)+'</svg>';
  }
  let beeComState={items:[],tipo:'Todos',proyecto:'',contextProject:'',orden:'recientes',busqueda:'',error:'',loading:false};
  function beeComEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function beeComAsegurarMenu(){
    if(document.querySelector('[data-bee-com-menu]'))return;
    const nodes=[...document.querySelectorAll('nav a,nav button,aside a,aside button,[data-view],[onclick*="minutas"],[onclick*="Minutas"]')];
    const base=nodes.find(n=>n.textContent.trim().toLocaleLowerCase('es')==='minutas'&&!n.closest('#view-container'));
    if(!base||!base.parentNode)return;
    const link=base.cloneNode(true);link.removeAttribute('id');link.removeAttribute('aria-current');link.dataset.beeComMenu='1';link.dataset.view='comunicacion';
    link.removeAttribute('onclick');link.innerHTML='<span aria-hidden="true" style="display:inline-flex">'+beeComIcono('Aviso')+'</span><span>Comunicación</span>';
    link.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();document.querySelectorAll('[data-bee-com-menu]').forEach(n=>n.classList.add('active'));renderView('comunicacion');},true);
    base.parentNode.insertBefore(link,base);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',beeComAsegurarMenu);
  else setTimeout(beeComAsegurarMenu,0);

      .bee-com-btn{border:1px solid #dcd8fa;background:#fff;border-radius:10px;padding:10px 15px;color:#4e24c7;font-weight:750;cursor:pointer;font:inherit;font-size:12px}.bee-com-btn.primary{background:#5025dc;border-color:#5025dc;color:#fff;font-weight:800}.bee-com-btn:hover{filter:brightness(.96)}
      .bee-com-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:14px 0}.bee-com-card{background:#fff;border:1px solid #e6e8fa;border-radius:13px;box-shadow:0 4px 18px rgba(27,19,78,.035)}
      .bee-com-kpi{padding:14px;display:flex;align-items:center;gap:9px;min-width:0}.bee-com-kpi b{display:block;font-size:21px;color:#20204e}.bee-com-kpi strong{display:block;font-size:10px}.bee-com-kpi small{display:block;color:#777994;font-size:9px;margin-top:2px}

      .bee-com-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.88fr);gap:14px;align-items:start}.bee-com-list,.bee-com-side .bee-com-card{padding:13px;margin-bottom:12px}
      .bee-com-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bee-com-tabs button{background:#f6f5ff;border:1px solid #ebe8fc;border-radius:10px;padding:9px 12px;color:#292358;font:inherit;font-size:11px;cursor:pointer}.bee-com-tabs button.active{background:#5425df;color:#fff}

      .bee-com-side h3{font-size:13px;margin:0 0 10px;color:#26234f}.bee-com-side .bee-com-row{padding:9px 1px}.bee-com-side .bee-com-icon{width:32px;height:32px;font-size:17px}.bee-com-feature{background:#fff4f7;border-color:#ffdce6}.bee-com-feature .bee-com-row{border:1px solid #ffd6e2;border-radius:10px;background:#fff;padding:10px;margin:6px 0}
      .bee-com-category{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid #eeeff7;font-size:11px}.bee-com-category b{margin-left:auto;background:#f0efff;border-radius:20px;padding:3px 8px}
      .bee-com-dialog.bee-com-detail{width:min(1020px,95vw);padding:34px 42px;color:#20233f}.bee-com-detail-top{display:flex;justify-content:space-between;align-items:start;gap:15px}.bee-com-detail-badge{display:inline-flex;align-items:center;gap:10px;background:#f0eaff;border-radius:28px;color:#4823be;padding:10px 17px;font-weight:800;font-size:14px}.bee-com-detail h2{font-size:clamp(25px,3vw,38px);margin:22px 0 12px;line-height:1.18}.bee-com-detail-meta{display:flex;gap:16px;flex-wrap:wrap;color:#67708f;font-size:14px;margin-bottom:24px}.bee-com-detail-summary{display:flex;gap:20px;background:#f4f1ff;border-radius:14px;padding:20px 24px;margin:12px 0 24px}.bee-com-detail-summary .symbol,.bee-com-detail-section .symbol{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#eee8ff;color:#5025dc}.bee-com-detail-summary h3,.bee-com-detail-section h3{margin:0 0 9px;color:#382095;font-size:19px}.bee-com-detail-summary p{margin:0;line-height:1.6;white-space:pre-wrap}.bee-com-detail-section{display:flex;gap:20px;border-top:1px solid #e2e3f3;padding:21px 0}.bee-com-detail-section h3{color:#20233f}.bee-com-detail-message{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.bee-com-detail-points{margin:0;padding:0;list-style:none;display:grid;gap:12px}.bee-com-detail-points li{display:flex;gap:14px;line-height:1.5}.bee-com-detail-points li b{flex:none;width:29px;height:29px;border-radius:50%;background:#eee8ff;color:#4823be;display:grid;place-items:center}.bee-com-detail .actions{display:flex;justify-content:flex-end}@media(max-width:550px){.bee-com-dialog.bee-com-detail{padding:20px}.bee-com-detail-section,.bee-com-detail-summary{gap:12px}}
      .bee-com-modal{position:fixed;inset:0;z-index:100500;background:rgba(24,16,62,.5);display:grid;place-items:center;padding:15px}.bee-com-dialog{width:min(620px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 25px 80px #1e174d55}.bee-com-dialog h2{margin:0 0 8px;font-size:20px}.bee-com-dialog form{display:grid;gap:12px}.bee-com-dialog label{display:grid;gap:5px;font-size:11px;font-weight:800}.bee-com-dialog textarea{min-height:140px;resize:vertical}.bee-com-dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
      @media(max-width:1120px){.bee-com-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.bee-com-grid{grid-template-columns:1fr}.bee-com-filters{grid-template-columns:1fr 1fr}}@media(max-width:550px){.bee-com-kpis{grid-template-columns:1fr 1fr}.bee-com-filters{grid-template-columns:1fr}}`;
    document.head.appendChild(css);
  }
  function beeComCargar(projectId){
    beeComState.contextProject=String(projectId||'');beeComState.proyecto='';beeComState.tipo='Todos';beeComState.busqueda='';
    beeComEstilos();const root=document.getElementById('bee-com-root');if(!root)return;
    beeComState.loading=true;root.innerHTML='<div class="bee-com">Cargando comunicados…</div>';
    google.script.run.withSuccessHandler(r=>{if(!document.getElementById('bee-com-root'))return;beeComState.loading=false;beeComState.error=r&&r.ok?'':r&&r.error||'No se pudieron cargar los comunicados.';beeComState.items=r&&r.ok?r.comunicados||[]:[];beeComPintar();})
      .withFailureHandler(e=>{beeComState.loading=false;beeComState.error=e&&e.message||String(e);beeComPintar();}).beeComListar();
  }
  function beeComPintar(){
    const root=document.getElementById('bee-com-root');if(!root)return;
    const s=beeComState,all=s.items.filter(x=>!s.contextProject||!x.proyecto||x.proyecto===s.contextProject),counts=Object.fromEntries(beeComTipos.map(t=>[t,all.filter(x=>x.categoria===t).length]));
    const projects=[...new Set(all.map(x=>x.proyecto).filter(Boolean))].sort();
    const match=x=>(s.tipo==='Todos'||x.categoria===s.tipo)&&(!s.proyecto||x.proyecto===s.proyecto)&&(!s.busqueda||[x.titulo,x.resumen,x.contenido,x.autor,x.proyecto].join(' ').toLocaleLowerCase('es').includes(s.busqueda.toLocaleLowerCase('es')));
    const items=all.filter(match).sort((a,b)=>s.orden==='antiguos'?a.fecha.localeCompare(b.fecha):b.fecha.localeCompare(a.fecha));
    const row=x=>`<button type="button" class="bee-com-row" onclick="beeComAbrir('${encodeURIComponent(x.uid)}')"><span class="bee-com-icon ${beeComEsc(x.importante?'Importante':x.categoria)}">${beeComIcono(x.importante?'Importante':x.categoria)}</span><span class="copy">${x.importante?'<span class="bee-com-tag red">Importante</span> ':''}<span class="bee-com-tag">${beeComEsc(x.categoria)}</span><b>${beeComEsc(x.titulo)}</b><p>${beeComEsc(x.resumen||x.contenido.slice(0,140))}</p><span class="bee-com-meta">▣ ${beeComEsc(x.fecha)} &nbsp;·&nbsp; ♙ ${beeComEsc(x.autor||'Equipo')} &nbsp;·&nbsp; ${beeComEsc(x.proyecto||'Todos los proyectos')}</span></span><span>›</span></button>`;
    root.innerHTML=`<div class="bee-com"><div class="bee-com-head"><div class="bee-com-title"><span class="mark">${beeComIcono('Aviso')}</span><div><h1>Centro de Comunicación</h1><p>Avisos, lineamientos, nuevos procesos y actualizaciones importantes.</p></div></div><button class="bee-com-btn primary" onclick="beeComEditar()">＋ Nuevo comunicado</button></div>
      ${s.error?`<div class="bee-com-card" style="padding:13px;color:#bc2449">${beeComEsc(s.error)}</div>`:''}<div class="bee-com-kpis">${[[beeComIcono('Lineamiento'),all.length,'Comunicados totales','Histórico',''],[beeComIcono('Importante'),all.filter(x=>x.importante).length,'Importantes','Requieren atención','Importante'],[beeComIcono('Aviso'),counts.Aviso,'Avisos','Información general','Aviso'],[beeComIcono('Lineamiento'),counts.Lineamiento,'Lineamientos','Vigentes','Lineamiento'],[beeComIcono('Nuevo proceso'),counts['Nuevo proceso'],'Nuevos procesos','Documentación',''],[beeComIcono('Cambio'),counts.Cambio,'Cambios','Recientes','Cambio']].map(x=>`<div class="bee-com-card bee-com-kpi"><span class="bee-com-icon ${x[4]}">${x[0]}</span><span><b>${x[1]}</b><strong>${x[2]}</strong><small>${x[3]}</small></span></div>`).join('')}</div>
      <div class="bee-com-grid"><section class="bee-com-card bee-com-list"><div class="bee-com-tabs">${['Todos',...beeComTipos].map(t=>`<button class="${s.tipo===t?'active':''}" onclick="beeComFiltrar('tipo','${t}')">${beeComEsc(t)} (${t==='Todos'?all.length:counts[t]})</button>`).join('')}</div><div class="bee-com-filters"><input type="search" placeholder="Buscar por título o contenido…" value="${beeComEsc(s.busqueda)}" oninput="beeComFiltrar('busqueda',this.value)"><select onchange="beeComFiltrar('proyecto',this.value)"><option value="">Todos los proyectos</option>${projects.map(p=>`<option ${s.proyecto===p?'selected':''} value="${beeComEsc(p)}">${beeComEsc(p)}</option>`).join('')}</select><select onchange="beeComFiltrar('orden',this.value)"><option value="recientes" ${s.orden==='recientes'?'selected':''}>Más recientes</option><option value="antiguos" ${s.orden==='antiguos'?'selected':''}>Más antiguos</option></select></div>${items.map(row).join('')||'<p style="color:#747797">No hay comunicados con estos filtros.</p>'}</section>
      <aside class="bee-com-side"><section class="bee-com-card bee-com-feature"><h3>⚠ Comunicados destacados</h3>${all.filter(x=>x.importante).slice(0,2).map(row).join('')||'<small>Sin comunicados destacados.</small>'}</section><section class="bee-com-card"><h3>▤ Últimos comunicados</h3>${all.slice(0,4).map(row).join('')||'<small>Aún no hay comunicados.</small>'}</section><section class="bee-com-card"><h3>▤ Categorías</h3>${beeComTipos.map(t=>`<div class="bee-com-category"><span class="bee-com-icon ${beeComEsc(t)}" style="width:25px;height:25px;font-size:14px">${beeComIcono(t)}</span>${beeComEsc(t)}<b>${counts[t]}</b></div>`).join('')}</section></aside></div></div>`;
  }
  function beeComFiltrar(key,value){beeComState[key]=value;beeComPintar();if(key==='busqueda'){const el=document.querySelector('.bee-com-filters input');if(el){el.focus();el.setSelectionRange(value.length,value.length);}}}
  function beeComCerrar(){const m=document.getElementById('bee-com-modal');if(m)m.remove();}
  function beeComAbrir(encoded){
    const uid=decodeURIComponent(encoded),x=beeComState.items.find(i=>i.uid===uid);if(!x)return;
    beeComCerrar();const m=document.createElement('div');m.id='bee-com-modal';m.className='bee-com-modal';
    const points=String(x.puntosClave||'').split(/\r?\n/).map(t=>t.trim().replace(/^[•*\-\d.)\s]+/,'').trim()).filter(Boolean);
    m.innerHTML=`<div class="bee-com-dialog bee-com-detail" role="dialog" aria-modal="true" aria-label="${beeComEsc(x.titulo)}"><div class="bee-com-detail-top"><span class="bee-com-detail-badge">${beeComIcono(x.categoria)} ${beeComEsc(x.categoria)}${x.importante?' · Importante':''}</span><button class="bee-com-btn" onclick="beeComCerrar()" aria-label="Cerrar">✕</button></div><h2>${beeComEsc(x.titulo)}</h2><div class="bee-com-detail-meta"><span>▣ ${beeComEsc(x.fecha)}</span><span>♙ ${beeComEsc(x.autor||'Equipo')}</span><span>▱ ${beeComEsc(x.proyecto||'Todos los proyectos')}</span></div>${x.resumen?`<section class="bee-com-detail-summary"><span class="symbol">ⓘ</span><div><h3>Resumen</h3><p>${beeComEsc(x.resumen)}</p></div></section>`:''}<section class="bee-com-detail-section"><span class="symbol">${beeComIcono('Lineamiento')}</span><div><h3>Mensaje</h3><div class="bee-com-detail-message">${beeComEsc(x.contenido)}</div></div></section>${points.length?`<section class="bee-com-detail-section"><span class="symbol">✓</span><div><h3>Puntos clave</h3><ol class="bee-com-detail-points">${points.map((t,i)=>`<li><b>${i+1}</b><span>${beeComEsc(t)}</span></li>`).join('')}</ol></div></section>`:''}<div class="actions"><button class="bee-com-btn" onclick="beeComEditar('${encodeURIComponent(uid)}')">Editar comunicado</button></div></div>`;
    m.onclick=e=>{if(e.target===m)beeComCerrar();};document.body.appendChild(m);
  }
  function beeComEditar(encoded){const uid=encoded?decodeURIComponent(encoded):'',x=beeComState.items.find(i=>i.uid===uid)||{};beeComCerrar();const m=document.createElement('div');m.id='bee-com-modal';m.className='bee-com-modal';m.innerHTML=`<div class="bee-com-dialog" role="dialog" aria-modal="true"><div style="display:flex;justify-content:space-between"><h2>${uid?'Editar':'Nuevo'} comunicado</h2><button class="bee-com-btn" onclick="beeComCerrar()">✕</button></div><form onsubmit="beeComGuardar(event,'${encodeURIComponent(uid)}')"><label>Título<input name="titulo" required maxlength="180" value="${beeComEsc(x.titulo||'')}"></label><label>Resumen<input name="resumen" maxlength="350" value="${beeComEsc(x.resumen||'')}"></label><label>Contenido<textarea name="contenido" required>${beeComEsc(x.contenido||'')}</textarea></label><label>Puntos clave (opcional, uno por línea)<textarea name="puntosClave" placeholder="Escribe cada punto en una línea">${beeComEsc(x.puntosClave||'')}</textarea></label><label>Categoría<select name="categoria">${beeComTipos.map(t=>`<option ${x.categoria===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Proyecto (vacío = todos)<input name="proyecto" list="bee-com-projects" value="${beeComEsc(x.proyecto||beeComState.contextProject||'')}"><datalist id="bee-com-projects">${[...new Set([beeComState.contextProject,...beeComState.items.map(a=>a.proyecto)].filter(Boolean))].map(p=>`<option value="${beeComEsc(p)}">`).join('')}</datalist></label><label>Publicado por<input name="autor" value="${beeComEsc(x.autor||'')}"></label><label style="display:flex;align-items:center;gap:7px"><input name="importante" type="checkbox" style="width:auto" ${x.importante?'checked':''}> Destacar como importante</label><div id="bee-com-error" style="color:#bd274a"></div><div class="actions"><button type="button" class="bee-com-btn" onclick="beeComCerrar()">Cancelar</button><button type="submit" class="bee-com-btn primary">Publicar comunicado</button></div></form></div>`;m.onclick=e=>{if(e.target===m)beeComCerrar();};document.body.appendChild(m);}
  function beeComGuardar(e,encoded){e.preventDefault();const f=e.target,btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Guardando…';const payload={uid:decodeURIComponent(encoded||'')};new FormData(f).forEach((v,k)=>payload[k]=v);payload.importante=f.elements.importante.checked;google.script.run.withSuccessHandler(r=>{btn.disabled=false;btn.textContent='Publicar comunicado';if(!r||!r.ok){document.getElementById('bee-com-error').textContent=r&&r.error||'No se pudo guardar.';return;}beeComState.items=r.comunicados||[];beeComCerrar();beeComPintar();}).withFailureHandler(err=>{btn.disabled=false;btn.textContent='Publicar comunicado';document.getElementById('bee-com-error').textContent=err&&err.message||String(err);}).beeComGuardar(payload);}

  let cacheReporteAERTYM = null;
  let cacheReporteIXB = null;
  let reporteAERConsumosSecuencia = 0;

  // Metadatos ligeros del selector para saber qué renderer usar sin una
  // llamada adicional al servidor.
  let mapaMetaProyectosDashboard = {};

  // Evita que una respuesta vieja pinte encima de una selección nueva.
  let dashboardRequestSeq = 0;
  let reportesBootstrapIniciado = false;

  /**
   * Compatibilidad con el template actual:
   * index.html todavía puede traer un único #reporte-loading.
   * El JS de alto nivel trabaja con dos loaders independientes.
   * Si faltan, los creamos automáticamente para evitar que las tablas
   * se queden eternamente en "Cargando...".
   */
  function asegurarLoadersReportesAltoNivel() {
    let loadingAER = document.getElementById('reporte-loading-aertym');
    let loadingIXB = document.getElementById('reporte-loading-ixb');
    const loadingGenerico = document.getElementById('reporte-loading');

    if (!loadingAER && loadingGenerico) {
      loadingAER = loadingGenerico;
      loadingAER.id = 'reporte-loading-aertym';
      loadingAER.textContent = 'Cargando AER / T&M...';
    }

    if (!loadingIXB) {
      loadingIXB = document.createElement('div');
      loadingIXB.id = 'reporte-loading-ixb';
      loadingIXB.className = 'loading';
      loadingIXB.textContent = 'Cargando IXB / RaaS...';

      const panelIXB = document.getElementById('reporte-ixbraas');
      if (panelIXB && panelIXB.parentNode) {
        panelIXB.parentNode.insertBefore(loadingIXB, panelIXB);
      } else if (loadingAER && loadingAER.parentNode) {
        loadingAER.parentNode.appendChild(loadingIXB);
      }
    }
  }

  function initReportes() {
    const btn = document.getElementById('btn-reporte-refresh');
    const btnDashboard = document.getElementById('btn-reporte-refresh-dashboard');
    const filtroAER = document.getElementById('f-aertym-servicio');
    const filtroIXB = document.getElementById('f-ixbraas-servicio');

    if (btn) btn.onclick = cargarReportesAltoNivel;
    if (btnDashboard) btnDashboard.onclick = cargarReportesAltoNivel;
    if (filtroAER) filtroAER.onchange = () => { if (cacheReporteAERTYM) renderReporteAERTYM(cacheReporteAERTYM); };
    if (filtroIXB) filtroIXB.onchange = () => { if (cacheReporteIXB) renderReporteIXBRaaS(cacheReporteIXB); };

    cargarReportesAltoNivel();
  }

  function cargarReportesAltoNivel() {
    asegurarLoadersReportesAltoNivel();

    // Antes AER/T&M + IXB/RaaS + Dashboard arrancaban a la vez y todos
    // podían disparar leerRegistrosTiempo()/Clockify. Eso generaba esperas
    // del UserLock y, algunas veces, respuestas vacías/0 hasta reabrir.
    // Ahora se ejecutan en cadena: primero AER/T&M y después IXB/RaaS.
    cargarReporteAERTYM(() => cargarReporteIXBRaaS());
  }

  function cargarReporteAERTYM(done) {
    const consumoSecuencia = ++reporteAERConsumosSecuencia;
    const loading = document.getElementById('reporte-loading-aertym');
    const panel = document.getElementById('reporte-aertym');
    if (!loading || !panel) { if (done) done(); return; }

    loading.style.display = 'block';
    loading.textContent = 'Cargando AER / T&M...';
    panel.style.display = 'none';

    google.script.run
      .withSuccessHandler((res) => {
        const loadingActual = document.getElementById('reporte-loading-aertym');
        const panelActual = document.getElementById('reporte-aertym');
        if (!loadingActual || !panelActual) return;
        loadingActual.style.display = 'none';
        if (!res || !res.ok) {
          loadingActual.style.display = 'block';
          loadingActual.textContent = 'Error: ' + (res ? res.error : 'desconocido');
          if (done) done();
          return;
        }
        cacheReporteAERTYM = res;
        panelActual.style.display = 'block';
        renderReporteAERTYM(res);
        if (done) done();
        // El resumen ya está visible. Clockify se actualiza por lotes sin bloquear IXB/RaaS.
        setTimeout(() => actualizarConsumosReporteAERTYM(res, consumoSecuencia), 2500);
      })
      .withFailureHandler((err) => {
        const el = document.getElementById('reporte-loading-aertym');
        if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + (err && err.message ? err.message : err); }
        if (done) done();
      })
      .obtenerResumenAERTYMMPB();
  }

  function actualizarConsumosReporteAERTYM(reporte, secuencia) {
    if (secuencia !== reporteAERConsumosSecuencia || cacheReporteAERTYM !== reporte) return;
    const pendientes = (reporte.filas || []).filter(f => f.clockifyPending && !f.clockifyConsultado);
    if (!pendientes.length) return;
    const batch = pendientes.slice(0, 2);
    batch.forEach(f => { f.clockifyConsultado = true; });
    google.script.run.withSuccessHandler(r => {
      if (secuencia !== reporteAERConsumosSecuencia || cacheReporteAERTYM !== reporte) return;
      if (!r || !r.ok) {
        batch.forEach(f => { f.clockifyError = r && r.error || 'No se pudieron consultar las horas'; });
        renderReporteAERTYM(reporte);
        actualizarConsumosReporteAERTYM(reporte, secuencia);
        return;
      }
      (r && r.items || []).forEach(item => {
        const f = (reporte.filas || []).find(x => String(x.idProyecto).toLowerCase() === String(item.id).toLowerCase());
        if (!f) return;
        if (typeof item.burn === 'number') {
          f.burn = item.burn;
          f.etc = Math.round((Number(f.budget || 0) - item.burn) * 100) / 100;
          f.avance = Number(f.budget) > 0 ? Math.round(item.burn / Number(f.budget) * 1000) / 10 : null;
          f.clockifyPending = false;
        } else f.clockifyError = item.error || 'No se pudieron consultar las horas';
      });
      renderReporteAERTYM(reporte);
      actualizarConsumosReporteAERTYM(reporte, secuencia);
    }).withFailureHandler(err => {
      if (secuencia !== reporteAERConsumosSecuencia) return;
      batch.forEach(f => { f.clockifyError = err && err.message || String(err); });
      renderReporteAERTYM(reporte);
      actualizarConsumosReporteAERTYM(reporte, secuencia);
    }).obtenerConsumosResumenAERTYMMPB(batch.map(f => f.idProyecto));
  }

  function cargarReporteIXBRaaS() {
    const loading = document.getElementById('reporte-loading-ixb');
    const panel = document.getElementById('reporte-ixbraas');
    if (!loading || !panel) return;

    loading.style.display = 'block';
    loading.textContent = 'Cargando IXB / RaaS...';
    panel.style.display = 'none';

    google.script.run
      .withSuccessHandler((res) => {
        const loadingActual = document.getElementById('reporte-loading-ixb');
        const panelActual = document.getElementById('reporte-ixbraas');
        if (!loadingActual || !panelActual) return;
        loadingActual.style.display = 'none';
        if (!res || !res.ok) {
          loadingActual.style.display = 'block';
          loadingActual.textContent = 'Error: ' + (res ? res.error : 'desconocido');
          return;
        }
        cacheReporteIXB = res;
        panelActual.style.display = 'block';
        renderReporteIXBRaaS(res);
      })
      .withFailureHandler((err) => {
        const el = document.getElementById('reporte-loading-ixb');
        if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + (err && err.message ? err.message : err); }
      })
      .obtenerResumenIXBRaaS();
  }

  function _clienteSeleccionadoDashboard() {
    const el = document.getElementById('f-cliente');
    const v = el ? String(el.value || '').trim() : '';
    if (!v || /^todos los clientes$/i.test(v)) return '';
    return v;
  }

  function _filtrarFilasPorClienteDashboard(filas) {
    const clienteSel = _clienteSeleccionadoDashboard();
    if (!clienteSel) return filas || [];
    const objetivo = clienteSel.toLowerCase().trim();
    return (filas || []).filter(f =>
      String(f.cliente || '').toLowerCase().trim() === objetivo
    );
  }

  function renderReporteAERTYM(data) {
    const filtro = (document.getElementById('f-aertym-servicio') || {}).value || 'TODOS';
    const filasCliente = _filtrarFilasPorClienteDashboard(data.filas || []);
    const filasTabla = filasCliente.filter(f =>
      filtro === 'TODOS' || String(f.servicio || '').toUpperCase() === filtro
    );

    const tablaCombinada = document.getElementById('tabla-pivote-aertym-servicio');
    const tbody = tablaCombinada ? tablaCombinada.querySelector('tbody') : null;
    const tfoot = tablaCombinada ? tablaCombinada.querySelector('tfoot') : null;
    const tbodyProy = document.querySelector('#tabla-proyectos-aertym tbody');
    if (!tablaCombinada || !tbody || !tfoot || !tbodyProy) return;

    // Unir visualmente las 2 tablas anteriores en una sola.
    const cardServicio = tablaCombinada.closest('.card');
    if (cardServicio) {
      const h3 = cardServicio.querySelector('h3');
      if (h3) h3.textContent = 'PROYECTOS Y FTE POR DELIVERY MANAGER — SERVICIO Y ROL';
    }
    const tablaRol = document.getElementById('tabla-pivote-aertym-rol');
    const cardRol = tablaRol ? tablaRol.closest('.card') : null;
    if (cardRol) cardRol.style.display = 'none';

    const codigos = ['DEV','ARQ','IA','SM','BA','TT','CR','DM'];
    tablaCombinada.querySelector('thead').innerHTML = `
      <tr>
        <th>Delivery Manager</th><th>AER</th><th>T&M</th>
        ${codigos.map(c => `<th>${c}</th>`).join('')}
        <th>Total FTE</th>
      </tr>`;

    const mapa = {};
    filasTabla.forEach(f => {
      const dm = f.deliveryManager || 'Sin asignar';
      if (!mapa[dm]) {
        mapa[dm] = { deliveryManager: dm, AER:0, TYM:0, total:0, roles:{} };
        codigos.forEach(c => mapa[dm].roles[c] = 0);
      }

      const serv = String(f.servicio || '').toUpperCase();
      if (serv === 'AER') mapa[dm].AER++;
      if (serv === 'T&M' || serv === 'TYM') mapa[dm].TYM++;
      mapa[dm].total += Number(f.fte || 0);

      const roles = f.ftePorRol || {};
      codigos.forEach(c => mapa[dm].roles[c] += Number(roles[c] || 0));
    });

    const filasPivote = Object.values(mapa)
      .sort((a,b) => String(a.deliveryManager).localeCompare(String(b.deliveryManager)));

    const tot = { AER:0, TYM:0, total:0, roles:{} };
    codigos.forEach(c => tot.roles[c] = 0);

    tbody.innerHTML = filasPivote.map(r => {
      tot.AER += r.AER; tot.TYM += r.TYM; tot.total += r.total;
      codigos.forEach(c => tot.roles[c] += Number(r.roles[c] || 0));
      return `<tr>
        <td>${r.deliveryManager}</td>
        <td>${Math.round(r.AER*100)/100}</td>
        <td>${Math.round(r.TYM*100)/100}</td>
        ${codigos.map(c => `<td>${Math.round((r.roles[c] || 0)*100)/100}</td>`).join('')}
        <td><b>${Math.round(r.total*100)/100}</b></td>
      </tr>`;
    }).join('') || `<tr><td colspan="${12}" style="text-align:center;">Sin datos.</td></tr>`;

    tfoot.innerHTML = `<tr style="font-weight:700;background:#FAFAFB;">
      <td>Total</td>
      <td>${Math.round(tot.AER*100)/100}</td>
      <td>${Math.round(tot.TYM*100)/100}</td>
      ${codigos.map(c => `<td>${Math.round(tot.roles[c]*100)/100}</td>`).join('')}
      <td>${Math.round(tot.total*100)/100}</td>
    </tr>`;

    const fmtFecha = (iso) => {
      if (!iso) return '-';
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[3]}/${m[2]}/${m[1].slice(-2)}`;
      const d = new Date(iso);
      return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'2-digit' });
    };

    const indicador = (value, tipo, etiqueta) => {
      if (value == null || !Number.isFinite(Number(value))) return '<span style="color:#8B90A8;">—</span>';
      const n = Number(value);
      const bien = tipo === 'avance' ? n <= 100 : tipo === 'renewal' ? n >= 30 : n > 0;
      const fondo = bien ? '#E0F5E9' : '#FDE6E8';
      const color = bien ? '#087A46' : '#C62837';
      return `<span style="display:inline-block;min-width:48px;text-align:center;padding:5px 9px;border-radius:7px;background:${fondo};color:${color};font-weight:750;white-space:nowrap;">${n}${etiqueta || ''}</span>`;
    };
    tbodyProy.innerHTML = filasTabla.map(f => {
      // Porcentaje de presupuesto consumido: se recalcula también al llegar Clockify.
      const burn = f.burn == null ? null : Number(f.burn);
      const budget = Number(f.budget);
      const advance = burn !== null && Number.isFinite(burn) && budget > 0 ? Math.round(burn / budget * 1000) / 10 : null;
      const etc = burn !== null && Number.isFinite(burn) && Number.isFinite(budget) ? Math.round((budget - burn) * 100) / 100 : null;
      return `<tr>
        <td>${f.deliveryManager || ''}</td><td>${f.cliente || ''}</td><td>${f.idProyecto || ''}</td><td>${f.servicio || ''}</td><td>${f.fte || 0}</td>
        <td>${f.nombre || ''}</td><td>${fmtFecha(f.fechaInicio)}</td><td>${fmtFecha(f.fechaFin)}</td>
        <td>${f.budget || 0}</td><td title="${f.clockifyError || (f.clockifyPending ? 'Consultando Clockify' : '')}">${f.burn == null ? (f.clockifyError ? 'No disponible' : 'Consultando…') : f.burn}</td><td>${indicador(etc, 'etc', '')}</td><td>${indicador(advance, 'avance', '%')}</td>
        <td>${indicador(f.renewalDias, 'renewal', '')}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="13" style="text-align:center;color:var(--gris);">Sin proyectos AER/T&M.</td></tr>';
  }

  function renderReporteIXBRaaS(data) {
    const filtro = (document.getElementById('f-ixbraas-servicio') || {}).value || 'TODOS';
    const filasCliente = _filtrarFilasPorClienteDashboard(data.filas || []);
    const filas = filasCliente.filter(f =>
      filtro === 'TODOS' || String(f.servicio || '').toUpperCase() === filtro
    );

    const servicios = [...new Set(filas.map(f => String(f.servicio || '').toUpperCase()).filter(Boolean))].sort();
    const pivServMap = {};
    const pivStatusMap = {};

    filas.forEach(f => {
      const dm = f.deliveryManager || 'Sin asignar';
      if (!pivServMap[dm]) pivServMap[dm] = { deliveryManager: dm, total: 0 };
      pivServMap[dm][f.servicio] = (pivServMap[dm][f.servicio] || 0) + 1;
      pivServMap[dm].total++;

      if (!pivStatusMap[dm]) pivStatusMap[dm] = { deliveryManager: dm, Sus: 0, Dis: 0, Dev: 0, Dep: 0, total: 0 };
      const s = String(f.status || '').toLowerCase();
      if (s.includes('suspend')) pivStatusMap[dm].Sus++;
      else if (s.includes('discovery')) pivStatusMap[dm].Dis++;
      else if (s.includes('development')) pivStatusMap[dm].Dev++;
      else if (s.includes('deployment')) pivStatusMap[dm].Dep++;
      pivStatusMap[dm].total++;
    });

    const pivServ = Object.values(pivServMap).sort((a,b) => (a.deliveryManager || '').localeCompare(b.deliveryManager || ''));
    const pivStatus = Object.values(pivStatusMap).sort((a,b) => (a.deliveryManager || '').localeCompare(b.deliveryManager || ''));

    const headerServ = document.getElementById('tabla-pivote-ixbraas-servicio-header');
    const bodyServ = document.querySelector('#tabla-pivote-ixbraas-servicio tbody');
    const footServ = document.querySelector('#tabla-pivote-ixbraas-servicio tfoot');
    const bodyStatus = document.querySelector('#tabla-pivote-ixbraas-status tbody');
    const footStatus = document.querySelector('#tabla-pivote-ixbraas-status tfoot');
    const bodyDetalle = document.querySelector('#tabla-proyectos-ixbraas tbody');
    if (!headerServ || !bodyServ || !footServ || !bodyStatus || !footStatus || !bodyDetalle) return;

    headerServ.innerHTML = `<th>Delivery Manager</th>${servicios.map(s => `<th>${s}</th>`).join('')}<th>Total</th>`;

    const totalServ = { total: 0 };
    servicios.forEach(s => totalServ[s] = 0);
    bodyServ.innerHTML = pivServ.map(r => {
      servicios.forEach(s => totalServ[s] += Number(r[s] || 0));
      totalServ.total += Number(r.total || 0);
      return `<tr><td>${r.deliveryManager || ''}</td>${servicios.map(s => `<td>${r[s] || 0}</td>`).join('')}<td><b>${r.total || 0}</b></td></tr>`;
    }).join('') || '<tr><td colspan="99" style="text-align:center;">Sin datos.</td></tr>';

    footServ.innerHTML = `<tr style="font-weight:700;background:#FAFAFB;"><td>Total</td>${servicios.map(s => `<td>${totalServ[s] || 0}</td>`).join('')}<td>${totalServ.total || 0}</td></tr>`;

    const totalStatus = { Sus:0, Dis:0, Dev:0, Dep:0, total:0 };
    bodyStatus.innerHTML = pivStatus.map(r => {
      totalStatus.Sus += r.Sus || 0; totalStatus.Dis += r.Dis || 0; totalStatus.Dev += r.Dev || 0; totalStatus.Dep += r.Dep || 0; totalStatus.total += r.total || 0;
      return `<tr><td>${r.deliveryManager || ''}</td><td>${r.Sus || 0}</td><td>${r.Dis || 0}</td><td>${r.Dev || 0}</td><td>${r.Dep || 0}</td><td><b>${r.total || 0}</b></td></tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center;">Sin datos.</td></tr>';

    footStatus.innerHTML = `<tr style="font-weight:700;background:#FAFAFB;"><td>Total</td><td>${totalStatus.Sus}</td><td>${totalStatus.Dis}</td><td>${totalStatus.Dev}</td><td>${totalStatus.Dep}</td><td>${totalStatus.total}</td></tr>`;

    const fmtFecha = (iso) => {
      if (!iso) return '-';

      // IXB/RaaS: Azure devuelve la fecha correcta, pero new Date('YYYY-MM-DD')
      // la interpreta como UTC y en México puede mostrarse un día antes.
      // Tomamos directamente YYYY-MM-DD para conservar EXACTAMENTE el día
      // que viene de Azure (ej. Azure 18/09 -> panel 18/09).
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[3]}/${m[2]}/${m[1].slice(-2)}`;

      // Para timestamps completos, usar UTC evita el corrimiento al día anterior.
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '-';
      return String(d.getUTCDate()).padStart(2, '0') + '/' +
        String(d.getUTCMonth() + 1).padStart(2, '0') + '/' +
        String(d.getUTCFullYear()).slice(-2);
    };
    const badgeEstado = (txt) => {
      const s = String(txt || '').toLowerCase();
      let bg = '#5A28C8';
      if (s.includes('discovery')) bg = '#7B35E8';
      else if (s.includes('development')) bg = '#B92FD0';
      else if (s.includes('deployment')) bg = '#F23B68';
      else if (s.includes('suspend')) bg = '#E53935';
      return `<span style="display:inline-block;padding:3px 8px;border-radius:6px;color:#fff;font-weight:600;background:${bg};">${txt || '-'}</span>`;
    };
    const celdaPct = (pct) => {
      const n = Number(pct || 0);
      const color = n >= 80 ? '#2E7D32' : n >= 50 ? '#558B2F' : n >= 1 ? '#C62828' : '#757575';
      return `<td style="background:${color};color:#fff;font-weight:700;text-align:center;">${n}%</td>`;
    };
    const wiCells = (obj, etapaInfo) => {
      const o = obj || { total:0, cerrados:0, pendientes:0 };
      const etapaCerrada = !!(etapaInfo && etapaInfo.cerrada);
      const pendientes = Number(o.pendientes || 0);
      const estiloPend = (etapaCerrada && pendientes > 0)
        ? 'background:#E5485D;color:#fff;font-weight:800;text-align:center;border-radius:6px;'
        : '';
      return `<td>${o.total || 0}</td><td>${o.cerrados || 0}</td><td style="${estiloPend}">${pendientes}</td>`;
    };

    bodyDetalle.innerHTML = filas.map(f => `
      <tr>
        <td>${f.deliveryManager || ''}</td><td>${f.idProyecto || ''}</td><td>${f.servicio || ''}</td><td>${f.nombre || ''}</td>
        <td>${badgeEstado(f.status)}</td><td>${fmtFecha(f.fechaInicio)}</td><td>${fmtFecha(f.fechaFin)}</td>
        <td>${f.desviacionDias != null ? f.desviacionDias : '-'}</td><td>${f.budget || 0}</td><td>${f.burn || 0}</td><td>${f.etc || 0}</td><td>${f.desviacionHoras || 0}</td>
        ${celdaPct(f.avance)}
        ${wiCells((f.wi || {}).discovery, (f.etapas || {}).discovery)}
        ${wiCells((f.wi || {}).development, (f.etapas || {}).development)}
        ${wiCells((f.wi || {}).deployment, (f.etapas || {}).deployment)}
        ${wiCells((f.wi || {}).general, null)}
        <td>${(f.riesgos || []).length}</td>
      </tr>
    `).join('') || '<tr><td colspan="26" style="text-align:center;color:var(--gris);">Sin proyectos IXB/RaaS.</td></tr>';
  }

  /**
   * Inserta las tablas de "RESUMEN EJECUTIVO — VISTA DE ALTO NIVEL"
   * dentro del Dashboard general. El template tpl-reportes sigue viviendo
   * en index.html, pero ahora también se reutiliza aquí para que las tablas
   * aparezcan en la misma vista que los KPIs, salud, riesgos y resumen de
   * proyectos (no solamente en la opción de menú Reportes).
   */
  /**
   * Elimina la tabla antigua "RESUMEN DE PROYECTOS" del Dashboard general.
   * Se hace por DOM para no depender de modificar view_dashboard.html.
   */
  function eliminarResumenProyectosDashboard() {
    const tabla = document.getElementById('tabla-proyectos');
    if (!tabla) return;

    // Normalmente la tabla vive dentro de una .card. Si cambia la plantilla,
    // subimos hasta el bloque más cercano y lo retiramos completo.
    const card = tabla.closest('.card');
    if (card) {
      card.remove();
      return;
    }

    const contenedor = tabla.parentElement;
    if (contenedor) contenedor.remove();
  }

  function inyectarResumenAltoNivelEnDashboard() {
    const dashboardGeneral = document.getElementById('dashboard-general');
    const tpl = document.getElementById('tpl-reportes');

    if (!dashboardGeneral || !tpl) {
      console.warn('No se pudo insertar el Resumen de Alto Nivel: falta dashboard-general o tpl-reportes.');
      return false;
    }

    // Evita duplicarlo si el dashboard se refresca varias veces.
    if (document.getElementById('dashboard-resumen-alto-nivel')) return true;

    const wrapper = document.createElement('section');
    wrapper.id = 'dashboard-resumen-alto-nivel';
    wrapper.style.marginTop = '18px';

    const titulo = document.createElement('div');
    titulo.className = 'card';
    titulo.style.marginBottom = '14px';
    titulo.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-size:16px;font-weight:800;color:var(--negro);">
            RESUMEN EJECUTIVO — <span style="color:#9B2427;">VISTA DE ALTO NIVEL</span>
          </div>
          <div style="font-size:11px;color:var(--gris);margin-top:3px;">
            Portafolio AER / T&M e IXB / RaaS · Azure DevOps + Clockify
          </div>
        </div>
        <button class="btn" id="btn-reporte-refresh-dashboard">🔄 Actualizar tablas</button>
      </div>
    `;
    wrapper.appendChild(titulo);

    // Clonamos el template de Reportes para no duplicar el HTML manualmente.
    const contenido = tpl.content.cloneNode(true);
    const headerInterno = contenido.querySelector('.view-header');
    if (headerInterno) headerInterno.remove();

    wrapper.appendChild(contenido);
    dashboardGeneral.appendChild(wrapper);

    const btn = document.getElementById('btn-reporte-refresh-dashboard');
    if (btn) btn.onclick = cargarReportesAltoNivel;

    // Solo enlazar los filtros. La carga real se hace DESPUÉS de que el
    // Dashboard general terminó, para reutilizar el caché de Clockify.
    const filtroAER = document.getElementById('f-aertym-servicio');
    const filtroIXB = document.getElementById('f-ixbraas-servicio');
    if (filtroAER) filtroAER.onchange = () => { if (cacheReporteAERTYM) renderReporteAERTYM(cacheReporteAERTYM); };
    if (filtroIXB) filtroIXB.onchange = () => { if (cacheReporteIXB) renderReporteIXBRaaS(cacheReporteIXB); };

    asegurarLoadersReportesAltoNivel();
    return true;
  }


  /**
   * Reemplaza la tarjeta "TOP RIESGOS DEL PORTAFOLIO" con riesgos reales
   * de Azure DevOps. Severity determina Alto/Medio/Bajo.
   */
  function cargarTopRiesgosAzurePortafolio() {
    const cont = document.getElementById('top-riesgos-lista');
    if (!cont) return;

    cont.innerHTML = '<div class="loading" style="padding:18px;">Cargando riesgos desde Azure...</div>';

    google.script.run
      .withSuccessHandler((res) => {
        const actual = document.getElementById('top-riesgos-lista');
        if (!actual) return;

        if (!res || !res.ok) {
          actual.innerHTML = `<div class="alert-item" style="color:var(--rojo);">No se pudieron cargar riesgos de Azure: ${
            (res && res.error) ? res.error : 'Error desconocido'
          }</div>`;
          return;
        }

        const clienteSel = _clienteSeleccionadoDashboard();
        const clienteNorm = String(clienteSel || '').toLowerCase().trim();

        // TOP RIESGOS debe respetar el mismo filtro de Cliente del Dashboard.
        // Cada riesgo trae del backend los clientes de los proyectos internos
        // asociados al Team Project de Azure.
        const topR = (res.riesgos || []).filter(r => {
          if (!clienteNorm) return true;

          const clientes = Array.isArray(r.clientes)
            ? r.clientes
            : String(r.cliente || '').split(',');

          return clientes.some(c =>
            String(c || '').toLowerCase().trim() === clienteNorm
          );
        });

        if (!topR.length) {
          actual.innerHTML = clienteSel
            ? `<div class="alert-item">Sin riesgos Active / Proposed para ${clienteSel} 🎉</div>`
            : '<div class="alert-item">Sin riesgos Active / Proposed en Azure 🎉</div>';
          return;
        }

        const renderFilaRiesgoAzure = (r) => {
          const severityTxt = r.severity ? `Severity: ${r.severity}` : 'Severity sin valor';
          const proyectoTxt = r.proyecto || r.proyectoAzure || '';
          const estadoTxt = r.estado || '';
          const meta = [proyectoTxt, estadoTxt, severityTxt].filter(Boolean).join(' · ');

          return `
            <div class="alert-item" style="align-items:flex-start;">
              <span class="badge ${badgeClass(r.impacto)}" style="flex-shrink:0;margin-top:2px;">${r.impacto}</span>
              <span style="font-size:12px;line-height:1.45;">
                ${r.descripcion || '(Sin título)'}
                <br>
                <span style="color:var(--gris);font-size:10.5px;">${meta}</span>
              </span>
            </div>
          `;
        };

        const visibles = topR.slice(0, 3).map(renderFilaRiesgoAzure).join('');
        const ocultos = topR.slice(3).map(renderFilaRiesgoAzure).join('');

        actual.innerHTML = visibles +
          (ocultos ? `
            <div id="riesgos-ocultos" style="display:none;">${ocultos}</div>
            <div style="text-align:center;margin-top:8px;">
              <a href="#" id="toggle-ver-todos-riesgos"
                 style="font-size:12px;color:var(--beecker-purple, var(--vino));text-decoration:none;font-weight:700;">
                 Ver más (${topR.length - 3})
              </a>
            </div>
          ` : '');

        const toggle = document.getElementById('toggle-ver-todos-riesgos');
        if (toggle) {
          toggle.onclick = (ev) => {
            ev.preventDefault();
            const bloque = document.getElementById('riesgos-ocultos');
            if (!bloque) return;
            const abierto = bloque.style.display !== 'none';
            bloque.style.display = abierto ? 'none' : 'block';
            toggle.textContent = abierto
              ? `Ver más (${topR.length - 3})`
              : 'Ver menos';
          };
        }

        // Actualiza también el KPI "Riesgos Altos" si existe en las tarjetas.
        // No depende de un ID fijo: busca la card por su label.
        document.querySelectorAll('.kpi-card').forEach(card => {
          const label = card.querySelector('.kpi-label');
          const value = card.querySelector('.kpi-value');
          if (label && value && label.textContent.trim().toLowerCase() === 'riesgos altos') {
            value.textContent = String(
              topR.filter(r => String(r.impacto || '').toLowerCase() === 'alto').length
            );
          }
        });
      })
      .withFailureHandler((err) => {
        const actual = document.getElementById('top-riesgos-lista');
        if (actual) {
          actual.innerHTML = '<div class="alert-item" style="color:var(--rojo);">Error cargando riesgos de Azure: ' +
            (err && err.message ? err.message : err) + '</div>';
        }
      })
      .obtenerTopRiesgosPortafolioAzure();
  }

  let beeApiClockifyProyectos = [];
  function beeApiLlamadaClockify(metodo, args, alExito, alError) {
    const error = alError || (mensaje => beeApiMensaje(mensaje, true));
    try {
      let pendiente = true;
      const timer = setTimeout(() => {
        if (pendiente) error('Clockify sigue procesando. Revisa las ejecuciones de Apps Script y vuelve a intentar más tarde.');
      }, 45000);
      const runner = google.script.run.withSuccessHandler(r => {
        pendiente = false; clearTimeout(timer); alExito(r);
      }).withFailureHandler(e => {
        pendiente = false; clearTimeout(timer); error(e?.message || String(e));
      });
      if (typeof runner[metodo] !== 'function') {
        pendiente = false; clearTimeout(timer);
        return error('Esta pantalla y ClockifyService.gs tienen versiones distintas. Actualiza ClockifyService.gs en el mismo proyecto de Apps Script y vuelve a abrir el panel.');
      }
      runner[metodo](...args);
    } catch (e) {
      error(e?.message || String(e));
    }
  }

    visibles.forEach(p => select.add(new Option(p.nombre, p.id)));

  function beeApiGuardarVinculoClockify() {
    const id = document.getElementById('bee-api-clock-diag-id').value.trim();
    const select = document.getElementById('bee-api-clock-project');

  /** Captura del dashboard visible (sin tocar los dashboards ni sus datos). */
  function descargarDashboardComoImagen() {
    const general=document.getElementById('dashboard-general');
    const detalle=document.getElementById('dashboard-proyecto-detalle');
    const target=(detalle && getComputedStyle(detalle).display!=='none' && detalle.getBoundingClientRect().width>0) ? detalle : general;
    if(!target || !target.getBoundingClientRect().width || !target.getBoundingClientRect().height){
      alert('El dashboard todavía no termina de dibujarse. Intenta nuevamente.');return;
    }
    const btn=document.getElementById('btn-exportar-imagen');
    if(btn && btn.disabled)return;
    const textBefore=btn?btn.innerText:'';
    if(btn){btn.disabled=true;btn.innerText='⏳ Generando…';}
    const done=()=>{if(btn){btn.disabled=false;btn.innerText=textBefore;}};
    function cleanClone(doc, safeMode){
      // html2canvas puede llamar createPattern incluso por un canvas oculto
      // de 0x0 de OTRO panel. Remover TODOS en el documento clonado.
      const originalCanvases=Array.from(document.querySelectorAll('canvas'));
      Array.from(doc.querySelectorAll('canvas')).forEach((canvas,index)=>{
        const original=originalCanvases[index];
        let replacement=null;
        try{
          if(original && original.width>0 && original.height>0){
            const img=doc.createElement('img');img.src=original.toDataURL('image/png');
            img.width=Math.max(1,original.clientWidth||original.width);
            img.height=Math.max(1,original.clientHeight||original.height);
            img.style.cssText='display:block;max-width:100%;object-fit:contain';
            replacement=img;
          }
        }catch(ignore){}
        if(!replacement){
          replacement=doc.createElement('div');
          replacement.style.width=Math.max(1,canvas.clientWidth||1)+'px';
          replacement.style.height=Math.max(1,canvas.clientHeight||1)+'px';
        }
        canvas.replaceWith(replacement);
      });
      // El caso más común tras eliminar los canvas es un background-image
      // de un SVG/gradiente con ancho o alto cero: en el segundo intento
      // desactivar TODOS los patrones CSS, incluidos pseudoelementos.
      if(safeMode){
        const style=doc.createElement('style');
        style.textContent='*,*::before,*::after{background-image:none!important;mask-image:none!important;-webkit-mask-image:none!important}';
        doc.head.appendChild(style);
        doc.querySelectorAll('svg').forEach(svg=>{
          const r=svg.getBoundingClientRect();
          if(!r.width || !r.height)svg.remove();
        });
      }
    }
    async function run(){
      try{
        if(document.fonts&&document.fonts.ready){
          await Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,1000))]);
        }
        await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,180)));
        const width=Math.max(1,Math.ceil(target.scrollWidth||target.offsetWidth));
        const height=Math.max(1,Math.ceil(target.scrollHeight||target.offsetHeight));
        const scale=Math.max(.6,Math.min(2,12000/width,12000/height,Math.sqrt(35000000/(width*height))));
        async function attempt(safeMode,foreignObjectRendering){
          return html2canvas(target,{
            backgroundColor:'#f8f7ff',scale,useCORS:true,allowTaint:false,
            logging:false,scrollX:0,scrollY:-window.scrollY,
            windowWidth:Math.max(width,window.innerWidth),
            windowHeight:Math.max(height,window.innerHeight),
            foreignObjectRendering:!!foreignObjectRendering,
            onclone:doc=>cleanClone(doc,safeMode)
          });
        }
        let result, failures=[];
        for(const mode of [[false,false],[true,false],[true,true]]){
          try{result=await attempt(mode[0],mode[1]);if(result.width&&result.height)break;}
          catch(e){failures.push(e);console.warn('Captura: intento alternativo',mode,e);}
        }
        if(!result || !result.width || !result.height){
          throw failures[failures.length-1]||new Error('El resultado de la captura está vacío.');
        }
        const link=document.createElement('a');
        link.download='dashboard-'+new Date().toISOString().slice(0,10)+'.png';
        link.href=result.toDataURL('image/png');
        document.body.appendChild(link);link.click();link.remove();
      }catch(e){console.error('Error al capturar dashboard:',e);
        alert('No se pudo generar la imagen: '+(e&&e.message||String(e)));
      }finally{done();}
    }
    if(typeof html2canvas==='function'){run();return;}
    const lib=document.createElement('script');
    lib.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    lib.onload=run;
    lib.onerror=()=>{done();alert('No se pudo cargar la librería para capturas.');};
    document.head.appendChild(lib);
  }


  function populateFiltros(data) {
    const fp = document.getElementById('f-proyecto');
    const fc = document.getElementById('f-cliente');
    if (!fp || !fc || !data) return;

    const proyectoPrevio = fp.value || 'Todos los proyectos';
    const clientePrevio = fc.value || 'Todos los clientes';

    mapaMetaProyectosDashboard = {};
    (data.proyectos || []).forEach(p => {
      mapaMetaProyectosDashboard[String(p.id || '')] = p;
    });

    fp.innerHTML = '<option value="Todos los proyectos">Todos los proyectos</option>' +
      (data.proyectos || []).map(p => `<option value="${p.id}">${p.id} - ${p.nombre}</option>`).join('');
    fc.innerHTML = (data.clientes || ['Todos los clientes']).map(c => `<option>${c}</option>`).join('');

    if ([...fp.options].some(o => o.value === proyectoPrevio)) fp.value = proyectoPrevio;
    if ([...fc.options].some(o => o.value === clientePrevio)) fc.value = clientePrevio;

    fp.onchange = loadDashboard;
    fc.onchange = () => {
      if (_clienteSeleccionadoDashboard()) fp.value = 'Todos los proyectos';
      loadDashboard();
      if (_clienteSeleccionadoDashboard()) return;
      if (cacheReporteAERTYM) renderReporteAERTYM(cacheReporteAERTYM);
      if (cacheReporteIXB) renderReporteIXBRaaS(cacheReporteIXB);
      cargarTopRiesgosAzurePortafolio();
    };
  }

  function _esProyectoAERTYM(idProyecto) {
    const meta = mapaMetaProyectosDashboard[String(idProyecto || '')] || {};
    const s = String(meta.servicio || '').toUpperCase().trim();
    return s === 'AER' || s === 'T&M' || s === 'TYM';
  }

  function loadDashboard() {
    const proyectoSel = document.getElementById('f-proyecto')
      ? document.getElementById('f-proyecto').value
      : 'Todos los proyectos';
    const filtros = {
      proyecto: proyectoSel,
      cliente: document.getElementById('f-cliente') ? document.getElementById('f-cliente').value : null
    };

    const elGeneral = document.getElementById('dashboard-general');
    const elDetalle = document.getElementById('dashboard-proyecto-detalle');
    const requestId = ++dashboardRequestSeq;
    document.body.classList.toggle('bee-account-mode',!proyectoSel||proyectoSel==='Todos los proyectos'?!!_clienteSeleccionadoDashboard():false);

    const failure = (err) => {
      if (requestId !== dashboardRequestSeq) return;
      if (elDetalle && elDetalle.style.display !== 'none') {
        elDetalle.innerHTML = `<div class="card"><div style="color:var(--rojo);font-weight:700;">Error cargando proyecto</div><div style="font-size:12px;margin-top:6px;">${err && err.message ? err.message : err}</div><button class="btn" style="margin-top:12px;" onclick="loadDashboard()">Reintentar</button></div>`;
      } else {
        console.error('Error cargando dashboard:', err);
        const destino = elGeneral || document.getElementById('view-container');
        if (!destino) return;
        let caja = document.getElementById('bee-dashboard-error');
        if (!caja) {
          caja = document.createElement('div');
          caja.id = 'bee-dashboard-error';
          caja.className = 'card';
          caja.style.cssText = 'margin:16px 0;padding:18px;border:1px solid #f0c7d1;background:#fff8fa;color:#4a2240;';
          destino.prepend(caja);
        }
        caja.replaceChildren();
        const titulo = document.createElement('strong');
        titulo.textContent = 'No se pudo actualizar el Dashboard';
        const detalle = document.createElement('p');
        detalle.style.cssText = 'margin:8px 0 12px;white-space:normal;overflow-wrap:anywhere;';
        detalle.textContent = err && err.message ? err.message : String(err);
        const reintentar = document.createElement('button');
        reintentar.type = 'button'; reintentar.className = 'btn';
        reintentar.textContent = 'Reintentar';
        reintentar.onclick = loadDashboard;
        caja.append(titulo, detalle, reintentar);
      }
    };

    if (proyectoSel && proyectoSel !== 'Todos los proyectos') {
      if (elGeneral) elGeneral.style.display = 'none';
      if (elDetalle) {
        elDetalle.style.display = 'block';
        elDetalle.innerHTML = '<div class="loading">Cargando información del proyecto...</div>';
      }

      if (_esProyectoAERTYM(proyectoSel)) {
        google.script.run
          .withSuccessHandler((res) => {
            if (requestId !== dashboardRequestSeq) return;
            renderDashboardAERTYMProyecto(res);
          })
          .withFailureHandler(failure)
          .getDashboardAERTYMProyecto(proyectoSel);
      } else {
        google.script.run
          .withSuccessHandler((res) => {
            if (requestId !== dashboardRequestSeq) return;
            // IXB/SaaS/RaaS tienen renderer propio: NO utilizan ni modifican AER.
            if (_ixsEsServicio(proyectoSel)) renderDashboardIXBSaaSRaaS(res);
            else renderDashboardEjecutivoProyecto(res);
          })
          .withFailureHandler(failure)
          .getDashboardEjecutivoProyecto(proyectoSel);
      }
      return;
    }

    const cuentaSeleccionada=_clienteSeleccionadoDashboard();
    if(cuentaSeleccionada){
      if(elGeneral)elGeneral.style.display='none';
      if(elDetalle){elDetalle.style.display='block';elDetalle.innerHTML='<div class="loading">Cargando vista ejecutiva de la cuenta…</div>';}
      google.script.run.withSuccessHandler(res=>{if(requestId!==dashboardRequestSeq)return;beeCuentaRender(res,elDetalle);}).withFailureHandler(failure).obtenerVistaCuentaBeecker(cuentaSeleccionada);
      return;
    }
    if (elDetalle) elDetalle.style.display = 'none';
    if (elGeneral) elGeneral.style.display = 'block';

    google.script.run
      .withSuccessHandler((res) => {
        if (requestId !== dashboardRequestSeq) return;
        document.getElementById('bee-dashboard-error')?.remove();
        renderDashboard(res);
      })
      .withFailureHandler(failure)
      .getDashboardData(filtros);
  }

  function renderDashboard(data) {
    const elKpiGrid = document.getElementById('kpi-grid');
    if (!elKpiGrid) { console.warn('renderDashboard: vista ya no está en el DOM.'); return; }
    if (!data) { alert('El servidor no devolvió datos del dashboard.'); return; }

    const k = data.kpis;
    const d = k.delta || {};
    const margenTxt = k.margenPromedio != null ? k.margenPromedio + '%' : '—';

    const flechaDelta = (val, invertido) => {
      if (val == null) return '<span style="color:var(--gris);font-size:11px;">— vs semana anterior</span>';
      if (val === 0) return '<span style="color:var(--gris);font-size:11px;">= vs semana anterior</span>';
      const bien = invertido ? val < 0 : val > 0;
      const color = bien ? '#2E7D32' : '#C62828';
      const flecha = val > 0 ? '↑' : '↓';
      return `<span style="color:${color};font-size:11px;font-weight:600;">${flecha} ${Math.abs(val)}${typeof val === 'number' && !Number.isInteger(val) ? '' : ''} vs semana anterior</span>`;
    };

    const kpiCard = (icono, colorIcono, label, valor, deltaHtml) => `
      <div class="kpi-card" style="position:relative;padding-top:18px;">
        <div style="width:34px;height:34px;border-radius:50%;background:${colorIcono};display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;">${icono}</div>
        <div class="kpi-label">${label}</div>
        <div class="kpi-value">${valor}</div>
        <div style="margin-top:4px;">${deltaHtml}</div>
      </div>
    `;

    document.getElementById('kpi-grid').innerHTML =
      kpiCard('🏢', 'linear-gradient(135deg, #4A2A94, #E0298B)', 'Proyectos Activos', k.activos, flechaDelta(d.activos)) +
      kpiCard('📈', 'linear-gradient(135deg, #2E7D32, #66BB6A)', 'Avance Promedio', k.avancePromedio + '%', flechaDelta(d.avancePromedio)) +
      kpiCard('⏱️', 'linear-gradient(135deg, #4A2A94, #7B4FCF)', 'Horas Reales (Semana)', k.horasSemanaReal.toLocaleString() + 'h', flechaDelta(d.horasSemanaReal)) +
      kpiCard('🔴', 'linear-gradient(135deg, #C62828, #E57373)', 'Foco Rojo (Semana)', k.focoRojoSemana, flechaDelta(d.focoRojoSemana, true)) +
      kpiCard('⚠️', 'linear-gradient(135deg, #9B2427, #C62828)', 'Riesgos Altos', k.riesgosAltos, flechaDelta(d.riesgosAltos, true)) +
      kpiCard('🟡', 'linear-gradient(135deg, #F2A900, #FFC94D)', 'Margen Promedio', margenTxt, flechaDelta(d.margenPromedio));

    // ---------- Salud del portafolio (gauge tipo semicírculo) ----------

    document.getElementById('salud-portafolio').innerHTML = renderGaugeSalud(s);

    // ---------- Rentabilidad por proyecto (scatter: X=% avance, Y=margen%) ----------

    // ---------- Top riesgos del portafolio ----------
    // IMPORTANTE: esta tarjeta YA NO se pinta con data.topRiesgos (Sheets).

    // Azure. Así eliminamos la condición de carrera donde getDashboardData()
    // podía terminar después y volver a sobrescribir la tarjeta con los
    // riesgos antiguos de archivos/Sheets.
    const contRiesgosAzure = document.getElementById('top-riesgos-lista');
    if (contRiesgosAzure) {
      contRiesgosAzure.innerHTML =
        '<div class="loading" style="padding:18px;">Cargando riesgos desde Azure...</div>';
    }

    // ---------- Estado / avance / alertas (igual que antes) ----------
    document.getElementById('dona-estado').innerHTML = data.estadoDona.map(e => `
      <div class="progress-row">
        <span style="color:${e.color}">●</span> ${e.label}: <b>${e.value}</b>

    document.getElementById('avance-lista').innerHTML = data.avancePorProyecto.map(p => `
      <div class="progress-row">

        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${p.avance}%; background:${
            p.riesgo === 'Alto' ? 'var(--rojo)' : p.riesgo === 'Medio' ? 'var(--amarillo)' : 'var(--verde)'
          }"></div>

      <div class="alert-item">

        }"></span> ${a.texto}
      </div>
    `).join('') || '<div class="alert-item">Sin alertas activas</div>';

    // ---------- Tabla resumen antigua ----------

    if (tbody) tbody.innerHTML = data.tabla.map(p => {
      const margenTxt = p.margen != null ? p.margen + '%' : '—';
      const margenColor = p.margen == null ? 'inherit' : p.margen >= 0 ? 'var(--verde)' : 'var(--rojo)';
      const flechaTendencia = p.tendencia === 'up' ? '▲' : '▼';

      return `

        <td>${p.horasSemana || 0}h</td>

        <td style="color:${margenColor};font-weight:600;">${margenTxt}</td>
        <td style="color:${colorTendencia};font-weight:700;text-align:center;">${flechaTendencia}</td>
        <td>${p.budget || 0}</td>
        <td>${p.burn || 0}</td>
        <td>${p.etc || 0}</td>
        <td>${p.desviacion || 0}</td>
        <td>${p.deliveryManager || ''}</td>
      </tr>
    `;
    }).join('');

    document.getElementById('ultima-act').innerText =
      'Última actualización: ' + new Date(data.ultimaActualizacion).toLocaleString();

    // Azure es la única fuente para TOP RIESGOS DEL PORTAFOLIO.
    cargarTopRiesgosAzurePortafolio();

    // Primera carga: después de que getDashboardData terminó. Así el agregado
    // de Clockify ya quedó listo/cacheado y las tablas no compiten por el lock.
    if (!reportesBootstrapIniciado) {
      reportesBootstrapIniciado = true;
      setTimeout(cargarReportesAltoNivel, 80);
    } else {
      if (cacheReporteAERTYM) renderReporteAERTYM(cacheReporteAERTYM);
      if (cacheReporteIXB) renderReporteIXBRaaS(cacheReporteIXB);
    }
  }

  /**
   * Gauge tipo semicírculo (verde → ámbar → rojo, arco de 180°) con una
   * aguja que apunta hacia el tercio correspondiente al estado general
   * (Buena/Regular/Crítica), y los 3 conteos debajo — igual al estilo de
   * un velocímetro de salud del portafolio.
   */
  function renderGaugeSalud(s) {
    const w = 220, h = 130, cx = w / 2, cy = 115, r = 90;

    // Arco completo dividido en 3 tercios iguales (180° a 0°, izquierda a derecha)
    const arco = (anguloIni, anguloFin, color) => {
      const rad = (a) => (Math.PI * a) / 180;
      const x1 = cx + r * Math.cos(rad(anguloIni));
      const y1 = cy - r * Math.sin(rad(anguloIni));
      const x2 = cx + r * Math.cos(rad(anguloFin));
      const y2 = cy - r * Math.sin(rad(anguloFin));
      return `<path d="M ${x1} ${y1} A ${r} ${r} 0 0 0 ${x2} ${y2}" stroke="${color}" stroke-width="18" fill="none" stroke-linecap="round"/>`;
    };

    const colorEstado = { 'Buena': '#2E7D32', 'Regular': '#F2A900', 'Crítica': '#C62828' };
    const anguloAguja = { 'Buena': 150, 'Regular': 90, 'Crítica': 30 }[s.estadoGeneral] || 90;
    const radAguja = (Math.PI * anguloAguja) / 180;
    const agujaX = cx + (r - 22) * Math.cos(radAguja);
    const agujaY = cy - (r - 22) * Math.sin(radAguja);

    return `
      <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:220px;">
        ${arco(180, 120, '#2E7D32')}
        ${arco(120, 60, '#F2A900')}
        ${arco(60, 0, '#C62828')}
        <line x1="${cx}" y1="${cy}" x2="${agujaX}" y2="${agujaY}" stroke="var(--negro)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="${cx}" cy="${cy}" r="6" fill="var(--negro)"/>
        <text x="${cx}" y="${cy - 35}" font-size="10" fill="var(--gris)" text-anchor="middle">SALUD GENERAL</text>
        <text x="${cx}" y="${cy - 18}" font-size="16" font-weight="700" fill="${colorEstado[s.estadoGeneral] || '#F2A900'}" text-anchor="middle">${s.estadoGeneral}</text>
      </svg>
      <div style="display:flex;justify-content:center;gap:18px;font-size:13px;margin-top:4px;">
        <div><b style="color:var(--verde);font-size:18px;">${s.aTiempo}</b><br>A tiempo</div>
        <div><b style="color:var(--amarillo);font-size:18px;">${s.enRiesgo}</b><br>En Riesgo</div>
        <div><b style="color:var(--rojo);font-size:18px;">${s.critica}</b><br>Críticos</div>
      </div>
    `;
  }

  /**
   * Scatter simple (SVG) para "Rentabilidad por Proyecto": eje X = % Avance,
   * eje Y = Margen %, tamaño del punto = presupuesto en horas (relativo).
   * Color del punto según nivel de riesgo del proyecto.
   */
  function renderScatterRentabilidad(datos) {
    if (!datos.length) return '<div class="loading" style="padding:20px 0;">Sin datos suficientes de margen todavía.</div>';

    const w = 280, h = 180, padding = 30;
    const margenes = datos.map(d => d.margen);
    const minMargen = Math.min(0, ...margenes) - 5;
    const maxMargen = Math.max(...margenes, 5) + 5;
    const maxBudget = Math.max(...datos.map(d => d.budget || 1), 1);

    const escalaX = (avance) => padding + (avance / 100) * (w - padding * 2);
    const escalaY = (margen) => h - padding - ((margen - minMargen) / (maxMargen - minMargen)) * (h - padding * 2);
    const colorRiesgo = { 'Alto': '#C62828', 'Medio': '#F2A900', 'Bajo': '#2E7D32', '': '#9B2427' };

    const lineaCero = escalaY(0);

    const puntos = datos.map(d => {
      const r = 4 + ((d.budget || 0) / maxBudget) * 8;
      const color = colorRiesgo[d.riesgo] || '#9B2427';
      return `<circle cx="${escalaX(d.avance)}" cy="${escalaY(d.margen)}" r="${r}" fill="${color}" fill-opacity="0.75" stroke="${color}" stroke-width="1.5">
        <title>${d.nombre}: ${d.margen}% margen, ${d.avance}% avance</title>
      </circle>`;
    }).join('');

    return `
      <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
        <line x1="${padding}" y1="${lineaCero}" x2="${w - padding}" y2="${lineaCero}" stroke="var(--border)" stroke-dasharray="3,3"/>
        <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${h - padding}" stroke="var(--border)"/>
        <line x1="${padding}" y1="${h - padding}" x2="${w - padding}" y2="${h - padding}" stroke="var(--border)"/>
        <text x="${padding - 5}" y="${padding}" font-size="9" fill="var(--gris)" text-anchor="end">${maxMargen}%</text>
        <text x="${padding - 5}" y="${h - padding}" font-size="9" fill="var(--gris)" text-anchor="end">${minMargen}%</text>
        <text x="${w / 2}" y="${h - 5}" font-size="9" fill="var(--gris)" text-anchor="middle">% Avance →</text>
        ${puntos}
      </svg>
      <div style="font-size:9.5px;color:var(--gris);text-align:center;">Tamaño = presupuesto en horas · Color = nivel de riesgo</div>
    `;
  }

  const COLOR_ESTADO = { verde: '#2E7D32', amarillo: '#F2A900', rojo: '#C62828', gris: '#8D8D91' };

  function fmtFechaCorta(iso) {
    if (!iso) return '?';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '?';
    return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  /**
   * Pinta en el elemento indicado el rango de fechas (Discovery→Deployment)
   * que se está usando para consultar Clockify en la tarjeta "Carga de
   * Trabajo por Recurso". Se llama por separado del resto del render
   * porque no depende de los datos ya cargados de la tabla — solo pide el
   * rango, es una llamada chica y rápida.
   */
  function _pintarRangoClockifyProyecto(idProyecto, elementoId) {
    const el = document.getElementById(elementoId);
    if (!el || !idProyecto) return;
    el.textContent = 'Consultando rango…';

    google.script.run
      .withSuccessHandler((res) => {
        const elVigente = document.getElementById(elementoId);
        if (!elVigente) return; // vista ya cambió
        if (!res || !res.ok || !res.fechaInicio) { elVigente.textContent = ''; return; }
        elVigente.textContent = 'Clockify: ' + fmtFechaCorta(res.fechaInicio) + ' → ' + fmtFechaCorta(res.fechaFin);
      })
      .withFailureHandler(() => {
        const elVigente = document.getElementById(elementoId);
        if (elVigente) elVigente.textContent = '';
      })
      .obtenerRangoClockifyProyecto(idProyecto);
  }

  /**
   * Dona pequeña de un solo valor (0-100%) para la tarjeta "% Avance",
   * al estilo del anillo verde de la maqueta.
   */
  function renderDonutMini(pct, color) {
    const size = 76, stroke = 9, r = (size - stroke) / 2, cx = size / 2, cy = size / 2;
    const circ = 2 * Math.PI * r;
    const largo = Math.max(0, Math.min(100, pct)) / 100 * circ;
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EDEDEF" stroke-width="${stroke}"></circle>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-dasharray="${largo} ${circ - largo}" stroke-linecap="round"
          transform="rotate(-90 ${cx} ${cy})"></circle>
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" style="font-size:16px; font-weight:700; fill:var(--negro);">${Math.round(pct)}%</text>
      </svg>`;
  }

  function cargarHorasTasksProyectoClockify(idProyecto) {
    const cont = document.getElementById('clockify-task-hours-proyecto');
    if (!cont || !idProyecto) return;

    const fmtH = (n) => {
      const v = Number(n || 0);
      return (Math.round(v * 100) / 100).toLocaleString('es-MX', {
        maximumFractionDigits: 2
      }) + ' h';
    };

    google.script.run
      .withSuccessHandler((res) => {
        const actual = document.getElementById('clockify-task-hours-proyecto');
        if (!actual) return;

        if (!res || !res.ok) {
          actual.innerHTML =
            '<div style="font-size:12px;color:var(--rojo);">No se pudieron cargar horas de Clockify: ' +
            ((res && res.error) ? res.error : 'Error desconocido') + '</div>';
          return;
        }

        const tasks = res.tasks || [];
        const conHoras = tasks.filter(t => Number(t.horas || 0) > 0);
        const sinHoras = tasks.filter(t => Number(t.horas || 0) <= 0);

        const rows = conHoras.length
          ? conHoras.map(t => `
              <div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);">
                <span style="font-size:11.5px;color:var(--gris-oscuro);min-width:0;overflow-wrap:anywhere;">${t.nombre || 'Sin task'}</span>
                <b style="font-size:11.5px;white-space:nowrap;">${fmtH(t.horas)}</b>
              </div>
            `).join('')
          : '<div style="font-size:11.5px;color:var(--gris);padding:8px 0;">Sin horas asociadas a Tasks.</div>';

        const sinHorasHtml = sinHoras.length
          ? `<details style="margin-top:8px;">
               <summary style="font-size:10.5px;color:var(--gris);cursor:pointer;">
                 Ver tasks sin horas (${sinHoras.length})
               </summary>
               <div style="margin-top:4px;">
                 ${sinHoras.map(t => `
                   <div style="display:flex;justify-content:space-between;padding:5px 0;font-size:10.5px;color:var(--gris);">
                     <span>${t.nombre || 'Sin task'}</span><span>0 h</span>
                   </div>`).join('')}
               </div>
             </details>`
          : '';

        actual.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
            <div style="padding:10px;border-radius:10px;background:#F3EEFF;">
              <div style="font-size:10px;color:var(--gris);font-weight:700;">INV_OPERATIVA</div>
              <div style="font-size:20px;font-weight:800;color:#6429D8;margin-top:2px;">${fmtH(res.invOperativa)}</div>
            </div>
            <div style="padding:10px;border-radius:10px;background:#FFF0F6;">
              <div style="font-size:10px;color:var(--gris);font-weight:700;">INV_COMERCIAL</div>
              <div style="font-size:20px;font-weight:800;color:#D92D78;margin-top:2px;">${fmtH(res.invComercial)}</div>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;">
            <span style="font-size:10.5px;font-weight:700;color:var(--gris);">
              HORAS POR TASK${res.nomenclatura ? ` · ${res.nomenclatura}` : ''}
            </span>
            <span style="font-size:10.5px;color:var(--gris);">Total: <b>${fmtH(res.totalHoras)}</b></span>
          </div>
          ${res.rango ? `
            <div style="font-size:10px;color:var(--gris);margin-bottom:7px;">
              Rango: ${String(res.rango.fechaInicio || '').slice(0,10)} → ${String(res.rango.fechaFin || '').slice(0,10)}
              · Tasks activas
            </div>` : ''}

          <div style="max-height:320px;overflow:auto;padding-right:3px;">
            ${rows}
          </div>
          ${sinHorasHtml}
        `;
      })
      .withFailureHandler((err) => {
        const actual = document.getElementById('clockify-task-hours-proyecto');
        if (actual) {
          actual.innerHTML =
            '<div style="font-size:12px;color:var(--rojo);">Error cargando horas por task: ' +
            (err && err.message ? err.message : err) + '</div>';
        }
      })
      .obtenerResumenTasksTagsClockifyProyecto(idProyecto);
  }
