  function _ixsPillRisk(v){return /alto|riesgo|retras/i.test(String(v||''))?'red':/medio|atenci/i.test(String(v||''))?'orange':'green';}
  function _ixsCalcEffort(d){
    const rows=(d&&d.filasRecursosCompleto)||[], tot=(d&&d.totalesRecursos)||{}, ke=(d&&d.kpisExtra)||{};
    const round=x=>Math.round(Number(x||0)*100)/100;
    const real=Number(tot.horasReales||rows.reduce((a,x)=>a+Number(x.horasReales||0),0)||0);
    const estimadas=Number(tot.horasEstimadas||rows.reduce((a,x)=>a+Number(x.horasEstimadas||0),0)||0);
    const noFact=Number(tot.horasNoFact||rows.reduce((a,x)=>a+Number(x.horasNoFact||0),0)||0);
    const fact=Math.max(0,round(real-noFact));
    const fueraHorario=Number(ke.horasFueraHorario||d.horasFueraHorario||0);
    const balance=('balance' in tot) ? Number(tot.balance||0) : round(estimadas-real);
    return {
      real: real,
      estimadas: estimadas,
      noFact: noFact,
      fact: fact,
      fueraHorario: fueraHorario,
      pctFact: real ? (fact*100/real) : 0,
      pctNoFact: real ? (noFact*100/real) : 0,
      pctFuera: real ? (fueraHorario*100/real) : 0,
      pctConsumo: estimadas ? (real*100/estimadas) : 0,
      balance: balance,
      costoReal: Number(tot.costoReal||0),
      costoPct: Number(tot.pctCumplimientoFinanciero||ke.pctCumplimientoFinanciero||0)
    };

  function _ixsEffortDonut(title,valueA,valueB,labelA,labelB,colorA,colorB,note){

  // Clockify para IXB/SaaS/RaaS: independiente de los filtros de AER.
  function _ixsYmdLocal(v){
    const d=v instanceof Date?v:new Date(v);
    if(isNaN(d.getTime()))return '';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function _ixsSemanaActual(){
    const today=new Date(),from=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    from.setDate(from.getDate()-(from.getDay()+6)%7);
    const to=new Date(from);to.setDate(to.getDate()+6);
    return {desde:_ixsYmdLocal(from),hasta:_ixsYmdLocal(to)};
  }
  function _ixsRegistrosFiltrados(){
    const a=ixsClockifyState.desde,b=ixsClockifyState.hasta;
    return (ixsClockifyState.registros||[]).filter(x=>x.fecha&&(!a||x.fecha>=a)&&(!b||x.fecha<=b));
  }
  function _ixsActividadRows(regs){
    // Agrupación de los registros ya consultados del proyecto, sin peticiones nuevas a Clockify.
    // Las sumas utilizan los registros reales, no el corte de la semana del cuadro inferior.
    const tasks=new Map();
    (regs||[]).forEach(x=>{
      const nombre=String(x.actividad||'Sin task').trim()||'Sin task';
      const persona=String(x.recurso||'Sin recurso').trim()||'Sin recurso';
      const horas=Number(x.duracion||0);
      if(!tasks.has(nombre)) tasks.set(nombre,{nombre,horas:0,registros:0,personas:new Map()});
      const task=tasks.get(nombre);
      task.horas+=horas;
      task.registros++;
      if(!task.personas.has(persona)) task.personas.set(persona,{nombre:persona,horas:0,registros:[]});
      const recurso=task.personas.get(persona);
      recurso.horas+=horas;
      recurso.registros.push(x);
    });
    return Array.from(tasks.values()).map(task=>({
      nombre:task.nombre,horas:task.horas,registros:task.registros,
      personas:Array.from(task.personas.values())
        .sort((a,b)=>b.horas-a.horas||a.nombre.localeCompare(b.nombre,'es'))
    })).sort((a,b)=>b.horas-a.horas||a.nombre.localeCompare(b.nombre,'es'));
  }

      ${regs.map(x=>`<tr><td>${_ixsDate(x.fecha)}</td><td class="description">${_ixsTxt(x.descripcion||'Sin descripción')}</td><td>${_ixsTxt(x.inicio||'—')}</td><td>${_ixsTxt(x.fin||'—')}</td><td><b>${_ixsNum(x.duracion,2)} h</b></td><td>${x.billable?'Facturable':'No facturable'}</td><td>${x.fueraHorario===true?'⚠ Fuera de horario':'—'}</td></tr>`).join('')}

  function _ixsTrendRows(regs){
    const m=new Map();
    (regs||[]).forEach(x=>{
      const key=String(x.fecha||'').slice(0,7);
      if(!/^\d{4}-\d{2}$/.test(key))return;
      m.set(key,(m.get(key)||0)+Number(x.duracion||0));
    });
    return Array.from(m,([mes,horas])=>({mes,horas})).sort((a,b)=>a.mes.localeCompare(b.mes)).slice(-5);
  }

            </button>`).join('')}

    }
    if(chart){
      const months=_ixsTrendRows(regs),max=Math.max(1,...months.map(x=>x.horas));
      chart.innerHTML=`<div class="ixs-section-head"><h3>${_ixsIcon('chart')} Tendencia de horas</h3><small>Evolución mensual del esfuerzo</small></div>`+

    }
    if(logs){
      const filtered=_ixsRegistrosFiltrados(),preview=filtered.slice(0,5);
      logs.innerHTML=`<div class="ixs-section-head"><h3>${_ixsIcon('clock')} Detalle de registros (Clockify)</h3><small>Semana en curso por defecto</small></div>

        (st.cargando?loading:st.error?error:`<div class="ixs-table-scroll"><table class="ixs-table ixs-effort-records"><thead><tr><th>Fecha</th><th>Recurso</th><th>Actividad</th><th>Descripción</th><th>Duración</th><th>Tipo</th><th>Alerta</th></tr></thead><tbody>${preview.map(x=>`<tr><td>${_ixsDate(x.fecha)}</td><td>${_ixsTxt(x.recurso)}</td><td>${_ixsTxt(x.actividad)}</td><td class="description">${_ixsTxt(x.descripcion)}</td><td>${_ixsNum(x.duracion,2)} h</td><td>${x.billable?'Facturable':'No facturable'}</td><td>${x.fueraHorario===true?'⚠ Fuera de horario':'—'}</td></tr>`).join('')||'<tr><td colspan="7">Sin registros en el periodo seleccionado.</td></tr>'}</tbody></table></div><div class="ixs-effort-more"><button class="ixs-btn primary" onclick="ixsAbrirRegistrosClockify()">Ver más (${filtered.length})</button></div>`);

  function ixsCargarRegistrosClockify(force){
    const id=ixsProyectoActual&&ixsProyectoActual.proyecto&&ixsProyectoActual.proyecto.id;
    if(!id)return;
    const st=ixsClockifyState;
    if(st.proyectoId!==id){const w=_ixsSemanaActual();st.proyectoId=id;st.desde=w.desde;st.hasta=w.hasta;st.registros=null;st.error='';st.cargando=false;}
    if(!force && (st.cargando||Array.isArray(st.registros))){_ixsRenderClockifyWidgets();return;}
    st.cargando=true;st.error='';st.requestId++;
    const token=st.requestId;
    _ixsRenderClockifyWidgets();
    google.script.run.withSuccessHandler(res=>{
      if(st.proyectoId!==id||st.requestId!==token)return;
      st.cargando=false;
      if(!res||!res.ok){st.registros=[];st.error=res&&res.error||'No fue posible obtener los registros de Clockify.';}
      else{st.registros=Array.isArray(res.registros)?res.registros:[];st.error='';}
      _ixsRenderClockifyWidgets();
    }).withFailureHandler(err=>{
      if(st.proyectoId!==id||st.requestId!==token)return;
      st.cargando=false;st.error=err&&err.message||String(err);st.registros=[];
      _ixsRenderClockifyWidgets();
    }).getRegistrosClockifyProyecto(id);
  }

  function ixsRaidNivel(v){
    const n=String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

  function ixsRaidCrear(btn){

    {
      const cfg=ixsRaidState.altaOpciones||{};

  function _ixsAzureMatchProject(item, pid){
    const base=String(pid||'').trim();
    if(!base)return true;
    const raw=[item&&item.titulo,item&&item.req,item&&item.url,item&&item.proyecto,item&&item.areaPath].filter(Boolean).join(' | ');
    const up=raw.toUpperCase();
    const pidUp=base.toUpperCase();
    const compact=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]+/g,'');
    return up.indexOf(pidUp)>=0 || compact(up).indexOf(compact(pidUp))>=0;
  }
  function _ixsAzureReq(title){
    const s=String(title||'').trim();
    return (s.match(/[A-Z]{2,}\.[0-9]{3}(?:\.[0-9]{3})+/i)||s.match(/[A-Z]{2,}\.[0-9]{3}(?:_[A-Z0-9]+)?/i)||[])[0]||'—';
  }
  function _ixsAzureTitleOnly(title){
    const s=String(title||'').trim(); const req=_ixsAzureReq(s);
    if(req==='—') return s;
    return s.replace(req,'').replace(/^[-–—:|\s]+/,'').trim() || s;
  }
  function _ixsAzureStatusClass(estado){
    const e=String(estado||'').toLowerCase();
    if(['not applicable','cancelled','closed','rejected','completed','inactive'].includes(e)) return 'closed';
    if(e.includes('block')||e.includes('escalad')||e.includes('risk')) return 'blocked';
    if(e.includes('proposed')||e.includes('nuevo')) return 'proposed';
    if(e.includes('active')||e.includes('activ')||e.includes('progress')||e.includes('resolved')) return 'active';
    return 'other';
  }
  function _ixsAzureStatusDot(estado){
    const cls=_ixsAzureStatusClass(estado);
    return cls==='closed'?'#1ca66d':cls==='proposed'?'#4b8ef1':cls==='blocked'?'#e53051':cls==='active'?'#7e4bf0':'#948fb0';
  }
  function _ixsAzureEscapeAttr(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function _ixsLoadAzureDevOpsTab(force){
    if(!ixsProyectoActual||!ixsProyectoActual.proyecto)return;
    const pid=ixsProyectoActual.proyecto.id;
    const requestId=++ixsAzureState.requestId;

    });
    google.script.run.withSuccessHandler(res=>{
      if(requestId!==ixsAzureState.requestId)return;
      const shell=document.querySelector('.ixs-shell');
      if(!shell||shell.dataset.ixsProyecto!==pid||ixsTabActual!=='azure')return;
      if(!res||!res.ok){
        const msg='No se pudo cargar Azure para '+_ixsTxt(pid)+': '+_ixsTxt(res&&res.error||'Respuesta inesperada');

      }

      const stale=Array.isArray(res.stale)?res.stale:[];
      ixsAzureState={projectId:pid,requestId,sinPAT:false,error:'',notice:res.aviso||'',items:detail,allItems:all,stale};
      _ixsRenderAzureSummary();
      ixsAzureApplyFilters();
      _ixsAz84RenderGroups();
    }).withFailureHandler(err=>{
      if(requestId!==ixsAzureState.requestId)return;
      const msg='Error al consultar Azure DevOps: '+_ixsTxt(err&&err.message||err);
      ['ixs-azure-kpis','ixs-azure-stale','ixs-azure-health','ixs-azure-table','ixs-az84-person','ixs-az84-stage'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='<div class="ixs-azure-empty">'+msg+'</div>';});
    }).obtenerPanelAzureProyectoIXS(pid,!!force);

  function _ixsAzureUniqueOptions(rows,key){

  function _ixsAzureRenderSelect(id, vals, placeholder){

    const current=el.value;
    el.innerHTML=`<option value="">${_ixsTxt(placeholder)}</option>`+vals.map(v=>`<option value="${_ixsAzureEscapeAttr(v)}">${_ixsTxt(v)}</option>`).join('');

  function _ixsRenderAzureSummary(){
    const items=ixsAzureState.items||[], all=ixsAzureState.allItems||items, stale=ixsAzureState.stale||[];
    _ixsAzureRenderSelect('ixs-azure-filter-estado', _ixsAzureUniqueOptions(items,'estado'), 'Estado');
    _ixsAzureRenderSelect('ixs-azure-filter-asignado', _ixsAzureUniqueOptions(items,'asignadoA'), 'Asignado');
    _ixsAzureRenderSelect('ixs-azure-filter-tipo', _ixsAzureUniqueOptions(items,'tipo'), 'Tipo');

    const total=all.length;
    const closed=all.filter(x=>_ixsAzureStatusClass(x.estado)==='closed').length;
    const qa=items.filter(x=>!!x.qaListo).length;
    const avg=items.length?Math.round(items.reduce((a,b)=>a+(Number(b.avanceTotal)||0),0)/items.length):0;
    const riskIds=new Set();
    stale.forEach(x=>{if(/risk|issue|block/i.test(String(x.tipo||''))||_ixsAzureStatusClass(x.estado)==='blocked') riskIds.add(String(x.id||x.titulo||Math.random()));});
    all.forEach(x=>{if(_ixsAzureStatusClass(x.estado)==='blocked') riskIds.add(String(x.id||x.titulo||Math.random()));});
    const riskCount=riskIds.size;
    const kpiWrap=document.getElementById('ixs-azure-kpis');
    if(kpiWrap)kpiWrap.innerHTML=`
      ${_ixsKpi('layers','Work items del proyecto', total, 'Total consultado en Azure', null)}
      ${_ixsKpi('clock','Sin seguimiento +7 días', stale.length, stale.length?'Requieren seguimiento':'Todo al día', null, stale.length?'red':'green')}
      ${_ixsKpi('warning','En riesgo', riskCount, riskCount?'Con alerta o bloqueo':'Sin alertas críticas', null, riskCount?'red':'green')}
      ${_ixsKpi('check','Cerrados', closed, total?`${_ixsPct((closed*100)/total)} del total`:'Sin datos', null, 'green')}
      ${_ixsKpi('target','QA listos', qa, total?`${_ixsPct((qa*100)/total)} del total`: 'Sin datos', null)}
      ${_ixsKpi('chart','Avance promedio', avg + '%', 'To Be / Change Request', avg, avg>=80?'green':avg>=50?'':'red')}`;

    const counts={Closed:0,Active:0,Proposed:0,Blocked:0,Other:0};
    all.forEach(x=>{const cls=_ixsAzureStatusClass(x.estado); if(cls==='closed') counts.Closed++; else if(cls==='active') counts.Active++; else if(cls==='proposed') counts.Proposed++; else if(cls==='blocked') counts.Blocked++; else counts.Other++;});
    const colors={Closed:'#6cd18b',Active:'#ad8cff',Proposed:'#7eb6ff',Blocked:'#ff819b',Other:'#ddd7fb'};
    const entries=Object.entries(counts).filter(x=>x[1]>0);
    const totalDist=entries.reduce((a,b)=>a+b[1],0) || 1;
    let acc=0; const stops=[];
    entries.forEach(([name,val],i)=>{const start=acc*100/totalDist; acc+=val; const end=acc*100/totalDist; stops.push(`${colors[name]} ${start}% ${end}%`);});
    const donut='conic-gradient('+(stops.length?stops.join(', '):'#ece9fa 0 100%')+')';
    const notes=[];
    notes.push({cls:stale.length?'bad':'',text:stale.length?`${stale.length} ítems sin seguimiento por más de 7 días.`:'No hay ítems sin seguimiento por más de 7 días.'});
    notes.push({cls:total&&closed>total/2?'':'warn',text:total&&closed>total/2?'La mayoría de los Work Items ya está cerrada.':'Hay Work Items que siguen abiertos.'});
    if(riskCount) notes.push({cls:'warn',text:`${riskCount} ítems con riesgo o bloqueo registrado.`});
    notes.push({cls:avg>=80?'':'warn',text:`Avance promedio de ${avg}% en los Work Items con seguimiento de avance.`});
    const health=document.getElementById('ixs-azure-health');
    if(health)health.innerHTML=`<div class="ixs-azure-health-v85">
      <div class="ixs-donut" style="background:${donut}"><div class="ixs-donut-center"><b>${total}</b><small>Work Items</small></div></div>
      <div class="ixs-az85-quick">${notes.map(n=>`<p class="ixs-azure-health-note"><span class="dot ${n.cls}">${n.cls==='bad'?'!':n.cls==='warn'?'!':'✓'}</span><span>${_ixsTxt(n.text)}</span></p>`).join('')}</div>
      <div class="ixs-az85-legend">${entries.map(([name,val])=>`<div class="ixs-az85-legend-item"><span class="sw" style="background:${colors[name]}"></span><span class="name">${_ixsTxt(name)}</span><b>${val}</b><small>${Math.round(val*100/totalDist)}%</small></div>`).join('')}</div>
    </div>`;

    const staleEl=document.getElementById('ixs-azure-stale');
    if(staleEl){
      if(!stale.length) staleEl.innerHTML='<div class="ixs-azure-empty">Todo al día: no hay work items sin seguimiento por más de 7 días.</div>';
      else {
        const staleSorted=stale.sort((a,b)=>(Number(b.diasSinActualizar)||0)-(Number(a.diasSinActualizar)||0)).slice(0,8);
        const staleVisible=3;
        const staleExtra=Math.max(0,staleSorted.length-staleVisible);

  function _ixsAz84Status(state){
    const v=String(state||'').trim().toUpperCase();
    if(v==='CANCELLED')return 'cancelled';
    if(['NOT APPLICABLE','CLOSED','REJECTED','COMPLETED','INACTIVE'].includes(v))return 'closed';
    if(v==='ACTIVE')return 'active';
    if(v==='PROPOSED')return 'proposed';
    if(v==='BLOCKED')return 'blocked';
    return 'other';
  }
  function _ixsAz84Stage(path){
    const p=String(path||'').trim();
    return p?p.split('\\').filter(Boolean).pop():'Sin iteración';
  }
  function _ixsAz84Key(person,stage){return JSON.stringify([person,stage]);}
  function _ixsAz84GroupData(){
    const arr=Array.isArray(ixsAzureState.allItems)?ixsAzureState.allItems:[];
    const people=new Map(),stages=new Map();
    arr.forEach(it=>{
      const person=String(it.asignadoA||'Sin asignar').trim()||'Sin asignar';
      const rawPath=String(it.iterationPath||'').trim();
      const stage=_ixsAz84Stage(rawPath);
      const stageKey=rawPath||'Sin iteración';
      const status=_ixsAz84Status(it.estado);
      if(!people.has(person))people.set(person,{persona:person,items:[],iteraciones:new Map(),closed:0,active:0,proposed:0,cancelled:0,other:0});
      const p=people.get(person);
      p.items.push(it);p[status in p?status:'other']++;
      if(!p.iteraciones.has(stageKey))p.iteraciones.set(stageKey,{persona:person,etapa:stage,iterationPath:stageKey,items:[],closed:0,active:0,proposed:0,cancelled:0,other:0});
      const sub=p.iteraciones.get(stageKey);sub.items.push(it);sub[status in sub?status:'other']++;
      if(!stages.has(stageKey))stages.set(stageKey,{etapa:stage,iterationPath:stageKey,items:[],active:0,proposed:0,blocked:0,other:0});
      const g=stages.get(stageKey);
      if(status!=='closed'&&status!=='cancelled'){
        g.items.push(it);g[status in g?status:'other']++;
      }
    });
    return {
      people:Array.from(people.values()).map(p=>({
        ...p,total:p.items.length,
        iteraciones:Array.from(p.iteraciones.values()).sort((a,b)=>b.items.length-a.items.length||a.etapa.localeCompare(b.etapa,'es'))
      })).sort((a,b)=>b.total-a.total||a.persona.localeCompare(b.persona,'es')),
      stages:Array.from(stages.values()).filter(x=>x.items.length).sort((a,b)=>b.items.length-a.items.length||a.etapa.localeCompare(b.etapa,'es'))
    };
  }

  function renderDashboardEjecutivoProyecto(data) {

    let colorEstado = COLOR_ESTADO[p.estadoColor] || COLOR_ESTADO.verde;

    // ---- Gantt profesional (Plan Estimado vs Ejecucion Real), inspirado en
    // Azure DevOps / MS Project. Usa EXACTAMENTE los mismos datos que ya
    // devuelve el backend (data.hitos, data.historialCompleto, data.suspensiones):
    // no se agregan llamadas nuevas ni se cambia la logica del servidor.
    let ganttHtml = '<div style="font-size:12px;color:var(--gris)">Agrega la hoja Historico_Proyectos con las fases planeadas (ej. "Discovery EST") para ver esta sección.</div>';
    let hitosResumenCorregido = []; // se llena abajo reutilizando estadoEtapaReal (misma lógica del Gantt)
    let proyectoCompletadoDetectado = false; // se llena abajo: ultima fase (Deployment) Completado y no suspendido
    if (data.hitos && data.hitos.length) {
      const historialCompleto = data.historialCompleto || [];
      const suspensiones = data.suspensiones || [];
      const COLOR_TIPO = {
        plan: '#C9C9CD',
        real: '#4A2A94',
        suspendido: '#F2A900',
        completado: '#2E7D32'
      };

      const msDia = 24 * 60 * 60 * 1000;
      const diffDias = (a, b) => Math.round((b - a) / msDia);
      const fmtDiaMes = (iso) => {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '?';
        return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
      };

      // --- Filas de PLAN ESTIMADO (linea base, nunca cambia) ---
      // --- Hitos adicionales (Demo, Pase a QA, etc.): se calculan aquí para
      // poder asignarlos a la fila de ejecución que les corresponda por fecha ---
      const ahoraMs = Date.now();
      const marcadoresAdicionales = (data.hitosAdicionales || []).map(h => {
        const partes = String(h.fecha || '').split('/');
        if (partes.length !== 3) return null;
        const d = new Date(Number(partes[2]), Number(partes[1]) - 1, Number(partes[0]));
        if (isNaN(d.getTime())) return null;
        const cat = categoriaHito(h.tipo);
        return { tipo: h.tipo, tiempo: d.getTime(), icono: cat.icono, etiquetaCategoria: cat.etiqueta, indice: h.indice, observacion: h.observacion, fechaStr: h.fecha };
      }).filter(Boolean);

      /**
       * Asigna cada marcador a la fila de EJECUCIÓN cuya fecha lo contenga
       * (entre inicio y fin, o hasta hoy si sigue en curso), para pintarlo
       * pegado a esa barra específica en vez de flotar sin relación visual.
       * Si no cae en ninguna fila, se asigna a la más cercana por fecha.
       */
      function marcadoresAdicionalesAsignar(filas, marcadores) {
        marcadores.forEach(m => {
          let filaElegida = null;
          filas.forEach(f => {
            if (f.tipo !== 'real') return;
            const i0 = new Date(f.inicio).getTime();
            const i1 = f.enCurso ? ahoraMs : new Date(f.fin).getTime();
            if (m.tiempo >= i0 && m.tiempo <= i1) filaElegida = f;
          });
          if (!filaElegida) {
            // respaldo: la fila real mas cercana en el tiempo
            let mejorDist = Infinity;
            filas.forEach(f => {
              if (f.tipo !== 'real') return;
              const i0 = new Date(f.inicio).getTime();
              const dist = Math.abs(m.tiempo - i0);
              if (dist < mejorDist) { mejorDist = dist; filaElegida = f; }
            });
          }
          if (filaElegida) {
            if (!filaElegida.marcadores) filaElegida.marcadores = [];
            filaElegida.marcadores.push(m);
          }
        });
      }

      const filasPlan = data.hitos
        .filter(h => h.fechaInicioPlan && h.fechaFinPlan)
        .map(h => ({ etiqueta: h.nombre + ' EST', inicio: h.fechaInicioPlan, fin: h.fechaFinPlan, tipo: 'plan' }));

      // --- Filas de EJECUCION REAL: cada registro tal cual viene, en orden
      // cronologico (Discovery OP, Discovery, Development, Suspendido, etc.) ---
      // Fusionar TODAS las ocurrencias reales de una misma fase (puede haber
      // más de un "Discovery" si hubo suspensiones y reanudaciones) en una
      // sola barra: fecha de inicio = la más temprana registrada (ej. la de
      // "Discovery OP"), fecha fin = la más tardía registrada para esa fase.
      const fasesUnicas = {};
      historialCompleto.filter(h => h.fechaInicio).forEach(h => {
        const clave = h.fase.toLowerCase();
        if (!fasesUnicas[clave]) {
          fasesUnicas[clave] = { etiqueta: h.fase, inicio: h.fechaInicio, fin: h.fechaFin || h.fechaInicio, tipo: 'real', enCurso: !!h.enCurso };
        } else {
          const f = fasesUnicas[clave];
          if (new Date(h.fechaInicio) < new Date(f.inicio)) f.inicio = h.fechaInicio;
          const finCandidato = h.fechaFin || h.fechaInicio;
          if (!f.enCurso && (h.enCurso || new Date(finCandidato) > new Date(f.fin))) {
            f.fin = finCandidato;
          }
          if (h.enCurso) f.enCurso = true;
        }
      });

      const filasReal = Object.values(fasesUnicas)
        .concat(
          suspensiones.filter(s => s.fechaInicio).map(s => ({
            etiqueta: 'Suspendido',
            inicio: s.fechaInicio,
            fin: s.fechaFin || s.fechaInicio,
            tipo: 'suspendido'
          }))
        )
        .sort((a, b) => new Date(a.inicio) - new Date(b.inicio));

      // Asignar cada marcador adicional a la fila de EJECUCIÓN cuya fecha
      // lo contenga (para pintarlo pegado a esa barra, no flotando aparte).
      marcadoresAdicionalesAsignar(filasReal, marcadoresAdicionales);

      // Marcador de cierre (Completed): se infiere del estado general del
      // proyecto + la fecha real mas tardia, sin inventar una fecha nueva.
      if (p.estadoGeneral === 'CERRADO' && filasReal.length) {
        const finesMs = filasReal.map(f => new Date(f.fin).getTime()).filter(t => !isNaN(t));
        if (finesMs.length) {
          const maxFin = new Date(Math.max.apply(null, finesMs)).toISOString();
          filasReal.push({ etiqueta: 'Completed (Cierre real)', inicio: maxFin, fin: maxFin, tipo: 'completado' });
        }
      }

      // --- Escala de tiempo compartida por ambas secciones ---
      const todasFechas = [];
      filasPlan.concat(filasReal).forEach(f => {
        [f.inicio, f.fin].forEach(v => { const d = new Date(v); if (!isNaN(d.getTime())) todasFechas.push(d.getTime()); });
      });

      /**
       * Estado real de una etapa de EJECUCIÓN:
       *  - 'Suspendida': el inicio de una suspensión cae DENTRO del rango
       *    de esta etapa Y esa suspensión termina DESPUÉS del fin de la
       *    etapa (la rebasa). Si la suspensión ya terminó antes/dentro del
       *    rango de la etapa, ya no cuenta como interrupción activa.
       *  - 'Pendiente': hoy todavía no llega a la fecha de inicio.
       *  - 'En curso': hoy cae dentro del rango [inicio, fin], o la etapa
       *    no tiene fin registrado (enCurso segun el backend).
       *  - 'Completado': hoy ya pasó el fin registrado.
       */
      function estadoEtapaReal(f) {
        const inicioMs = new Date(f.inicio).getTime();
        const finMs = f.enCurso ? null : new Date(f.fin).getTime();
        const finEfectivo = (finMs != null && !isNaN(finMs)) ? finMs : ahoraMs;

        // Caso A: la suspension EMPEZÓ mientras la etapa estaba en curso ->
        // la etapa sí arrancó y se interrumpió a medias.
        const suspendidaDurante = suspensiones.some(s => {
          const sIni = new Date(s.fechaInicio).getTime();
          const sFin = s.fechaFin ? new Date(s.fechaFin).getTime() : sIni;
          if (isNaN(sIni)) return false;
          return sIni >= inicioMs && sIni <= finEfectivo && sFin > finEfectivo;
        });
        if (suspendidaDurante) return { texto: 'Suspendida', color: COLOR_TIPO.suspendido };

        // Caso B: una suspension YA ESTABA ACTIVA antes de que la etapa
        // empezara y no se resolvió antes de su fin -> la etapa nunca
        // llegó a arrancar de verdad, aunque tenga fechas registradas.
        const cubiertaPorSuspension = suspensiones.some(s => {
          const sIni = new Date(s.fechaInicio).getTime();
          const sFin = s.fechaFin ? new Date(s.fechaFin).getTime() : sIni;
          if (isNaN(sIni)) return false;
          return sIni <= inicioMs && sFin >= finEfectivo;
        });
        if (cubiertaPorSuspension) return { texto: 'Pendiente', color: '#8D8D91' };

        if (f.enCurso) return { texto: 'En curso', color: COLOR_TIPO.real };
        if (isNaN(finMs)) return { texto: 'Completado', color: COLOR_TIPO.completado };
        if (ahoraMs < inicioMs) return { texto: 'Pendiente', color: '#8D8D91' };
        // Comparar por DÍA CALENDARIO, no por hora exacta: si la fecha fin
        // es hoy mismo, la etapa sigue "En curso" hasta que termine el día,
        // no se marca Completado apenas entra la fecha.
        const diaHoy = new Date(ahoraMs); diaHoy.setHours(0, 0, 0, 0);
        const diaFin = new Date(finMs); diaFin.setHours(0, 0, 0, 0);
        if (diaHoy.getTime() <= diaFin.getTime()) return { texto: 'En curso', color: COLOR_TIPO.real };
        return { texto: 'Completado', color: COLOR_TIPO.completado };
      }

      // --- Resumen corregido para la tarjeta "HITOS DEL PROYECTO": usa la
      // MISMA lógica de estadoEtapaReal (fecha de hoy + suspensión que
      // rebasa) en vez del estado más simple que trae data.hitos[].estado ---
      const mapaUltimaOcurrencia = {};
      filasReal.filter(f => f.tipo === 'real').forEach(f => { mapaUltimaOcurrencia[f.etiqueta.toLowerCase()] = f; });

      data.hitos.forEach(h => {
        const match = mapaUltimaOcurrencia[h.nombre.toLowerCase()];
        let estadoTexto = 'Pendiente';
        if (match) estadoTexto = estadoEtapaReal(match).texto;

        // Si hay ejecución real registrada, mostrar SUS fechas (las mismas
        // que pinta el Gantt, ya fusionadas por si hubo reanudaciones), no
        // las fechas planeadas — evita la discrepancia entre esta tarjeta
        // y el Gantt cuando la ejecución real se corrió de las fechas plan.
        const fechaInicioMostrar = match ? match.inicio : h.fechaInicioPlan;
        const fechaFinMostrar = match ? (match.enCurso ? new Date(ahoraMs).toISOString() : match.fin) : h.fechaFinPlan;

        hitosResumenCorregido.push({
          nombre: h.nombre,
          fechaInicioPlan: fechaInicioMostrar,
          fechaFinPlan: fechaFinMostrar,
          estado: estadoTexto,
          esAdicional: false
        });
      });

      // Hitos adicionales (Demo, QA, etc.) también entran al resumen:
      // Completado si su fecha ya pasó, Pendiente si es futura O si cae
      // dentro de un período de suspensión (aunque la fecha ya haya pasado).
      function fechaDentroDeSuspension(tiempoMs) {
        return suspensiones.some(s => {
          const sIni = new Date(s.fechaInicio).getTime();
          const sFin = s.fechaFin ? new Date(s.fechaFin).getTime() : sIni;
          return !isNaN(sIni) && tiempoMs >= sIni && tiempoMs <= sFin;
        });
      }

      marcadoresAdicionales.forEach(m => {
        const dentroDeSuspension = fechaDentroDeSuspension(m.tiempo);
        hitosResumenCorregido.push({
          nombre: m.icono + ' ' + nombreLimpioHito(m.tipo),
          fechaInicioPlan: null,
          fechaFinPlan: new Date(m.tiempo).toISOString(),
          estado: dentroDeSuspension ? 'Pendiente' : (m.tiempo <= ahoraMs ? 'Completado' : 'Pendiente'),
          esAdicional: true,
          tipoOriginal: m.tipo,
          indice: m.indice,
          observacion: m.observacion
        });
      });

      // Proyecto completado: la ÚLTIMA fase principal (Deployment, según
      // el orden cronológico de data.hitos) quedó Completada, y el
      // proyecto no está marcado como Suspendido/Cerrado en Proyectos.
      const fasesPrincipales = hitosResumenCorregido.filter(h => !h.esAdicional);
      const ultimaFasePrincipal = fasesPrincipales.length ? fasesPrincipales[fasesPrincipales.length - 1] : null;
      proyectoCompletadoDetectado = !!ultimaFasePrincipal
        && ultimaFasePrincipal.estado === 'Completado'
        && p.estadoGeneral !== 'CERRADO'
        && p.estadoGeneral !== 'CANCELADO';

      marcadoresAdicionales.forEach(m => todasFechas.push(m.tiempo));

      todasFechas.push(ahoraMs);
      const minT = Math.min.apply(null, todasFechas);
      const maxT = Math.max.apply(null, todasFechas);
      const rango = Math.max(maxT - minT, msDia);
      const PAD_IZQ = 230; // ancho fijo de la columna de etiquetas

      // Encabezado de meses agrupado por año
      const meses = [];
      let cursor = new Date(minT); cursor.setDate(1);
      const finEje = new Date(maxT);
      while (cursor <= finEje) { meses.push(new Date(cursor)); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); }
      let aniosHtml = '', mesesHtml = '';
      let i = 0;
      while (i < meses.length) {
        const anio = meses[i].getFullYear();
        let span = 0;
        while (i + span < meses.length && meses[i + span].getFullYear() === anio) span++;
        aniosHtml += `<div style="flex:${span}; text-align:center; font-size:11px; font-weight:700; color:var(--gris-oscuro);">${anio}</div>`;
        i += span;
      }
      mesesHtml = meses.map(m => `<div style="flex:1; text-align:center; font-size:10px; font-weight:600; color:var(--gris); text-transform:uppercase; border-left:1px solid var(--border); padding:2px 0;">${m.toLocaleDateString('es-MX', { month: 'short' })}</div>`).join('');

      const lineasVerticales = `<div style="position:absolute; inset:0; display:flex;">${meses.map(() => '<div style="flex:1; border-left:1px solid #F0F0F1;"></div>').join('')}</div>`;

      const posHoy = ((ahoraMs - minT) / rango) * 100;
      const lineaHoy = (posHoy >= 0 && posHoy <= 100)
        ? `<div style="position:absolute; top:-18px; bottom:0; left:${posHoy}%; width:0; border-left:2px dashed #8D8D91; z-index:2;">
             <div style="position:absolute; top:0; left:50%; transform:translateX(-50%); font-size:9px; color:var(--gris); font-weight:700; white-space:nowrap; background:#fff; padding:0 3px;">HOY</div>
           </div>`
        : '';

      const renderFila = (f) => {
        const color = COLOR_TIPO[f.tipo];
        const i0 = new Date(f.inicio).getTime();
        const i1 = f.tipo === 'real' && f.enCurso ? ahoraMs : new Date(f.fin).getTime();
        const left = ((i0 - minT) / rango) * 100;
        const width = Math.max(0.5, ((i1 - i0) / rango) * 100);
        const dias = diffDias(i0, i1);

        let barra;
        if (f.tipo === 'completado') {
          barra = `<div style="position:absolute; left:${left}%; transform:translateX(-50%); top:50%; margin-top:-8px; width:16px; height:16px; border-radius:50%; background:${color}; border:3px solid #fff; box-shadow:0 0 0 1.5px ${color};"></div>`;
        } else if (f.tipo === 'suspendido') {
          barra = `<div style="position:absolute; left:${left}%; width:${width}%; top:50%; transform:translateY(-50%); height:11px; border-radius:6px; background:repeating-linear-gradient(45deg, ${color}, ${color} 4px, #fff 4px, #fff 8px); border:1.5px solid ${color};"></div>`;
        } else if (f.tipo === 'plan') {
          barra = `<div style="position:absolute; left:${left}%; width:${width}%; top:50%; transform:translateY(-50%); height:7px; border-radius:5px; background:${color};"></div>`;
        } else {
          const brillo = f.enCurso ? `box-shadow:0 0 0 3px rgba(155,36,39,.18);` : '';
          barra = `<div style="position:absolute; left:${left}%; width:${width}%; top:50%; transform:translateY(-50%); height:13px; border-radius:7px; background:${color}; ${brillo}"></div>`;
        }

        const rangoTexto = f.tipo === 'completado'
          ? fmtDiaMes(f.inicio)
          : `${fmtDiaMes(f.inicio)} – ${fmtDiaMes(f.fin)}${dias > 0 ? ' · ' + dias + ' día' + (dias === 1 ? '' : 's') : ''}`;

        let badgeEstado = '';
        if (f.tipo === 'real') {
          const est = estadoEtapaReal(f);
          badgeEstado = `<span style="display:inline-block; margin-left:6px; padding:1px 7px; border-radius:10px; font-size:9px; font-weight:700; color:#fff; background:${est.color};">${est.texto}</span>`;
        }

        const iconosOverlay = (f.marcadores || []).map(m => {
          const leftIcono = ((m.tiempo - minT) / rango) * 100;
          return `<div title="${m.tipo}" style="position:absolute; left:${leftIcono}%; transform:translateX(-50%); top:-10px; font-size:13px; cursor:default; z-index:3;">${m.icono || '📌'}</div>`;
        }).join('');

        return `
          <div style="display:flex; align-items:center; min-height:30px; position:relative;">
            <div style="width:${PAD_IZQ}px; flex-shrink:0; padding-right:12px;">
              <div style="font-size:12px; font-weight:600; color:var(--gris-oscuro);">${f.etiqueta}${badgeEstado}</div>
              <div style="font-size:10px; color:${color}; font-weight:500;">${rangoTexto}</div>
            </div>
            <div style="flex:1; position:relative; height:22px;">${barra}${iconosOverlay}</div>
          </div>`;
      };

      const seccion = (titulo, filas) => filas.length ? `
        <div style="font-size:10.5px; font-weight:700; color:var(--gris); letter-spacing:.5px; margin:10px 0 6px;">${titulo}</div>
        ${filas.map(renderFila).join('')}
      ` : '';

      // --- Leyenda: una entrada por CATEGORÍA GENERAL de hito adicional
      // presente (ej. todas las "Demostraciones" comparten un solo ícono),
      // no por el texto literal específico de cada instancia ---
      const categoriasLeyenda = {};
      marcadoresAdicionales.forEach(m => {
        if (!categoriasLeyenda[m.etiquetaCategoria]) categoriasLeyenda[m.etiquetaCategoria] = m.icono;
      });
      const leyendaAdicional = Object.keys(categoriasLeyenda).map(etq => `
        <span>${categoriasLeyenda[etq]} ${etq}</span>
      `).join('');

      ganttHtml = `
        <div style="overflow-x:auto;">
          <div style="min-width:640px;">
            <div style="display:flex; padding-left:${PAD_IZQ}px;">${aniosHtml}</div>
            <div style="display:flex; padding-left:${PAD_IZQ}px; border-bottom:2px solid var(--border); padding-bottom:4px; margin-bottom:4px;">${mesesHtml}</div>
            <div style="position:relative;">
              <div style="position:absolute; top:0; bottom:0; left:${PAD_IZQ}px; right:0;">${lineasVerticales}${lineaHoy}</div>
              <div style="position:relative;">
                ${seccion('PLAN ESTIMADO (LÍNEA BASE)', filasPlan)}
                ${seccion('EJECUCIÓN REAL', filasReal)}
              </div>
            </div>
            <div style="display:flex; gap:18px; font-size:10.5px; color:var(--gris); margin-top:12px; padding-top:10px; border-top:1px solid var(--border); flex-wrap:wrap; align-items:center;">
              <span><span style="display:inline-block;width:14px;height:7px;background:${COLOR_TIPO.plan};border-radius:4px;margin-right:5px;vertical-align:middle;"></span>Planeación</span>
              <span><span style="display:inline-block;width:14px;height:9px;background:${COLOR_TIPO.real};border-radius:5px;margin-right:5px;vertical-align:middle;"></span>Ejecución</span>
              <span><span style="display:inline-block;width:14px;height:7px;background:repeating-linear-gradient(45deg, ${COLOR_TIPO.suspendido}, ${COLOR_TIPO.suspendido} 3px, #fff 3px, #fff 6px); border:1px solid ${COLOR_TIPO.suspendido}; border-radius:4px;margin-right:5px;vertical-align:middle;"></span>Suspendido</span>
              <span><span style="display:inline-block;width:10px;height:10px;background:${COLOR_TIPO.completado};border-radius:50%;margin-right:5px;vertical-align:middle;"></span>Completado</span>
              ${leyendaAdicional}
            </div>
          </div>
        </div>`;
    }

    // Si el proyecto realmente terminó (Deployment Completado, no
    // suspendido), sobrescribimos el Estado General y el badge de riesgo
    // de la fecha de salida para que reflejen que ya finalizó, en vez de
    // seguir mostrando "En Riesgo" por haberse pasado de la fecha estimada.
    if (proyectoCompletadoDetectado) {
      colorEstado = COLOR_ESTADO.verde;
      p.estadoGeneral = 'COMPLETADO';
      riesgoFechaClase = 'badge-bajo';
      p.nivelRiesgoFecha = 'Completado';
    }

    const ICONO_ESTADO_HITO = {
      'Completado': { icono: '✅', bg: '#E8F5E9', color: 'var(--verde)' },
      'En curso': { icono: '🚀', bg: '#F7E9E9', color: 'var(--vino)' },
      'Suspendida': { icono: '⏸️', bg: '#FEF6E7', color: 'var(--amarillo)' },
      'Pendiente': { icono: '🚩', bg: '#F0F0F1', color: 'var(--gris)' }
    };

    function filaHitoResumen(h) {
      const est = ICONO_ESTADO_HITO[h.estado] || ICONO_ESTADO_HITO['Pendiente'];
      const subtitulo = h.esAdicional
        ? `Fecha: ${fmtFechaCorta(h.fechaFinPlan)}`
        : `Inicio: ${fmtFechaCorta(h.fechaInicioPlan)} · Fin: ${fmtFechaCorta(h.fechaFinPlan)}`;
      const observacionHtml = (h.esAdicional && h.observacion)
        ? `<div style="font-size:10.5px; color:var(--gris); font-style:italic; margin-top:2px;">"${h.observacion}"</div>`
        : '';
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);">
          <span style="width:30px; height:30px; border-radius:50%; background:${est.bg}; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;">${est.icono}</span>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:12.5px; color:var(--gris-oscuro);">${h.nombre}</div>
            <div style="font-size:10.5px; color:var(--gris);">${subtitulo}</div>
            ${observacionHtml}
          </div>
          <div style="font-size:11.5px; font-weight:700; color:${est.color}; text-align:right; white-space:nowrap;">${fmtFechaCorta(h.fechaFinPlan)}</div>
        </div>`;
    }

    const todosHitos = hitosResumenCorregido;
    const hitosCompletados = todosHitos.filter(h => h.estado === 'Completado');
    const hitosProximos = todosHitos.filter(h => h.estado !== 'Completado');

    const proximosHtml = todosHitos.length
      ? `
        ${hitosProximos.length ? `<div style="font-size:10.5px; font-weight:700; color:var(--gris); letter-spacing:.5px; margin-bottom:4px;">PRÓXIMOS</div>${hitosProximos.map(filaHitoResumen).join('')}` : ''}
        ${hitosCompletados.length ? `<div style="font-size:10.5px; font-weight:700; color:var(--gris); letter-spacing:.5px; margin:${hitosProximos.length ? '12px' : '0'} 0 4px;">COMPLETADOS</div>${hitosCompletados.map(filaHitoResumen).join('')}` : ''}
      `
      : '<div style="font-size:12px;color:var(--gris)">Sin hitos registrados aún.</div>';

    const riesgosHtml =
      '<div id="riesgos-criticos-proyecto-azure" class="loading" style="padding:16px 0;">Cargando riesgos desde Azure...</div>';

    cont.innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:22px;">
          <div style="display:flex; gap:10px; align-items:flex-start;">
            <span style="font-size:20px;">💼</span>
            <div>
              <div style="font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.4px;">Proyecto</div>
              <div style="font-size:17px; font-weight:700; color:var(--gris-oscuro);">${p.id} - ${p.nombre}</div>
              <div style="font-size:12px; color:var(--gris);">${p.cliente}</div>
            </div>
          </div>
          <div style="display:flex; gap:10px; align-items:flex-start;">
            <span style="font-size:20px;">📅</span>
            <div>
              <div style="font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.4px;">Fecha de Corte</div>
              <div style="font-size:14px; font-weight:700; color:var(--negro);">${fmtFechaCorta(p.fechaCorte)}</div>
            </div>
          </div>
          <div style="display:flex; gap:10px; align-items:flex-start;">
            <span style="font-size:20px;">👥</span>
            <div>
              <div style="font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.4px;">Sponsor</div>
              <div style="font-size:14px; font-weight:700; color:var(--negro);">${p.sponsor || '—'}</div>
            </div>
          </div>
          <div style="display:flex; gap:10px; align-items:flex-start;">
            <span style="font-size:20px;">👤</span>
            <div>
              <div style="font-size:10.5px; color:var(--gris); text-transform:uppercase; letter-spacing:.4px;">Project Manager</div>
              <div style="font-size:14px; font-weight:700; color:var(--negro);">${p.pm || '—'}</div>
              ${p.deliveryManager ? `<div style="font-size:11px; color:var(--gris);">DM: ${p.deliveryManager}</div>` : ''}
            </div>
          </div>

  const ICONOS_PRESET = ['🎥', '🧪', '🚀', '✅', '🎓', '🔍', '🏁', '📦', '📌', '📝', '🔔', '⭐'];
  const EMOJI_REGEX = /\p{Extended_Pictographic}/u;

  /**
   * Categoría GENERAL de un hito adicional (agrupa "Demostración 1",
   * "Demostración Final", etc. bajo una sola categoría "Demostraciones"
   * con un solo ícono consistente), en vez de tratar cada texto literal
   * como su propio tipo aislado.
   */
  /**
   * Quita el ícono embebido al inicio del nombre (si lo tiene), dejando
   * solo el texto legible. A diferencia de categoriaHito(), NO generaliza
   * el nombre — conserva el texto específico de esa instancia
   * (ej. "Demostración Final" en vez de "Demostraciones").
   */
  function nombreLimpioHito(tipoCompleto) {
    const nombre = String(tipoCompleto || '').trim();
    const primeraPalabra = nombre.split(' ')[0];
    if (EMOJI_REGEX.test(primeraPalabra)) return nombre.split(' ').slice(1).join(' ').trim() || nombre;
    return nombre;
  }

  function categoriaHito(tipoCompleto) {
    let nombre = String(tipoCompleto || '').trim();
    const primeraPalabra = nombre.split(' ')[0];
    const teniaEmoji = EMOJI_REGEX.test(primeraPalabra);
    if (teniaEmoji) nombre = nombre.split(' ').slice(1).join(' ').trim();
    const n = nombre.toLowerCase();

    if (n.includes('demo')) return { clave: 'demo', etiqueta: 'Demostraciones', icono: '🎥' };
    if (n.includes('qa')) return { clave: 'qa', etiqueta: 'Pases a QA', icono: '🧪' };
    if (n.includes('prod')) return { clave: 'prod', etiqueta: 'Pases a Producción', icono: '🚀' };
    if (n.includes('uat')) return { clave: 'uat', etiqueta: 'Ejecuciones UAT', icono: '✅' };
    if (n.includes('capacitac') || n.includes('training')) return { clave: 'train', etiqueta: 'Capacitaciones', icono: '🎓' };
    if (n.includes('revis') || n.includes('review')) return { clave: 'rev', etiqueta: 'Revisiones', icono: '🔍' };
    if (n.includes('kickoff') || n.includes('kick off') || n.includes('arranque')) return { clave: 'kickoff', etiqueta: 'Kickoffs', icono: '🏁' };
    if (n.includes('entrega')) return { clave: 'entrega', etiqueta: 'Entregas', icono: '📦' };

    // Sin categoria reconocida: el propio nombre limpio es su categoria,
    // usando el icono que el usuario eligió al crearlo (si lo eligió).
    return { clave: n, etiqueta: nombre || tipoCompleto, icono: teniaEmoji ? primeraPalabra : '📌' };
  }

  /**
   * Ícono heurístico por tipo de hito (respaldo). Preferir categoriaHito()
   * cuando se necesite agrupar/generalizar.
   */
  function iconoTipoHito(tipo) {
    return categoriaHito(tipo).icono;
  }

  /**
   * Lista compacta de hitos adicionales (icono + tipo + fecha), agrupados
   * por tipo. Las observaciones NO se muestran aquí a propósito (se
   * guardan para otro apartado), solo se listan tipo y fecha.
   */
  function renderHitosAdicionalesLista(hitosAdicionales) {
    if (!hitosAdicionales || !hitosAdicionales.length) return '';
    const porCategoria = {};
    hitosAdicionales.forEach(h => {
      const cat = categoriaHito(h.tipo);
      if (!porCategoria[cat.clave]) porCategoria[cat.clave] = { etiqueta: cat.etiqueta, icono: cat.icono, fechas: [] };
      porCategoria[cat.clave].fechas.push(h.fecha);
    });
    const chips = Object.values(porCategoria).map(c => `
      <div class="alert-item">
        <span style="margin-right:2px;">${c.icono}</span>
        <span><b>${c.etiqueta}</b> (${c.fechas.length}): ${c.fechas.join(', ')}</span>
      </div>`).join('');
    return `<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
      <div style="font-size:10.5px; font-weight:700; color:var(--gris); letter-spacing:.5px; margin-bottom:4px;">HITOS ADICIONALES</div>
      ${chips}
    </div>`;
  }

  let mhFilaContador = 0;

  /**
   * Modal para agregar uno o varios hitos adicionales a la vez, con
   * selector de icono real (no solo heurística) para tipos nuevos.
   */
  function abrirModalHito(idProyecto) {

    mhFilaContador = 0;

  function ddmmyyyyAiso(str) {
    const partes = String(str || '').split('/');
    if (partes.length !== 3) return '';

  function onCambioTipo(select) {
    const fila = select.closest('div[id^="mh-fila-"]');

    const esNuevo = select.value === '__nuevo__';
    bloqueNuevo.style.display = esNuevo ? 'block' : 'none';
    cancelarEdicionFila(fila.id); // cambiar de tipo cancela cualquier edición en curso en esta fila
    renderExistentesEnFila(fila, esNuevo ? null : select.value);

  function renderExistentesEnFila(fila, tipo) {
    const cont = fila.querySelector('.mh-existentes');
    cont.innerHTML = '';
    if (!tipo) return;
    const items = hitosAdicionalesActuales.filter(h => h.tipo === tipo);
    if (!items.length) {
      cont.innerHTML = '<div style="font-size:11px;color:var(--gris);margin:2px 0 8px;">Sin registros previos de este tipo.</div>';
      return;
    }

    const titulo = document.createElement('div');
    titulo.style.cssText = 'font-size:10.5px;color:var(--gris);margin:6px 0 3px;';
    titulo.textContent = 'Entradas ya guardadas (clic en ✏️ para editar):';
    cont.appendChild(titulo);

    // Construido con DOM real (no strings con onclick anidado) para evitar
    // que observaciones con comillas rompan el atributo HTML.
    items.forEach(h => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:6px; font-size:11.5px; padding:3px 0; border-bottom:1px solid var(--border);';

      btnEditar.title = 'Editar';
      btnEditar.textContent = '✏️';
      btnEditar.onclick = () => cargarHitoParaEditar(fila.id, tipo, h.indice, h.fecha, h.observacion);

      const btnEliminar = document.createElement('span');

      btnEliminar.textContent = '🗑️';
      btnEliminar.onclick = () => eliminarHitoDesdeModal(tipo, h.indice);
      row.appendChild(btnEliminar);

      cont.appendChild(row);
    });

  function guardarHitosDesdeModal(idProyecto) {
    const filas = document.querySelectorAll('#mh-filas-container > div');
    const elError = document.getElementById('mh-error');
    const nuevos = [];
    const ediciones = [];

    for (const fila of filas) {
      const selTipo = fila.querySelector('.mh-tipo-select');
      const inputNuevo = fila.querySelector('.mh-tipo-nuevo');
      const fecha = fila.querySelector('.mh-fecha').value;
      const obs = fila.querySelector('.mh-obs').value;

      let tipo;
      if (selTipo.value === '__nuevo__') {
        const nombreNuevo = inputNuevo.value.trim();
        if (!nombreNuevo) { elError.textContent = 'Falta el nombre de un tipo de hito nuevo.'; elError.style.display = 'block'; return; }
        const iconoEl = fila.querySelector('.mh-icono-opcion[data-seleccionado="1"]');
        const icono = iconoEl ? iconoEl.dataset.icono : '📌';
        tipo = icono + ' ' + nombreNuevo;
      } else {
        tipo = selTipo.value;
      }

      if (!fecha) { elError.textContent = 'Falta la fecha en uno de los hitos.'; elError.style.display = 'block'; return; }

      if (fila.dataset.editTipo && fila.dataset.editIndice !== undefined) {
        ediciones.push({ tipo: fila.dataset.editTipo, indice: Number(fila.dataset.editIndice), fechaISO: fecha, observacion: obs });
      } else {
        nuevos.push({ tipo: tipo, fechaISO: fecha, observacion: obs });
      }
    }

    if (!nuevos.length && !ediciones.length) { elError.textContent = 'Agrega al menos un hito.'; elError.style.display = 'block'; return; }
    elError.style.display = 'none';

    const btn = document.getElementById('mh-btn-guardar');
    btn.disabled = true; btn.textContent = 'Guardando...';

    procesarEdicionesYNuevos(idProyecto, ediciones.slice(), nuevos, elError, btn);
  }

  /**
   * Procesa las EDICIONES una por una (secuencial, porque cada una
   * modifica el sheet), y al terminar manda las ALTAS nuevas en un solo
   * lote. Al final recarga el dashboard.
   */
  function procesarEdicionesYNuevos(idProyecto, edicionesPendientes, nuevos, elError, btn) {
    if (edicionesPendientes.length > 0) {
      const e = edicionesPendientes.shift();
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.ok) {
            btn.disabled = false; btn.textContent = 'Guardar';
            elError.textContent = 'Error al editar: ' + (res && res.error ? res.error : 'desconocido.');
            elError.style.display = 'block';
            return;
          }
          hitosAdicionalesActuales = res.hitos;
          procesarEdicionesYNuevos(idProyecto, edicionesPendientes, nuevos, elError, btn);
        })
        .withFailureHandler(err => {
          btn.disabled = false; btn.textContent = 'Guardar';
          elError.textContent = 'Error del servidor al editar: ' + (err && err.message ? err.message : err);
          elError.style.display = 'block';
        })
        .editarHitoAdicional(idProyecto, e.tipo, e.indice, e.fechaISO, e.observacion);
      return;
    }

    if (nuevos.length > 0) {
      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false; btn.textContent = 'Guardar';
          if (!res || !res.ok) {
            elError.textContent = 'Error al guardar: ' + (res && res.error ? res.error : 'desconocido. Revisa Ejecuciones en Apps Script.');
            elError.style.display = 'block';
            console.error('guardarHitosAdicionalesLote error:', res);
            return;
          }
          cerrarModalHito();
          loadDashboard();
        })
        .withFailureHandler(err => {
          btn.disabled = false; btn.textContent = 'Guardar';
          elError.textContent = 'Error del servidor: ' + (err && err.message ? err.message : err);
          elError.style.display = 'block';
          console.error('guardarHitosAdicionalesLote failure:', err);
        })
        .guardarHitosAdicionalesLote(idProyecto, nuevos);
      return;
    }

    // No hubo altas nuevas, solo ediciones: ya se aplicaron todas.
    btn.disabled = false; btn.textContent = 'Guardar';
    cerrarModalHito();
    loadDashboard();
  }

let mesActualPersona = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

let rangoPersonaInicio = null;
let rangoPersonaFin = null;

function _aplicarPresetRangoPersona(preset) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const clonar = (d) => new Date(d.getTime());
  let desde = null, hasta = null;

  if (preset === 'hoy') { desde = clonar(hoy); hasta = clonar(hoy); }
  else if (preset === 'ayer') { desde = new Date(hoy); desde.setDate(desde.getDate() - 1); hasta = clonar(desde); }
  else if (preset === 'estaSemana') { desde = new Date(hoy); desde.setDate(desde.getDate() - desde.getDay()); hasta = clonar(hoy); }
  else if (preset === 'semanaPasada') {
    const finPrev = new Date(hoy); finPrev.setDate(finPrev.getDate() - finPrev.getDay() - 1);
    const iniPrev = new Date(finPrev); iniPrev.setDate(iniPrev.getDate() - 6);
    desde = iniPrev; hasta = finPrev;
  }
  else if (preset === 'ultimas2semanas') { desde = new Date(hoy); desde.setDate(desde.getDate() - 13); hasta = clonar(hoy); }
  else if (preset === 'esteMes') { desde = new Date(hoy.getFullYear(), hoy.getMonth(), 1); hasta = clonar(hoy); }
  else if (preset === 'mesPasado') { desde = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); hasta = new Date(hoy.getFullYear(), hoy.getMonth(), 0); }
  else if (preset === 'esteAnio') { desde = new Date(hoy.getFullYear(), 0, 1); hasta = clonar(hoy); }
  else if (preset === 'anioPasado') { desde = new Date(hoy.getFullYear() - 1, 0, 1); hasta = new Date(hoy.getFullYear() - 1, 11, 31); }
  else if (preset === 'todo') { desde = null; hasta = null; }

  rangoPersonaInicio = desde;
  rangoPersonaFin = hasta;
  document.getElementById('panel-rango-fechas-persona').style.display = 'none';
  document.getElementById('f-proyecto-filtro-persona').value = '';
  _actualizarEtiquetaRangoPersona();
  cargarDetallePersona();
}

function _actualizarEtiquetaRangoPersona() {
  const el = document.getElementById('etiqueta-rango-persona');
  if (!el) return;
  if (!rangoPersonaInicio && !rangoPersonaFin) { el.textContent = 'Todo el histórico'; return; }
  const fmt = (d) => d ? d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) : '?';
  el.textContent = fmt(rangoPersonaInicio) + ' - ' + fmt(rangoPersonaFin);
}

    onClick('btn-aplicar-rango-persona', () => {
      const desdeEl = document.getElementById('input-fecha-desde-persona');
      const hastaEl = document.getElementById('input-fecha-hasta-persona');
      const desde = desdeEl ? desdeEl.value : '';
      const hasta = hastaEl ? hastaEl.value : '';
      rangoPersonaInicio = desde ? new Date(desde) : null;
      rangoPersonaFin = hasta ? new Date(hasta) : null;

      const panel = document.getElementById('panel-rango-fechas-persona');
      if (panel) panel.style.display = 'none';
      const filtroProyecto = document.getElementById('f-proyecto-filtro-persona');
      if (filtroProyecto) filtroProyecto.value = '';
      _actualizarEtiquetaRangoPersona();
      cargarDetallePersona();
    });

    _poblarProyectosDePersona();

    onChange('f-proyecto-filtro-persona', () => {
      const el = document.getElementById('f-proyecto-filtro-persona');
      const idProyecto = el ? el.value : '';
      if (!idProyecto) {
        rangoPersonaInicio = null;
        rangoPersonaFin = null;
        _actualizarEtiquetaRangoPersona();
        cargarDetallePersona();
        return;
      }

      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.ok && res.fechaInicio) {
            rangoPersonaInicio = new Date(res.fechaInicio);
            rangoPersonaFin = res.fechaFin ? new Date(res.fechaFin) : new Date();
            _actualizarEtiquetaRangoPersona();
            cargarDetallePersona();
          }
        })
        .withFailureHandler(err => console.error('obtenerRangoClockifyProyecto:', err))
        .obtenerRangoClockifyProyecto(idProyecto);
    });

    onClick('btn-mes-persona-prev', () => {
      mesActualPersona.setMonth(mesActualPersona.getMonth() - 1);
      cargarDetallePersona();
    });
    onClick('btn-mes-persona-next', () => {
      mesActualPersona.setMonth(mesActualPersona.getMonth() + 1);
      cargarDetallePersona();
    });

    // El Resumen es la vista principal. Debe cargar incluso si cualquiera de
    // los controles secundarios de Persona/Proyecto no existe.
    mostrarModoHoras('resumen');
  }

  function mostrarModoHoras(modo) {
    const paneles = {
      resumen: 'horas-resumen-panel',
      proyecto: 'horas-proyecto-panel',
      persona: 'horas-persona-panel',
      capacidad: 'horas-capacidad-panel'
    };

    Object.keys(paneles).forEach(m => {
      const panel = document.getElementById(paneles[m]);
      if (panel) panel.style.display = m === modo ? 'block' : 'none';

      const btn = document.getElementById('btn-modo-' + m);
      if (btn) btn.classList.toggle('active', m === modo);
    });

    if (modo === 'resumen') {
      cargarResumenRecursos();
    } else if (modo === 'proyecto') {
      const sel = document.getElementById('f-proyecto-horas');
      if (sel && sel.value) cargarDetalleProyecto();
    } else if (modo === 'persona') {
      const sel = document.getElementById('f-persona-horas');
      if (sel && sel.value) cargarDetallePersona();
    } else if (modo === 'capacidad') {
      cargarCapacidadInstalada();
    }
  }

  function renderBarras(contenedorId, items, maxValor, sufijo, conAvatar) {
    const cont = document.getElementById(contenedorId);
    if (!items || items.length === 0) {
      cont.innerHTML = '<div style="font-size:12px;color:var(--gris)">Sin datos disponibles.</div>';
      return;
    }
    cont.innerHTML = items.map(it => `
      <div class="barra-row${conAvatar ? ' con-avatar' : ''}">
        ${conAvatar ? `<div class="avatar-mini">${iniciales(it.nombre)}</div>` : ''}
        <div class="barra-nombre" title="${it.nombre}">${it.nombre}</div>
        <div class="barra-track"><div class="barra-fill" style="width:${maxValor ? (it.horas / maxValor * 100) : 0}%"></div></div>
        <div class="barra-valor">${it.horas}${sufijo || ''}</div>
      </div>
    `).join('');
  }

  const PALETA_DONUT = ['#9B2427', '#F2A900', '#5B8DEF', '#2E7D32', '#6E1A1C', '#8D8D91'];
  // Paleta de marca Beecker (aproximada del logo, morado -> rosa), usada
  // SOLO en elementos del Dashboard Ejecutivo generados por JS, sin tocar
  // el CSS global (no afecta Recursos, Minutas, etc.)
  const BEECKER_MORADO = '#4A2A94';
  const BEECKER_ROSA = '#E0298B';
  const PALETA_BEECKER = ['#4A2A94', '#E0298B', '#8B5CF6', '#F472B6', '#6D28D9', '#C026A3'];

  function iniciales(nombre) {
    if (!nombre) return '?';
    const partes = nombre.trim().split(/\s+/);
    const a = partes[0] ? partes[0][0] : '';
    const b = partes.length > 1 ? partes[1][0] : '';
    return (a + b).toUpperCase();
  }

  /**
   * Genera un donut chart en SVG puro (sin librerias externas) a partir de
   * [{nombre, horas, pct}], con el total en el centro.
   */
  function renderDonut(contenedorId, items, totalHoras, paletaOverride) {
    const cont = document.getElementById(contenedorId);
    if (!cont) return;
    if (!items || items.length === 0) {
      cont.innerHTML = '<div style="font-size:12px;color:var(--gris)">Sin datos disponibles.</div>';
      return;
    }
    const paleta = paletaOverride || PALETA_DONUT;

    const size = 180, stroke = 26, r = (size - stroke) / 2, cx = size / 2, cy = size / 2;
    const circ = 2 * Math.PI * r;
    let acumulado = 0;

    const segmentos = items.map((it, i) => {
      const frac = totalHoras ? it.horas / totalHoras : 0;
      const largo = frac * circ;
      const dasharray = `${largo} ${circ - largo}`;
      const offset = -acumulado * circ;
      acumulado += frac;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${paleta[i % paleta.length]}"
        stroke-width="${stroke}" stroke-dasharray="${dasharray}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${cx} ${cy})"></circle>`;
    }).join('');

    const totalMostrado = Math.round((totalHoras + Number.EPSILON) * 10) / 10;

    const svg = `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        ${segmentos}
        <text x="${cx}" y="${cy - 4}" text-anchor="middle" class="donut-center-value" style="font-size:20px; font-weight:700; fill:var(--negro);">${totalMostrado}</text>
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" style="font-size:10px; fill:var(--gris); text-transform:uppercase; letter-spacing:.4px;">Hrs Totales</text>
      </svg>`;

    const legend = items.map((it, i) => `
      <div class="donut-legend-row">
        <span class="donut-dot" style="background:${paleta[i % paleta.length]}"></span>
        <span class="donut-legend-name" title="${it.nombre}">${it.nombre}</span>
        <span class="donut-legend-val">${it.horas}h</span>
        <span class="donut-legend-pct">${it.pct}%</span>
      </div>
    `).join('');

    cont.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
        <div>${svg}</div>
        <div style="width:100%; max-width:260px;">${legend}</div>
      </div>`;
  }

  function colorHeat(valor) {
    if (valor <= 0) return '#F0F0F0';
    if (valor < 10) return '#C8E6C9';
    if (valor < 20) return '#FFE699';
    if (valor < 35) return '#FFCC80';
    return '#FFAB91';
  }

  function cargarResumenRecursos() {
    const panel = document.getElementById('horas-resumen-panel');
    if (!panel) return;

    const kpi = document.getElementById('kpi-resumen-horas');
    if (kpi && (kpi.textContent === '-' || !kpi.textContent.trim())) kpi.textContent = '…';

    google.script.run
      .withSuccessHandler((data) => {
        // Si el usuario salió de Recursos mientras respondía el servidor, no pintar.
        if (!document.getElementById('horas-resumen-panel')) return;
        renderResumenRecursos(data);
      })
      .withFailureHandler((err) => {
        console.error('getResumenRecursos:', err);
        const horas = document.getElementById('kpi-resumen-horas');
        if (horas) horas.textContent = 'Error';
        showError(err);
      })
      .getResumenRecursos();
  }

function renderResumenRecursos(data) {
  const elHoras = document.getElementById('kpi-resumen-horas');
  if (!elHoras) { console.warn('renderResumenRecursos: vista ya no está en el DOM.'); return; }
  if (!data) { alert('El servidor no devolvió datos del resumen.'); return; }

  document.getElementById('kpi-resumen-horas').innerText = data.totalHoras + 'h';
  const elHorasSub = document.getElementById('kpi-resumen-horas-sub');
  if (elHorasSub) {
    if (data.pctCambioSemanal == null) {
      elHorasSub.innerHTML = '';
    } else {
      const subio = data.pctCambioSemanal >= 0;
      const flecha = subio ? '↑' : '↓';
      const color = subio ? 'var(--verde)' : 'var(--rojo)';
      elHorasSub.innerHTML = '<span style="color:' + color + ';font-weight:600;">' + flecha + ' ' + Math.abs(data.pctCambioSemanal) + '%</span> vs semana anterior';
    }
  }

  document.getElementById('kpi-resumen-dias').innerText = data.diasTrabajados + ' / ' + data.diasPeriodo;
  document.getElementById('kpi-resumen-dias-sub').innerText = data.diasPeriodo
    ? Math.round((data.diasTrabajados / data.diasPeriodo) * 100) + '% del periodo'
    : '';

  document.getElementById('kpi-resumen-actividades').innerText = data.actividadesRegistradas;
  document.getElementById('kpi-resumen-actividades-sub').innerText = 'en ' + data.totalProyectos + ' proyecto' + (data.totalProyectos === 1 ? '' : 's');

  document.getElementById('kpi-resumen-fuera-horario').innerText = data.horasFueraHorario + 'h';
  document.getElementById('kpi-resumen-fuera-horario-sub').innerText = data.pctFueraHorario + '% del total';

  // ---------- Resumen de horarios: donut + Top 5 ----------
  const donutHorarios = document.getElementById('donut-resumen-horarios');
  if (donutHorarios) {
    renderDonut('donut-resumen-horarios', [
      { nombre: 'En horario', horas: Math.round((data.totalHoras - data.horasFueraHorario) * 100) / 100, pct: data.pctEnHorario },
      { nombre: 'Fuera de horario', horas: data.horasFueraHorario, pct: data.pctFueraHorario }
    ], data.totalHoras, ['#2E7D32', '#C62828']);
  }

  const top5Cont = document.getElementById('top5-fuera-horario');
  if (top5Cont) {
    const top5 = data.top5FueraHorario || [];
    if (!top5.length) {
      top5Cont.innerHTML = '<div style="font-size:12px;color:var(--gris);">Nadie tiene horas fuera de horario 🎉</div>';
    } else {
      const maxTop5 = Math.max(...top5.map(t => t.horas));
      top5Cont.innerHTML = top5.map((t, i) => `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px;">
          <span style="width:16px; color:var(--gris); font-weight:600;">${i + 1}.</span>
          <span style="width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--gris-oscuro);">${t.recurso}</span>
          <div class="barra-track" style="flex:1; height:8px;">
            <div class="barra-fill" style="width:${(t.horas / maxTop5) * 100}%; background:var(--rojo);"></div>
          </div>
          <span style="width:40px; text-align:right; font-weight:600; color:var(--rojo);">${t.horas}h</span>
        </div>
      `).join('');
    }
  }

  // ---------- Horas fuera de horario (detalle), con "Ver todas" ----------
  const tbodyFH = document.querySelector('#tabla-fuera-horario-detalle tbody');
  const ocultosFH = document.getElementById('tabla-fuera-horario-ocultos');
  const toggleFH = document.getElementById('toggle-fuera-horario-detalle');
  if (tbodyFH) {
    const lista = data.detalleFueraHorario || [];
    const renderFilaFH = (r) => `
      <tr>
        <td>${r.fecha}</td>
        <td>${r.recurso}</td>
        <td style="color:var(--rojo); font-weight:600;">${r.horas}h</td>
        <td>${r.descripcion || '—'}</td>
      </tr>`;
    if (!lista.length) {
      tbodyFH.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--gris);">Sin registros fuera de horario 🎉</td></tr>';
      if (toggleFH) toggleFH.style.display = 'none';
    } else {
            tbodyFH.innerHTML = lista.slice(0, 11).map(renderFilaFH).join('');
      const resto = lista.slice(11);
      if (resto.length && toggleFH) {
        ocultosFH.innerHTML = '<table class="data-table"><tbody>' + resto.map(renderFilaFH).join('') + '</tbody></table>';
        toggleFH.style.display = 'inline';
        toggleFH.textContent = 'Ver todas (' + resto.length + ' más)';
        toggleFH.onclick = (ev) => {
          ev.preventDefault();
          const abierto = ocultosFH.style.display !== 'none';
          ocultosFH.style.display = abierto ? 'none' : 'block';
          toggleFH.textContent = abierto ? 'Ver todas (' + resto.length + ' más)' : 'Ver menos';
        };
      } else if (toggleFH) {
        toggleFH.style.display = 'none';
      }
    }
  }

  _renderGraficaHorasDia('grafica-horas-dia', data.horasPorDia || []);

  renderDonut('donut-categorias-resumen', data.distribucionCategoria || [], data.totalHoras, PALETA_BEECKER);

  // ---------- Detalle por recurso: barras + estado ----------
  const tbody = document.querySelector('#tabla-detalle-recurso-resumen tbody');
  if (tbody) {

        <tr>

          <td>
            <div style="display:flex; align-items:center; gap:6px;">
              <div class="barra-track" style="width:70px; height:8px;">
                <div class="barra-fill" style="width:${(f.horasEnHorario / maxEnHorario) * 100}%; background:#2E7D32;"></div>
              </div>
              <span style="font-size:11.5px; color:var(--gris-oscuro);">${f.horasEnHorario}h</span>
            </div>
          </td>
          <td>
            <div style="display:flex; align-items:center; gap:6px;">
              <div class="barra-track" style="width:70px; height:8px;">
                <div class="barra-fill" style="width:${(f.horasFueraHorario / maxFueraHorario) * 100}%; background:var(--rojo);"></div>
              </div>
              <span style="font-size:11.5px; color:${f.horasFueraHorario > 0 ? 'var(--rojo)' : 'var(--gris-oscuro)'};">${f.horasFueraHorario}h</span>
            </div>
          </td>
          <td>${f.diasTrabajados} / ${data.diasPeriodo}</td>
          <td><span class="badge" style="background:${badgeColor}; color:${badgeTexto};">${badgeLabel}</span></td>
        </tr>`;
    }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--gris);">Sin datos disponibles.</td></tr>';
        const ocultosDR = document.getElementById('tabla-detalle-recurso-ocultos');
    const toggleDR = document.getElementById('toggle-detalle-recurso');
    const restoDR = filas.slice(7);
    if (restoDR.length && toggleDR) {
      const renderFilaDR = (f) => {
        const enTiempo = f.horasFueraHorario === 0;
        const badgeColor = enTiempo ? '#E8F5E9' : '#FFF6DD';
        const badgeTexto = enTiempo ? 'var(--verde)' : '#8A6D00';
        const badgeLabel = enTiempo ? 'En horario' : 'Con fuera de horario';
        return `
          <tr>
            <td>${f.recurso}${f.posicion ? '<br><span style="font-size:10px;color:var(--gris);">' + f.posicion + '</span>' : ''}</td>
            <td>
              <div style="display:flex; align-items:center; gap:6px;">
                <div class="barra-track" style="width:70px; height:8px;">
                  <div class="barra-fill" style="width:${(f.horasEnHorario / maxEnHorario) * 100}%; background:#2E7D32;"></div>
                </div>
                <span style="font-size:11.5px; color:var(--gris-oscuro);">${f.horasEnHorario}h</span>
              </div>
            </td>
            <td>
              <div style="display:flex; align-items:center; gap:6px;">
                <div class="barra-track" style="width:70px; height:8px;">
                  <div class="barra-fill" style="width:${(f.horasFueraHorario / maxFueraHorario) * 100}%; background:var(--rojo);"></div>
                </div>
                <span style="font-size:11.5px; color:${f.horasFueraHorario > 0 ? 'var(--rojo)' : 'var(--gris-oscuro)'};">${f.horasFueraHorario}h</span>

        ocultosDR.style.display = abierto ? 'none' : 'block';
        toggleDR.textContent = abierto ? 'Ver más (' + restoDR.length + ' recursos)' : 'Ver menos';

  const listaProy = document.getElementById('lista-resumen-proyecto');
  if (listaProy) {
    listaProy.innerHTML = (data.distribucionProyecto || []).map(p => `
      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;">

      </div>

  }
}

function _renderGraficaHorasDia(contenedorId, dias) {
  const cont = document.getElementById(contenedorId);
  if (!cont) return;
  if (!dias.length) {
    cont.innerHTML = '<div style="font-size:12px;color:var(--gris);padding:20px 0;text-align:center;">Sin datos disponibles.</div>';
    return;
  }

  const ALTO_MAX_PX = 160;
  const maxTotal = Math.max(1, ...dias.map(d => d.enHorario + d.fueraHorario));

  const barras = dias.map(d => {
    const total = d.enHorario + d.fueraHorario;
    const altoEnHorarioPx = Math.round((d.enHorario / maxTotal) * ALTO_MAX_PX);
    const altoFueraHorarioPx = Math.round((d.fueraHorario / maxTotal) * ALTO_MAX_PX);
    const titulo = d.etiqueta + ': ' + d.enHorario + 'h en horario, ' + d.fueraHorario + 'h fuera de horario';
    return `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:26px; flex:1;" title="${titulo}">
        <div style="font-size:9px; color:var(--gris-oscuro); font-weight:600; margin-bottom:2px;">${total > 0 ? total : ''}</div>
        <div style="display:flex; flex-direction:column-reverse; width:14px; border-radius:3px 3px 0 0; overflow:hidden;">
          <div style="height:${altoEnHorarioPx}px; background:var(--vino); width:100%;"></div>
          <div style="height:${altoFueraHorarioPx}px; background:var(--rojo); width:100%;"></div>
        </div>
        <div style="font-size:9px; color:var(--gris); margin-top:4px; writing-mode:vertical-rl; transform:rotate(180deg); height:34px;">${d.etiqueta}</div>
      </div>`;
  }).join('');

  cont.innerHTML = `
    <div style="display:flex; align-items:flex-end; gap:4px; min-width:${dias.length * 30}px; height:${ALTO_MAX_PX + 50}px; padding:0 4px;">
      ${barras}
    </div>
    <div style="display:flex; gap:16px; font-size:11px; color:var(--gris); margin-top:8px; padding-left:4px;">
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--vino);border-radius:2px;margin-right:4px;"></span>En horario</span>
      <span><span style="display:inline-block;width:9px;height:9px;background:var(--rojo);border-radius:2px;margin-right:4px;"></span>Fuera de horario</span>
    </div>`;
}

  const COLOR_ESTIMADA = '#C9C9CC';
  const COLOR_REAL = 'var(--vino)';

  function badgeEstadoClass(estado) {
    if (estado === 'Retrasado' || estado === 'Excedido') return 'badge-error';
    if (estado === 'En riesgo') return 'badge-warning';
    return 'badge-ok';
  }

  /**
   * Barras comparativas Estimadas vs Reales, una fila por item.
   * items: [{nombre, horasEstimadas, horasReales}]
   */
  function renderComparativo(contenedorId, items) {
    const cont = document.getElementById(contenedorId);
    if (!cont) return;
    if (!items || items.length === 0) {
      cont.innerHTML = '<div style="font-size:12px;color:var(--gris)">Sin datos disponibles.</div>';
      return;
    }
    const maxValor = Math.max(1, ...items.map(it => Math.max(it.horasEstimadas, it.horasReales)));
    cont.innerHTML = items.map(it => `
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;">
          <span style="color:var(--gris-oscuro); font-weight:600;">${it.nombre}</span>
          <span style="color:var(--gris);">${it.horasReales} / ${it.horasEstimadas} hrs</span>
        </div>
        <div class="barra-track" style="height:10px; margin-bottom:3px;">
          <div class="barra-fill" style="width:${(it.horasEstimadas / maxValor) * 100}%; background:${COLOR_ESTIMADA};"></div>
        </div>
        <div class="barra-track" style="height:10px;">
          <div class="barra-fill" style="width:${(it.horasReales / maxValor) * 100}%; background:${COLOR_REAL};"></div>
        </div>
      </div>
    `).join('') + `

        <span><span style="display:inline-block;width:9px;height:9px;background:${COLOR_ESTIMADA};border-radius:2px;margin-right:4px;"></span>Estimadas</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--vino);border-radius:2px;margin-right:4px;"></span>Reales</span>

  /**
   * Igual que renderComparativo, pero muestra solo los primeros 5 items
   * y agrega un link "Ver todos" para desplegar el resto — se usa en
   * "Horas por Recurso" cuando hay más de 5 recursos asignados.
   */
  function renderComparativoConVerTodos(contenedorId, itemsCompletos) {
    const cont = document.getElementById(contenedorId);
    if (!cont) return;
    if (!itemsCompletos || itemsCompletos.length === 0) {
      cont.innerHTML = '<div style="font-size:12px;color:var(--gris)">Sin datos disponibles.</div>';
      return;
    }

    const maxValor = Math.max(1, ...itemsCompletos.map(it => Math.max(it.horasEstimadas, it.horasReales)));
    const renderBarra = (it) => `
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;">
          <span style="color:var(--gris-oscuro); font-weight:600;">${it.nombre}</span>
          <span style="color:var(--gris);">${it.horasReales} / ${it.horasEstimadas} hrs</span>
        </div>
        <div class="barra-track" style="height:10px; margin-bottom:3px;">
          <div class="barra-fill" style="width:${(it.horasEstimadas / maxValor) * 100}%; background:${COLOR_ESTIMADA};"></div>
        </div>
        <div class="barra-track" style="height:10px;">
          <div class="barra-fill" style="width:${(it.horasReales / maxValor) * 100}%; background:${COLOR_REAL};"></div>
        </div>
      </div>`;

    const visibles = itemsCompletos.slice(0, 5);
    const ocultos = itemsCompletos.slice(5);

    const leyenda = `
      <div style="display:flex; gap:16px; font-size:11px; color:var(--gris); margin-top:4px;">
        <span><span style="display:inline-block;width:9px;height:9px;background:${COLOR_ESTIMADA};border-radius:2px;margin-right:4px;"></span>Estimadas</span>
        <span><span style="display:inline-block;width:9px;height:9px;background:var(--vino);border-radius:2px;margin-right:4px;"></span>Reales</span>
      </div>`;

    cont.innerHTML = visibles.map(renderBarra).join('') +
      (ocultos.length ? `
        <div id="${contenedorId}-ocultos" style="display:none;">${ocultos.map(renderBarra).join('')}</div>
        <div style="text-align:center;margin:4px 0 8px;">
          <a href="#" id="${contenedorId}-toggle" style="font-size:11.5px;color:var(--vino);text-decoration:none;">Ver todos (${ocultos.length} más)</a>
        </div>` : '') +
      leyenda;

    if (ocultos.length) {
      const toggle = document.getElementById(contenedorId + '-toggle');
      toggle.onclick = (ev) => {
        ev.preventDefault();
        const bloque = document.getElementById(contenedorId + '-ocultos');
        const abierto = bloque.style.display !== 'none';
        bloque.style.display = abierto ? 'none' : 'block';
        toggle.textContent = abierto ? `Ver todos (${ocultos.length} más)` : 'Ver menos';
      };
    }
  }
