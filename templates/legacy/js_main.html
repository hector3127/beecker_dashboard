  function _aerFmtH(n) { return `${(Math.round(Number(n||0)*100)/100).toLocaleString('es-MX')} h`; }
  function _aerFmtPct(n) { return `${Math.round(Number(n||0)*10)/10}%`; }
  function _aerDateKey(v){
    if(!v) return 0;
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return Number(`${m[1]}${m[2]}${m[3]}`);
    m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(m) return Number(`${m[3]}${m[2]}${m[1]}`);
    const t=Date.parse(s);
    return Number.isFinite(t)?t:0;
  }
  function _aerFmtFecha(v) {
    if (!v) return '—';
    const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
  }
  function _aerClamp(n) { return Math.max(0,Math.min(100,Number(n||0))); }
  function _aerEstadoClase(v) {
    const s=String(v||'').toLowerCase();
    if (/crit|alto|atras|venc|riesgo/.test(s)) return 'bad';
    if (/complet|cerr|tiempo|salud/.test(s)) return 'ok';
    if (/por iniciar|pend/.test(s)) return 'warn';
    if (/detenido|paus/.test(s)) return 'warn';
    if (/en progreso|seguimiento|curso|por validar/.test(s)) return 'info';
    return 'info';
  }

  function _aerVisualEstadoClase(v) {
    const s=_aerNormFilter(v);
    if(/vencid|crit|alto|alerta/.test(s)) return 'bad';
    if(/complet|cerrad|ok|salud/.test(s)) return 'ok';
    if(/detenid|paus|bloq|mitig/.test(s)) return 'warn';
    if(/por validar|revision/.test(s)) return 'review';
    if(/en progreso|abiert|seguimiento|curso/.test(s)) return 'info';
    return 'soft';
  }

  function _aerMergeByCompleteness(prev, cur, fields) {
    const score = o => (fields||[]).reduce((s,k)=>s + (String((o||{})[k]||'').trim()?1:0), 0);
    const ps = score(prev), cs = score(cur);
    if (cs > ps) return Object.assign({}, prev||{}, cur||{});
    if (ps > cs) return Object.assign({}, cur||{}, prev||{});
    return Object.assign({}, prev||{}, cur||{});
  }

  function _aerDedupRiesgosVista(rows){
    const exact = new Map();
    (rows||[]).forEach(r=>{
      const key=[_aerNormFilter(r.riesgo),_aerNormFilter(r.responsable),String(r.fechaLimite||'')].join('|');
      if(!key.replace(/\|/g,'').trim()) return;
      const prev=exact.get(key);
      exact.set(key, prev ? _aerMergeByCompleteness(prev,r,['riesgo','impacto','probabilidad','responsable','fechaLimite','accion','estado','notas']) : r);
    });
    const loose = new Map();
    [...exact.values()].forEach(r=>{
      const key=_aerNormFilter(r.riesgo);
      if(!key) return;
      const prev=loose.get(key);
      if(!prev){ loose.set(key,r); return; }
      const sameResp = !_aerNormFilter(prev.responsable) || !_aerNormFilter(r.responsable) || _aerNormFilter(prev.responsable)===_aerNormFilter(r.responsable);
      const sameDate = !String(prev.fechaLimite||'') || !String(r.fechaLimite||'') || String(prev.fechaLimite||'')===String(r.fechaLimite||'');
      loose.set(key, (sameResp && sameDate) ? _aerMergeByCompleteness(prev,r,['riesgo','impacto','probabilidad','responsable','fechaLimite','accion','estado','notas']) : prev);
    });
    return [...loose.values()];
  }

  function _aerAccionFechaPrincipal(x){
    return x.fechaLimite || x.proximaRevision || x.fechaReal || x.fechaInicio || '';
  }

  function renderDashboardAERTYMProyecto(res) {
    const cont=document.getElementById('dashboard-proyecto-detalle');
    if (!cont) return;
    if (!res || !res.ok) {
      cont.innerHTML=`<div class="card"><h3>PROYECTO AER / T&M</h3><div style="color:var(--rojo);">${_aerEsc(res&&res.error?res.error:'No se pudo cargar el proyecto.')}</div></div>`;
      return;
    }
    _aerEnsureStyles();
    if(aerIAState.id !== (res.proyecto||{}).id) aerIAState={id:(res.proyecto||{}).id||'',analisis:null,minutas:null,resumenEjecutivo:null,respuestaChatResumen:null,resumenConsultado:false,cargandoResumen:false,accionesPartes:null,cargandoPartes:false,cargando:false,cargandoAnalisis:false,analisisConsultado:false,config:null,archivos:null,seleccion:[],mostrarArchivos:false,archivosOcultos:false,historialCompleto:false,errorBusqueda:''};
    aerDashboardData=res;
    aerTabActual='ejecutivo';
    _aerRenderShell();

    // Si el JS nuevo está conectado al AERTYMProyectoService viejo, las horas
    // existen pero faltan plan/riesgos/dimensiones. Mostrar diagnóstico claro.
    if (!res.backendVersion && (!res.plan || !res.kpis || !res.kpis.healthDimensiones)) {
      const shell=document.querySelector('#dashboard-proyecto-detalle .aer-shell');
      if (shell) shell.insertAdjacentHTML('afterbegin',`<div class="aer-callout red" style="margin-bottom:10px"><b>Backend AER desactualizado.</b> Las horas vienen de Clockify, pero Planeación/Riesgos/Salud por dimensión requieren reemplazar AERTYMProyectoService.gs por la versión V3.</div>`);
    }
  }

  function _aerRenderShell() {
    const cont=document.getElementById('dashboard-proyecto-detalle');
    if (!cont || !aerDashboardData) return;

    cont.innerHTML=`<div class="aer-shell">

          <div class="aer-sub">Cliente: ${_aerEsc(p.cliente||'—')} &nbsp; | &nbsp; Delivery Manager: ${_aerEsc(p.deliveryManager||'—')} &nbsp; | &nbsp; ${_aerFmtFecha(p.fechaInicio)} → ${_aerFmtFecha(p.fechaFin)}</div></div>
        <div class="aer-actions"><span class="aer-badge ${_aerEstadoClase(p.estado)}">${_aerEsc(p.estado||'En seguimiento')}</span><button class="aer-btn" onclick="aerRecargarProyecto()">↻ Actualizar</button></div>
      </div>
      <div class="aer-tabs">
        ${[['ejecutivo','Ejecutivo'],['planeacion','Planeación'],['esfuerzo','Esfuerzo'],['riesgos','Riesgos'],['acciones','Acciones'],['recursos','Recursos'],['cliente','Cliente'],['ia','✦ IA']].map(x=>`<button class="aer-tab ${aerTabActual===x[0]?'active':''}" onclick="aerCambiarTab('${x[0]}')">${x[1]}</button>`).join('')}
      </div>
      <div id="aer-tab-content"></div>
    </div>`;
    _aerRenderTab();

  function aerCambiarTab(tab) { aerTabActual=tab==='minutas'?'ia':tab; _aerRenderShell(); if(aerTabActual==='ia'){aerIACargarAnalisis();aerIACargarMinutas();aerIACargarConfigMinutas();aerIACargarResumenEjecutivo();aerIACargarAccionesPartes();}else if(aerTabActual==='acciones'){aerIACargarAccionesPartes();} }

  function aerRecargarProyecto() {
    const id=aerDashboardData&&aerDashboardData.proyecto?aerDashboardData.proyecto.id:'';

  function _aerKpi(t,v,s) { return `<div class="aer-kpi"><div class="aer-kpi-l">${t}</div><div class="aer-kpi-v">${v}</div><div class="aer-kpi-s">${s||''}</div></div>`; }

  function _aerRenderTab() {
    // El mismo módulo Cliente/Acciones se puede alojar en la vista IXB/RaaS/SaaS.
    const ixsActivo=typeof ixsTabActual!=='undefined'&&['cliente','acciones'].includes(ixsTabActual)

  function _aerRecursosProyecto() {
    const vals=[];
    ((aerDashboardData&&aerDashboardData.detalleRecursos)||[]).forEach(x=>vals.push(x.recurso));
    ((((aerDashboardData||{}).plan||{}).filas)||[]).forEach(x=>vals.push(x.responsable));
    ((((aerDashboardData||{}).vacaciones||{}).filas)||[]).forEach(x=>vals.push(x.recurso));
    ((((aerDashboardData||{}).evaluaciones||{}).filas)||[]).forEach(x=>vals.push(x.recurso));
    return [...new Set(vals.map(x=>String(x||'').trim()).filter(x=>x&&!/^pendiente$/i.test(x)))].sort((a,b)=>a.localeCompare(b));
  }

  function _aerSemanaActual() {
    const d=new Date(); d.setHours(12,0,0,0);
    const day=d.getDay(); const diff=day===0?-6:1-day;
    const ini=new Date(d); ini.setDate(d.getDate()+diff);
    const fin=new Date(ini); fin.setDate(ini.getDate()+6);
    const iso=x=>x.toISOString().slice(0,10);
    return {desde:iso(ini),hasta:iso(fin)};
  }

  function _aerInitClockifyFiltro(){
    if(aerClockifyFiltro.desde&&aerClockifyFiltro.hasta)return;
    const w=_aerSemanaActual(); aerClockifyFiltro.desde=w.desde; aerClockifyFiltro.hasta=w.hasta;
  }

  function _aerRegistrosClockifyActuales(){
    _aerInitClockifyFiltro();
    const base=Array.isArray(aerClockifyFiltro.registros)?aerClockifyFiltro.registros:(((aerDashboardData||{}).registros)||[]);
    return base.filter(x=>x.fecha&&x.fecha>=aerClockifyFiltro.desde&&x.fecha<=aerClockifyFiltro.hasta);
  }

  function aerConsultarRegistrosClockify(){
    const desde=(document.getElementById('aer-clock-desde')||{}).value||aerClockifyFiltro.desde;
    const hasta=(document.getElementById('aer-clock-hasta')||{}).value||aerClockifyFiltro.hasta;
    if(!desde||!hasta){alert('Selecciona Desde y Hasta.');return;}
    if(hasta<desde){alert('Hasta no puede ser menor que Desde.');return;}
    aerClockifyFiltro.desde=desde;aerClockifyFiltro.hasta=hasta;aerClockifyFiltro.cargando=true;
    const id=(aerDashboardData.proyecto||{}).id;
    google.script.run.withSuccessHandler(r=>{
      aerClockifyFiltro.cargando=false;
      if(!r||!r.ok){showError(r&&r.error?r.error:'No se pudieron consultar los registros.');return;}
      aerClockifyFiltro.registros=r.registros||[];aerClockifyFiltro.total=Number(r.total||0);
      if(aerTabActual==='esfuerzo')_aerRenderTab();
    }).withFailureHandler(e=>{aerClockifyFiltro.cargando=false;showError(e);}).getRegistrosClockifyAERRango(id,desde,hasta);

  function _aerDimensionesDisponibles(d) {
    const k = (d && d.kpis) || {};
    const r = (d && d.riesgos) || {};
    const backend = k.healthDimensiones || {};
    const fuentes = k.healthFuentes || {};

    // Compatibilidad: si el frontend nuevo está hablando con el service viejo,
    // healthDimensiones no existe. Calculamos las dimensiones automáticas para
    // que la UI no muestre 0% falsos.
    let esfuerzo = backend.esfuerzo;
    if (esfuerzo == null) {
      esfuerzo = 100;
      if (Number(k.consumoPct || 0) > 100) esfuerzo -= Math.min(40, (Number(k.consumoPct)-100)*0.7+15);
      else if (Number(k.desviacionPts || 0) > 10) esfuerzo -= Math.min(30, Number(k.desviacionPts)*0.8);
      if (Number(k.pctNoFacturables || 0) > 20) esfuerzo -= Math.min(15,(Number(k.pctNoFacturables)-20)*0.5+5);
      if (Number(k.pctFueraHorario || 0) > 5) esfuerzo -= Math.min(15,(Number(k.pctFueraHorario)-5)*0.8+4);
      esfuerzo = Math.max(0,Math.min(100,Math.round(esfuerzo)));
    }

    let tiempo = backend.tiempo;
    if (tiempo == null) {
      const dr = k.diasRestantes;
      tiempo = dr == null ? 100 : dr < 0 ? 40 : dr <= 14 ? 75 : 100;
    }

    let costo = backend.costo;
    if (costo == null) costo = Math.max(0,Math.min(100,100-Math.max(0,Number(k.consumoPct||0)-100)));

    let riesgo = backend.riesgo;
    const tieneRiesgos = (r.filas && r.filas.length) || fuentes.riesgo === true;
    if (!tieneRiesgos) riesgo = null;
    else if (riesgo == null) riesgo = Number(r.score == null ? 100 : r.score);

    return { tiempo, esfuerzo, costo:Math.round(costo), riesgo };
  }

  function _aerBarDimension(label, valor) {
    if (valor == null) {
      return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px"><b>${label}</b><span style="color:var(--gris)">N/D</span></div><div class="aer-bar"><i style="width:0%;background:#ccc"></i></div></div>`;
    }
    const color = valor >= 80 ? '#20ad68' : valor >= 60 ? '#f3a800' : '#e7354f';
    return _aerBar(label, valor, color);
  }

  function _aerVistaEjecutivo() {
    const d=aerDashboardData||{},p=d.proyecto||{},k=d.kpis||{},pl=d.plan||{},r=d.riesgos||{},ac=d.acciones||{};
    const dims=_aerDimensionesDisponibles(d);
    const hoyIso=(new Date()).toISOString().slice(0,10);
    const filas=(pl.filas||[]).slice();
    const total=Number(pl.compromisosTotal||filas.filter(x=>x.finPlan).length||0);
    const cerrados=Number(pl.cerradosTotal||filas.filter(x=>/complet|cerr/i.test(String(x.estado||''))||x.finReal).length||0);
    const pctCerrados=Number(pl.pctCerrados|| (total?Math.round(cerrados/total*1000)/10:0));
    const pctATiempo=Number(pl.pctCerradosATiempo||0);
    const vencidos=Number(pl.vencidosAbiertos||0);
    const vencenHoy=Number(pl.vencenHoy||0);
    const criticos=(r.criticos||[]).length;
    const abiertosRiesgo=(r.activos||[]).length;
    const isClosed=x=>/complet|cerr/i.test(String((x&&x.estado)||''))||!!(x&&x.finReal);
    const isStopped=x=>/deten|paus/i.test(String((x&&x.estado)||''));
    const isReview=x=>/por validar/i.test(String((x&&x.estado)||''));

    const orderedPlan=filas.slice().sort((a,b)=>String(a.finPlan||'9999-12-31').localeCompare(String(b.finPlan||'9999-12-31')) || String(a.actividad||'').localeCompare(String(b.actividad||'')));
    const nextItems=orderedPlan.filter(x=>x.finPlan && x.finPlan>=hoyIso && !isClosed(x));
    const nextMilestone=nextItems[0]||null;
    const nextMilestoneDate=nextMilestone?nextMilestone.finPlan:null;
    const nextMilestoneCount=nextItems.length;

    const durationPct=(()=>{
      if(!p.fechaInicio||!p.fechaFin) return null;
      const ini=new Date(p.fechaInicio+'T12:00:00');
      const fin=new Date(p.fechaFin+'T12:00:00');
      const hoy=new Date(hoyIso+'T12:00:00');
      if(isNaN(ini)||isNaN(fin)||fin<=ini) return null;
      return _aerClamp(((hoy-ini)/(fin-ini))*100);
    })();
    const tiempoVsPlan = dims.tiempo==null ? (durationPct==null?0:Math.round(durationPct)) : Math.round(dims.tiempo);
    const presupuestoPct=_aerClamp(Number(k.consumoPct||0));
    const costoReal=Number(k.costoReal||0);

    const depRows=filas.filter(x=>String(x.dependencia||'').trim());
    const depPriority={Detenida:4,Vencida:3,Abierta:2,Resuelta:1};
    const depGroups={};
    const depStatus=x=>{
      const e=String(x.estadoDependencia||'Abierta').toLowerCase();
      if(e.includes('resuelt')) return 'Resuelta';
      if(e.includes('deten')) return 'Detenida';
      if(x.finPlan && x.finPlan < hoyIso && !isClosed(x)) return 'Vencida';
      return 'Abierta';
    };
    depRows.forEach(x=>{
      const key=String(x.dependencia||'').trim().toLowerCase();
      if(!key) return;
      const st=depStatus(x);
      if(!depGroups[key]) depGroups[key]={dependencia:x.dependencia,status:st,rows:[x]};
      else {
        depGroups[key].rows.push(x);
        if((depPriority[st]||0)>(depPriority[depGroups[key].status]||0)) depGroups[key].status=st;
      }
    });
    const depUnique=Object.values(depGroups);
    const depVencidas=depUnique.filter(x=>x.status==='Vencida').length;
    const depAbiertas=depUnique.filter(x=>x.status==='Abierta').length;
    const depDetenidas=depUnique.filter(x=>x.status==='Detenida').length;
    const bloqueos=depDetenidas + filas.filter(x=>isStopped(x)&&!isClosed(x)).length;

    const resumenPuntos=[];
    const pushResumen=(cls,msg)=>resumenPuntos.push(`<div class="aer-exec-point ${cls}"><span class="ico">${cls==='ok'?'✓':cls==='warn'?'!':'•'}</span><div class="txt">${msg}</div></div>`);
    const healthScore=Number(k.healthScore||0);
    if(healthScore>=85) pushResumen('ok',`El proyecto mantiene una salud general <b>${_aerEsc(k.healthLabel||'saludable')}</b>, con avance parcial y control favorable del costo.`);
    else if(healthScore>=70) pushResumen('warn',`La salud general se mantiene en un nivel <b>estable</b>, aunque ya existen puntos que requieren seguimiento ejecutivo.`);
    else pushResumen('bad',`La salud general del proyecto está en un nivel de <b>alerta</b>. Conviene revisar compromisos, riesgos y consumo.`);
    if(vencidos>0) pushResumen('warn',`Existe${vencidos===1?'':'n'} <b>${vencidos} compromiso${vencidos===1?'':'s'} vencido${vencidos===1?'':'s'}</b> que requiere${vencidos===1?'':'n'} seguimiento inmediato.`);
    else if(vencenHoy>0) pushResumen('warn',`Hoy vencen <b>${vencenHoy} compromiso${vencenHoy===1?'':'s'}</b>; conviene confirmar cierre o replanear con el responsable.`);
    else pushResumen('ok',`No se observan compromisos vencidos al día de hoy y el seguimiento temporal permanece controlado.`);
    if(nextMilestone) pushResumen('ok',`El próximo compromiso relevante es <b>${_aerEsc(nextMilestone.actividad)}</b>, con fecha <b>${_aerFmtFecha(nextMilestone.finPlan)}</b>.`);
    else pushResumen('ok',`No hay próximos hitos registrados dentro del rango visible del proyecto.`);
    if(criticos>0) pushResumen('bad',`Se identific${criticos===1?'a':'an'} <b>${criticos} riesgo${criticos===1?' crítico':'s críticos'}</b> que conviene monitorear en comité.`);
    else pushResumen('ok',`No se observan riesgos críticos ni bloqueos relevantes en este momento.`);

    const badgeText = healthScore>=85 ? 'Proyecto en control con puntos de atención' : healthScore>=70 ? 'Proyecto estable con focos de seguimiento' : 'Proyecto en alerta ejecutiva';

    const attn=[];
    const addAttn=(cls,title,detail,source,responsable,fecha)=>attn.push({cls,title,detail,source,responsable,fecha});
    orderedPlan.filter(x=>x.finPlan && x.finPlan<hoyIso && !isClosed(x) && !isReview(x) && !isStopped(x)).slice(0,2).forEach(x=>addAttn('red',x.actividad,'Vencido','Planeación',x.responsable,x.finPlan));
    (ac.vencidas||[]).slice(0,2).forEach(x=>addAttn('red',x.accion||'Acción vencida',x.notas||'Requiere seguimiento inmediato','Acciones',x.responsable,x.fechaLimite));
    (r.criticos||[]).slice(0,1).forEach(x=>addAttn('red',x.riesgo,'Riesgo crítico','Riesgos',x.responsable,x.fechaLimite));
    orderedPlan.filter(x=>x.finPlan && x.finPlan===hoyIso && !isClosed(x) && !isReview(x) && !isStopped(x)).slice(0,2).forEach(x=>addAttn('orange',x.actividad,'Vence hoy','Planeación',x.responsable,x.finPlan));
    nextItems.filter(x=>x.finPlan && x.finPlan>hoyIso).slice(0,2).forEach(x=>addAttn('purple',x.actividad,'Próximo hito','Planeación',x.responsable,x.finPlan));
    if(!attn.length) addAttn('purple','Sin alertas críticas','No hay elementos que requieran atención inmediata.','Ejecutivo','—','');

    const horizon30=(()=>{const d=new Date(hoyIso+'T12:00:00'); d.setDate(d.getDate()+30); return d.toISOString().slice(0,10);})();
    const upcomingCombined=[];
    orderedPlan.forEach(x=>{ if(x.finPlan && x.finPlan>=hoyIso && x.finPlan<=horizon30 && !isClosed(x)) upcomingCombined.push({tipo:String(x.tipo||'').toLowerCase()==='hito'?'hito':'compromiso', titulo:x.actividad, responsable:x.responsable, fecha:x.finPlan, tag:isReview(x)?'Por validar':''}); });
    (ac.abiertas||[]).forEach(x=>{ if(x.fechaLimite && x.fechaLimite>=hoyIso && x.fechaLimite<=horizon30) upcomingCombined.push({tipo:'accion', titulo:x.accion, responsable:x.responsable, fecha:x.fechaLimite, tag:/cliente/i.test(String(x.dependencia||''))?'Decisión requerida':''}); });
    upcomingCombined.sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')) || String(a.titulo||'').localeCompare(String(b.titulo||'')));

    const riskDepList=depUnique.filter(x=>x.status!=='Resuelta').slice(0,3).map(g=>{const x=g.rows[0];const cls=g.status==='Vencida'?'bad':g.status==='Detenida'?'warn':'info';return `<div class="aer-exec-dep-item"><div class="txt"><b>${_aerEsc(g.dependencia)}</b><small>${_aerEsc(x.actividad)}${g.rows.length>1?` · ${g.rows.length} actividades`:''}</small></div><span class="aer-badge ${cls}">${g.status}</span></div>`;}).join('');

    const kpiCard=(cls,icon,label,value,sub,pct,pctColor)=>`<div class="aer-exec-kpi ${cls}"><div class="row"><span class="icon">${icon}</span><span class="label">${label}</span></div><div class="value">${value}</div><div class="sub">${sub||''}</div>${pct==null?'':`<div class="bar"><i style="width:${_aerClamp(pct)}%;background:${pctColor||'linear-gradient(90deg,#6429d8,#8a42ea)'}"></i></div>`}</div>`;

    return `<div class="aer-exec-view">
      <div class="aer-exec-top">
        ${kpiCard('health','♡','Health Score',`${healthScore}/100`,k.healthLabel||'—',healthScore,'linear-gradient(90deg,#2db874,#61d39a)')}
        ${kpiCard('progress','▥','Avance global',`${Math.round(pctCerrados)}%`,`${cerrados} de ${total} compromisos cerrados`,pctCerrados,'linear-gradient(90deg,#4d72ff,#5db4ff)')}
        ${kpiCard('time','◔','Tiempo vs plan',`${tiempoVsPlan}%`,durationPct==null?'sin periodo base':`${Math.round(durationPct)}% del periodo transcurrido`,tiempoVsPlan,'linear-gradient(90deg,#f3a800,#ffc84a)')}
        ${kpiCard('budget','◉','Presupuesto consumido',`${Math.round(presupuestoPct*10)/10}%`,`${_aerFmtH(k.horasTotales)} registradas`,presupuestoPct,'linear-gradient(90deg,#6b32df,#8e56ec)')}
        ${kpiCard('cost','$','Costo real',`$${costoReal.toLocaleString('es-MX')}`,'según costing rate',null,null)}
        ${kpiCard('risk','⚠','Riesgos críticos',String(criticos),`${abiertosRiesgo} riesgo(s) activos`,criticos?100:0,criticos?'linear-gradient(90deg,#ef3851,#ff7a8e)':'linear-gradient(90deg,#d6d2e4,#d6d2e4)')}
        ${kpiCard('next','⚑','Próximo hito',nextMilestoneDate?_aerFmtFecha(nextMilestoneDate):'—',nextMilestone?`${nextMilestoneCount} eventos próximos`:'sin eventos próximos',null,null)}
      </div>

      <div class="aer-exec-main">
        <div class="aer-card">
          <h3 style="margin-bottom:14px">Resumen ejecutivo</h3>
          <div class="aer-exec-summary">
            <div class="aer-exec-points">${resumenPuntos.join('')}</div>
            <div class="aer-exec-metrics">
              <div class="aer-exec-chip">◉ ${_aerEsc(badgeText)}</div>
              ${_aerBar('Tiempo',tiempoVsPlan,tiempoVsPlan>=80?'#f3a800':tiempoVsPlan>=60?'#f0b22a':'#e94359',`${tiempoVsPlan}%`)}
              ${_aerBar('Esfuerzo',dims.esfuerzo==null?0:dims.esfuerzo,dims.esfuerzo>=80?'#20ad68':dims.esfuerzo>=60?'#f3a800':'#e7354f',dims.esfuerzo==null?'N/D':`${Math.round(dims.esfuerzo)}%`)}
              ${_aerBar('Costo',dims.costo==null?0:dims.costo,dims.costo>=80?'#20ad68':dims.costo>=60?'#f3a800':'#e7354f',dims.costo==null?'N/D':`${Math.round(dims.costo)}%`)}
              ${_aerBar('Riesgo',dims.riesgo==null?0:dims.riesgo,dims.riesgo>=80?'#20ad68':dims.riesgo>=60?'#f3a800':'#e7354f',dims.riesgo==null?'N/D':`${Math.round(dims.riesgo)}%`)}
              <div class="aer-exec-commit">
                <div class="top"><b>Cumplimiento de compromisos</b><span>${cerrados} de ${total||0}</span></div>
                <div class="aer-bar"><i style="width:${_aerClamp(pctATiempo||pctCerrados)}%;background:linear-gradient(90deg,#5a2bd7,#8e57ec)"></i></div>
                <div class="meta"><span>${Math.round(pctATiempo||pctCerrados)}% cerrados a tiempo</span><b>${vencidos} vencido(s)</b></div>
              </div>
            </div>
          </div>
        </div>

        <div class="aer-card">
          <div class="aer-exec-attn-head"><h3>Atención ejecutiva</h3><a href="javascript:void(0)" class="aer-exec-attn-link" onclick="aerCambiarTab('acciones')">Ver todas las acciones →</a></div>
          <div class="aer-exec-attn">${attn.slice(0,4).map(x=>`<div class="aer-exec-alert ${x.cls}"><span class="dot"></span><div class="txt"><b>${_aerEsc(x.title)}</b><small>${_aerEsc(x.detail||'')}</small><div class="meta"><span>👤 ${_aerEsc(x.responsable||'—')}</span>${x.fecha?`<span>📅 ${_aerFmtFecha(x.fecha)}</span>`:''}</div></div><span class="pill ${x.cls==='purple'?'pill-purple':''}">${_aerEsc(x.source)}</span></div>`).join('')}</div>
        </div>

      <div class="aer-exec-grid3">
        <div class="aer-card">
          <div class="aer-card-title-row"><div><h3>Próximos hitos / decisiones (30 días)</h3></div><a href="javascript:void(0)" class="aer-exec-attn-link" onclick="aerCambiarTab('planeacion')">Ver todos →</a></div>
          <div class="aer-exec-list">${upcomingCombined.slice(0,5).map(x=>`<div class="row"><span class="dot" style="background:${x.tipo==='accion'?'#efa11d':x.tipo==='hito'?'#6b32df':'#8a6cff'}"></span><div class="txt"><b>${_aerEsc(x.titulo)}</b><small>${_aerEsc(x.responsable||'Sin responsable')}</small>${x.tag?`<span class="aer-exec-tag">${_aerEsc(x.tag)}</span>`:''}</div><span class="date">${_aerFmtFecha(x.fecha)}</span></div>`).join('') || '<div class="aer-exec-empty">Sin compromisos o acciones próximas.</div>'}</div>
        </div>

        <div class="aer-card">
          <div class="aer-card-title-row"><div><h3>Finanzas y esfuerzo</h3></div></div>
          <div class="aer-exec-fin-wrap">
            <div class="aer-donut" style="background:conic-gradient(#5a2bd7 0 ${presupuestoPct}%,#e8e5f2 ${presupuestoPct}% 100%)"><div><b>${_aerFmtH(k.horasTotales).replace(' h','')}</b><small>consumo</small></div></div>
            <div class="aer-exec-fin-legend">
              <div class="mini"><span><i class="sw" style="background:#5a2bd7"></i>Consumo</span><span class="v">${_aerFmtH(k.horasTotales)}</span></div>
              <div class="mini"><span><i class="sw" style="background:#8d65ed"></i>Facturables</span><span class="v">${_aerFmtH(k.horasFacturables)}</span></div>
              <div class="mini"><span><i class="sw" style="background:#c6b9f8"></i>No facturables</span><span class="v">${_aerFmtH(k.horasNoFacturables)}</span></div>
              <div class="mini"><span><i class="sw" style="background:#dfd8f5"></i>Fuera de horario</span><span class="v">${_aerFmtH(k.horasFueraHorario)}</span></div>
              <div class="mini"><span><i class="sw" style="background:#7a43e8"></i>Costo real</span><span class="v">$${costoReal.toLocaleString('es-MX')}</span></div>
            </div>
          </div>
        </div>

        <div class="aer-card">
          <div class="aer-card-title-row"><div><h3>Riesgos y dependencias</h3></div><a href="javascript:void(0)" class="aer-exec-attn-link" onclick="aerCambiarTab('riesgos')">Ver todos →</a></div>
          <div class="aer-exec-stats"><div class="box red"><b>${criticos}</b><span>riesgo crítico</span></div><div class="box blue"><b>${depVencidas+depAbiertas+depDetenidas}</b><span>dependencias clave</span></div><div class="box green"><b>${bloqueos}</b><span>bloqueos críticos</span></div></div>
          <div class="aer-exec-dep-list">${riskDepList || '<div class="aer-exec-empty">Sin dependencias abiertas, detenidas o vencidas.</div>'}</div>
        </div>

  }


  function _aerVistaPlaneacion() {
    _aerInitPlanFiltroMes();
    const pl=aerDashboardData.plan||{}, filas=(pl.filas||[]).slice();
    const fromMonth = aerPlanFiltroMes.desde || _aerMonthValue(new Date());
    const toMonth = aerPlanFiltroMes.hasta || fromMonth;
    const parseMonthStart = m => { const [y,mo] = String(m||'').split('-').map(Number); return new Date(y||new Date().getFullYear(), (mo||1)-1, 1, 12); };
    const monthEnd = m => { const [y,mo] = String(m||'').split('-').map(Number); return new Date(y||new Date().getFullYear(), (mo||1), 0, 12); };
    let min = parseMonthStart(fromMonth);
    let max = monthEnd(toMonth);
    if (max < min) { const t=min; min=max; max=t; }

    const spanDays=Math.max(1,Math.round((max-min)/86400000)+1);
    const pos=v=>{
      if(!v)return null;
      const d=new Date(v+'T12:00:00');
      return Math.max(0,Math.min(100,(((d-min)/86400000)/spanDays)*100));
    };
    const width=(a,b)=>{
      const pa=pos(a), pb=pos(b||a);
      if(pa==null||pb==null) return 0.8;
      return Math.max(0.8,pb-pa);
    };
    const fmtShort=v=>{
      if(!v) return '—';
      const d=new Date(v+'T12:00:00');
      return isNaN(d)?'—':d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});
    };
    const addDays=(d,n)=>new Date(d.getTime()+n*86400000);
    const hoyIso=(new Date()).toISOString().slice(0,10);

    const grouped=[], map={};
    filas.forEach(x=>{
      const key=(x.responsable||'Pendiente').trim()||'Pendiente';
      if(!map[key]) { map[key]={responsable:key,items:[]}; grouped.push(map[key]); }
      map[key].items.push(x);
    });
    grouped.forEach(g=>g.items.sort((a,b)=>
      String(a.inicioPlan||a.finPlan||'').localeCompare(String(b.inicioPlan||b.finPlan||'')) ||
      String(a.actividad||'').localeCompare(String(b.actividad||''))
    ));

    const monthMap=[];
    let cursor=new Date(min.getFullYear(), min.getMonth(), 1, 12);
    while(cursor<=max){
      const startM=new Date(cursor.getTime());
      const next=new Date(startM.getFullYear(),startM.getMonth()+1,1,12);
      const left=pos(startM.toISOString().slice(0,10))||0;
      const right=pos(addDays(next,-1).toISOString().slice(0,10))||100;
      monthMap.push({
        label:startM.toLocaleDateString('es-MX',{month:'long'}).toUpperCase(),
        center:left+((right-left)/2)
      });
      cursor=next;
    }

    const weeks=[];
    let wk=new Date(min.getTime());
    while(wk<=max){
      weeks.push({date:new Date(wk.getTime()),left:pos(wk.toISOString().slice(0,10))||0});
      wk=addDays(wk,7);
    }

    const todayPos=pos(hoyIso);
    const estadoCompromiso=x=>{
      const estado = String(x.estado||'').toLowerCase();
      if (/complet|cerr/.test(estado) || !!x.finReal) return 'closed';
      if (/detenido|paus/.test(estado)) return 'stopped';
      if (/por validar/.test(estado)) return 'review';
      if (x.finPlan && x.finPlan === hoyIso) return 'duetoday';
      if (x.finPlan && x.finPlan < hoyIso) return 'overdue';
      if (/por iniciar/.test(estado) || (x.inicioPlan && x.inicioPlan > hoyIso)) return 'future';
      return 'open';
    };

    const rowHtml=grouped.map(g=>{
      const groupHeader=`<div class="aer-gantt2-label group">${_aerEsc(g.responsable)}</div><div class="aer-gantt2-track aer-gantt2-grouptrack"></div>`;
      const items=g.items.map(x=>{
        const pStart=pos(x.inicioPlan), pWidth=width(x.inicioPlan,x.finPlan);
        const status=estadoCompromiso(x);
        const cerrado=status==='closed';
        const isHito=String(x.tipo||'').toLowerCase()==='hito';
        const cierreTxt=x.finReal?`<div class="aer-close-date">Cerrado: ${fmtShort(x.finReal)}</div>`:'';
        return `<div class="aer-gantt2-label">
          <div class="aer-commit-label">
            <input class="aer-commit-check" type="checkbox" ${cerrado?'checked':''} onchange="aerMarcarCompromiso('${_aerEsc(x.uid)}',this.checked,this)" aria-label="Marcar compromiso ${_aerEsc(x.actividad)} como cerrado">
            <div>
              <div class="name">${_aerEsc(x.actividad)}</div>
              <div class="meta"><span class="aer-status-dot ${status}"></span>${_aerEsc(x.estado||'Por iniciar')} · Compromiso: ${fmtShort(x.inicioPlan)} → ${fmtShort(x.finPlan)} · Esfuerzo: ${Number(x.esfuerzo||x.orden||0)}</div>
              ${cierreTxt}
            </div>
          </div>
        </div>
        <div class="aer-gantt2-track">
          ${x.inicioPlan&&x.finPlan?`<span class="aer-commit-line ${status}" style="left:${pStart}%;width:${pWidth}%"></span>`:''}
          ${x.finPlan?`<span class="aer-commit-end" style="left:${pos(x.finPlan)}%"></span>`:''}
          ${isHito&&x.finPlan?`<span class="aer-gantt2-hito" style="left:${pos(x.finPlan)}%"></span>`:''}
        </div>`;
      }).join('');
      return groupHeader+items;
    }).join('');

    const total=Number(pl.compromisosTotal||filas.filter(x=>x.finPlan).length||0);
    const cerrados=Number(pl.cerradosTotal||0);
    const atiempo=Number(pl.cerradosATiempo||0);
    const vencidos=Number(pl.vencidosAbiertos||0);
    const vencenHoy=Number(pl.vencenHoy||0);
    const proximos=(pl.proximosCompromisos||[]).slice(0,6);

    const addIsoDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    const vacaciones=((((aerDashboardData||{}).vacaciones||{}).filas)||[]).slice();
    const limite7=addIsoDays(hoyIso,7);
    const limite30Vac=addIsoDays(hoyIso,30);
    const vacacionesProximas=vacaciones.filter(v=>!/cancel|rechaz/i.test(String(v.estado||''))&&v.fin>=hoyIso&&v.inicio<=limite30Vac).sort((a,b)=>String(a.inicio).localeCompare(String(b.inicio)));
    const diasHabiles=(a,b)=>{if(!a||!b||b<a)return 0;let d=new Date(a+'T12:00:00'),f=new Date(b+'T12:00:00'),n=0;while(d<=f){if(d.getDay()!==0&&d.getDay()!==6)n++;d.setDate(d.getDate()+1)}return n};
    const habiles30=Math.max(1,diasHabiles(hoyIso,limite30Vac));
    const vacDiasPorRecurso={};vacacionesProximas.forEach(v=>{const a=v.inicio<hoyIso?hoyIso:v.inicio,b=v.fin>limite30Vac?limite30Vac:v.fin;vacDiasPorRecurso[v.recurso]=(vacDiasPorRecurso[v.recurso]||0)+diasHabiles(a,b)});
    const vacWeeks=Array.from({length:6},(_,i)=>{const ini=addIsoDays(hoyIso,i*7);const fin=addIsoDays(ini,6);const ausentes=new Set(vacaciones.filter(v=>!/cancel|rechaz/i.test(String(v.estado||''))&&v.inicio<=fin&&v.fin>=ini).map(v=>v.recurso));return{ini,fin,count:ausentes.size}});
    const abiertos=filas.filter(x=>!(/complet|cerr/i.test(String(x.estado||''))||x.finReal));
    const proximos7=abiertos.filter(x=>x.finPlan&&x.finPlan>=hoyIso&&x.finPlan<=limite7&&!/por validar|detenido/i.test(String(x.estado||''))).sort((a,b)=>String(a.finPlan).localeCompare(String(b.finPlan)));
    const hitosValidar=filas.filter(x=>String(x.tipo||'').toLowerCase()==='hito'&&/por validar/i.test(String(x.estado||'')));
    const vencidosRows=abiertos.filter(x=>x.finPlan&&x.finPlan<hoyIso&&!/por validar|detenido/i.test(String(x.estado||''))).sort((a,b)=>String(a.finPlan).localeCompare(String(b.finPlan)));
    const detenidosRows=abiertos.filter(x=>/detenido/i.test(String(x.estado||'')));
    const depsRows=filas.filter(x=>String(x.dependencia||'').trim());
    const depStatus=x=>{
      const e=String(x.estadoDependencia||'Abierta').toLowerCase();
      if(e.includes('resuelt')) return 'Resuelta';
      if(e.includes('deten')) return 'Detenida';
      if(x.finPlan && x.finPlan < hoyIso && !(/complet|cerr/i.test(String(x.estado||''))||x.finReal)) return 'Vencida';
      return 'Abierta';
    };
    const esfuerzoPlan=filas.reduce((s,x)=>s+Number(x.esfuerzo!=null?x.esfuerzo:x.orden||0),0);
    const esfuerzoCerrado=filas.filter(x=>/complet|cerr/i.test(String(x.estado||''))||x.finReal).reduce((s,x)=>s+Number(x.esfuerzo!=null?x.esfuerzo:x.orden||0),0);
    const esfuerzoPendiente=Math.max(0,esfuerzoPlan-esfuerzoCerrado);
    const avancePct=total?Math.round(cerrados/total*100):0;

    // Capacidad ACTUAL: 6 puntos = 100% por recurso.
    // Solo consume capacidad una actividad/hora asignada que ya inició y sigue abierta.
    // Completado, Por validar, Detenido e Hito no consumen capacidad.
    const ocupacionActual=_aerOcupacionActualPorResponsable(filas);
    const respRows=Object.entries(ocupacionActual)
      .sort((a,b)=>b[1].puntos-a[1].puntos || a[0].localeCompare(b[0]))
      .slice(0,8);
    const recursosConCap=respRows.length;
    const puntosOcupados=respRows.reduce((s,[,v])=>s+Number(v.puntos||0),0);
    const capacidadTotal=recursosConCap*6;
    const puntosDisponibles=respRows.reduce((s,[,v])=>s+Math.max(0,6-Number(v.puntos||0)),0);
    const recursosOcupados=respRows.filter(([,v])=>Number(v.puntos||0)===6).length;
    const recursosSobrecargados=respRows.filter(([,v])=>Number(v.puntos||0)>6).length;
    const depGroups={};
    const depPriority={Detenida:4,Vencida:3,Abierta:2,Resuelta:1};
    depsRows.forEach(x=>{
      const key=_aerNormFilter(x.dependencia);
      if(!key) return;
      const st=depStatus(x);
      if(!depGroups[key]) depGroups[key]={dependencia:x.dependencia,status:st,rows:[x]};
      else {
        depGroups[key].rows.push(x);
        if((depPriority[st]||0)>(depPriority[depGroups[key].status]||0)) depGroups[key].status=st;
      }
    });
    const depUnique=Object.values(depGroups);
    const depVencidas=depUnique.filter(x=>x.status==='Vencida').length;
    const depAbiertas=depUnique.filter(x=>x.status==='Abierta').length;
    const depDetenidas=depUnique.filter(x=>x.status==='Detenida').length;
    const capAlertas=respRows.filter(([,v])=>Number(v.puntos||0)>=6);
    const capSobrecarga=capAlertas.filter(([,v])=>Number(v.puntos||0)>6);
    const bloqueosCriticos=depDetenidas;
    const attnCount=vencidosRows.length+proximos7.length+hitosValidar.length+bloqueosCriticos;
    const kpi=(icon,label,value,sub,cls='')=>`<div class="aer-plan-kpi ${cls}"><div class="top"><span class="icon">${icon}</span><span>${label}</span></div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
    const attnItems=(rows,kind,limit=5)=>rows.slice(0,limit).map(x=>`<div class="aer-attn-item ${kind}"><span class="dot"></span><span class="txt"><b>${_aerEsc(x.actividad)}</b><small>${_aerEsc(x.responsable||'Sin responsable')}</small></span><span class="date">${_aerFmtFecha(x.finPlan)}</span></div>`).join('');
    const proxFechaRef=proximos7.length?_aerFmtFecha(proximos7.reduce((a,b)=>new Date(a.finPlan)<=new Date(b.finPlan)?a:b).finPlan):'';
    const vacItems=(rows,limit=3)=>rows.slice(0,limit).map(v=>`<div class="aer-attn-item green"><span class="dot"></span><span class="txt"><b>${_aerEsc(v.recurso)}</b><small>${_aerEsc(v.estado||'Aprobada')}</small><span class="impact">Afecta capacidad</span></span><span class="date">${_aerFmtFecha(v.inicio)} → ${_aerFmtFecha(v.fin)}</span></div>`).join('');

    return `<div class="aer-plan-dashboard">
      <div class="aer-plan-top-kpis">
        ${kpi('▣','Compromisos',total,'Total del proyecto')}
        ${kpi('✓','Cerrados',cerrados,`${_aerFmtPct(pl.pctCerrados||avancePct)} del total`,'good')}
        ${kpi('◔','Avance',`${avancePct}%`,`${atiempo} cerrados a tiempo`,'purple')}
        ${kpi('!','Vencidos',vencidos,vencidos?'requieren atención':'sin vencidos','bad')}
        ${kpi('◫','Próximos 7 días',proximos7.length,'vencen pronto','warn')}
        ${kpi('◇','Hitos por validar',hitosValidar.length,'pendientes','purple')}
        ${kpi('◷','Ocupación',`${recursosOcupados}/${recursosConCap}`,recursosSobrecargados?`${recursosSobrecargados} sobreasignado(s)`:`${puntosDisponibles} pts disponibles`,recursosSobrecargados?'bad':'purple')}
        ${kpi('⚑','Vacaciones próximas',vacacionesProximas.length,'próx. 30 días','good')}
      </div>

      <div class="aer-plan-main">
        <div class="aer-card">
          <div class="aer-roadmap-toolbar"><div><h3>Roadmap de compromisos</h3><div class="aer-plan-side-note">Visualiza el plan por responsable y su estado actual.</div></div><div class="aer-actions"><div class="aer-plan-range"><label>Desde <input type="month" value="${fromMonth}" onchange="aerCambiarRangoPlan('desde',this.value)"></label><label>Hasta <input type="month" value="${toMonth}" onchange="aerCambiarRangoPlan('hasta',this.value)"></label></div><button class="aer-btn primary" onclick="aerAbrirPlan()">+ Actividad / Hito</button><button class="aer-btn" onclick="aerAbrirImportPlan()">⇧ Cargar CSV</button></div></div>
          <div class="aer-gantt2">${filas.length?`<div class="aer-gantt2-wrap">${todayPos!=null?`<div class="aer-gantt2-today-overlay"><div class="aer-gantt2-today-global" style="left:${todayPos}%"><span class="tag">HOY</span></div></div>`:''}<div class="aer-gantt2-grid"><div></div><div class="aer-gantt2-head">${monthMap.map(m=>`<div class="aer-gantt2-month" style="left:${m.center}%">${m.label}</div>`).join('')}${weeks.map(w=>`<div class="aer-gantt2-week" style="left:${w.left}%"><span class="aer-gantt2-week-label">${w.date.toLocaleDateString('es-MX',{day:'numeric',month:'short'})}</span></div>`).join('')}</div>${rowHtml}</div><div class="aer-gantt2-legend"><span><i style="background:#25aa65"></i> Completado</span><span><i style="background:#6c2ce0"></i> En progreso</span><span><i style="background:#d7d2e8"></i> Por iniciar</span><span><i style="background:#e23a4f"></i> Vencido</span><span><i class="duetoday"></i> Próximo a vencer</span><span><i class="hito"></i> Hito</span><span><i class="review"></i> Por validar</span><span><i style="background:#ef8d32"></i> Detenido</span></div></div>`:'<div class="aer-callout purple">Aún no hay compromisos cargados.</div>'}</div>
        </div>
        <div class="aer-card aer-plan-attn">
          <div class="aer-attn-head"><div><h3>Atención requerida</h3><div class="aer-sub">Elementos que necesitan tu atención</div></div><span class="badge-count">${attnCount}</span></div>
          <div class="aer-attn-list">
            <div class="aer-attn-section red"><div class="title"><span class="left"><span class="iconball">!</span><span>${vencidosRows.length} vencido${vencidosRows.length===1?'':'s'}</span></span><span class="chev">›</span></div><div class="aer-attn-items">${attnItems(vencidosRows,'red',3)||'<div class="aer-attn-empty">Sin compromisos vencidos.</div>'}</div></div>
            <div class="aer-attn-section orange"><div class="title"><span class="left"><span class="iconball">!</span><span><span>${proximos7.length} próximo${proximos7.length===1?'':'s'} a vencer</span>${proxFechaRef?`<span class="mini">Vencen el ${proxFechaRef}</span>`:''}</span></span><span class="chev">›</span></div><div class="aer-attn-items">${attnItems(proximos7,'orange',4)||'<div class="aer-attn-empty">Sin compromisos próximos a vencer.</div>'}</div></div>
            <div class="aer-attn-section purple"><div class="title"><span class="left"><span class="iconball">◇</span><span>${hitosValidar.length} hito${hitosValidar.length===1?'':'s'} por validar</span></span><span class="chev">›</span></div><div class="aer-attn-items">${attnItems(hitosValidar,'purple',4)||'<div class="aer-attn-empty">Sin hitos pendientes por validar.</div>'}</div></div>
            <div class="aer-attn-section green"><div class="title"><span class="left"><span class="iconball">✓</span><span>${bloqueosCriticos} bloqueo${bloqueosCriticos===1?'':'s'} crítico${bloqueosCriticos===1?'':'s'}</span></span><span class="chev">›</span></div>${bloqueosCriticos?`<div class="aer-attn-items">${depUnique.filter(x=>x.status==='Detenida').slice(0,3).map(x=>`<div class="aer-attn-item green"><span class="dot"></span><span class="txt"><b>${_aerEsc(x.label)}</b><small>${x.rows.length} actividad(es) relacionada(s)</small></span><span class="date">Detenido</span></div>`).join('')}</div>`:'<div class="body-note">No hay bloqueos críticos en este momento.</div>'}</div>
            <div class="aer-attn-section green"><div class="title"><span class="left"><span class="iconball">☂</span><span>${vacacionesProximas.length} vacaciones próximas</span></span><span class="chev">›</span></div>${vacacionesProximas.length?`<div class="aer-attn-items">${vacItems(vacacionesProximas,3)}</div>`:'<div class="body-note">No hay vacaciones próximas registradas.</div>'}</div>
          </div>

  function aerMarcarCompromiso(uid,cerrado,checkbox) {
    const id=aerDashboardData&&aerDashboardData.proyecto?aerDashboardData.proyecto.id:'';
    if(!id||!uid) {
      if(checkbox) checkbox.checked=!cerrado;
      return;
    }

    if(checkbox) checkbox.disabled=true;

    google.script.run
      .withSuccessHandler(res=>{
        if(!res||!res.ok){
          if(checkbox){ checkbox.checked=!cerrado; checkbox.disabled=false; }
          showError(res&&res.error?res.error:'No se pudo guardar el cierre.');
          return;
        }
        aerRecargarProyecto();
      })
      .withFailureHandler(err=>{
        if(checkbox){ checkbox.checked=!cerrado; checkbox.disabled=false; }
        showError(err);
      })
      .marcarCierrePlaneacionAER(id,uid,cerrado);
  }

  function _aerClienteNivelClase(n){ n=String(n||'').toLowerCase(); return n==='alto'?'green':n==='medio'?'yellow':'red'; }
  function _aerClienteBool(v){ return !!v; }

  function _aerToast(msg,type='success'){
    const el=document.createElement('div');
    el.className=`aer-toast ${type}`;
    el.textContent=msg;
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),220);},1800);
  }

  function _aerStartSaving(btn,text='Guardando...'){
    if(!btn){ return { ok(){}, error(){} }; }
    const original=btn.innerHTML;
    btn.disabled=true;
    btn.classList.add('saving');
    btn.innerHTML=text;
    return {
      ok(message='Guardado correctamente'){ _aerToast(message,'success'); },
      error(message){ btn.disabled=false; btn.classList.remove('saving'); btn.innerHTML=original; if(message) _aerToast(message,'error'); }
    };
  }

  function _aerVistaRecursos(){
    const ev=((((aerDashboardData||{}).evaluaciones||{}).filas)||[]).slice();

    const recursos=_aerRecursosProyecto();
    if(!aerEvalRecursoSeleccionado||recursos.indexOf(aerEvalRecursoSeleccionado)<0)aerEvalRecursoSeleccionado=recursos[0]||'';

    const latest=Object.values(porRecurso).map(a=>a[a.length-1]).filter(Boolean);
    const avg=latest.length?Math.round(latest.reduce((s,x)=>s+Number(x.score||0),0)/latest.length):0;
    const pendientes=Math.max(0,recursos.length-latest.length);const observacion=latest.filter(x=>Number(x.score||0)<80).length;const top=latest.filter(x=>Number(x.score||0)>=90).length;
    const hist=(porRecurso[aerEvalRecursoSeleccionado]||[]);const sel=hist[hist.length-1]||{recurso:aerEvalRecursoSeleccionado,score:0,calidad:0,cumplimiento:0,comunicacion:0,colaboracion:0,autonomia:0,categoria:'Sin evaluación'};
    const pts=evOrdenadas.slice(0,5).reverse();const xs=pts.map((_,i)=>pts.length<=1?50:10+(i*(80/(pts.length-1))));const ys=pts.map(x=>90-(Number(x.score||0)*.75));const poly=pts.map((x,i)=>`${xs[i]},${ys[i]}`).join(' ');
    const ptsDelta=pts.length>1?(Number(pts[pts.length-1].score||0)-Number(pts[0].score||0)):0;
    const cats={'Alto desempeño':0,'Sólido':0,'En seguimiento':0,'Crítico':0};latest.forEach(x=>cats[_aerEvalCategoria(x.score)]++);const totalCat=Math.max(1,latest.length);const a1=cats['Alto desempeño']/totalCat*100,a2=a1+cats['Sólido']/totalCat*100,a3=a2+cats['En seguimiento']/totalCat*100;
    const prox=ev.filter(x=>x.proximaEvaluacion).sort((a,b)=>_aerDateKey(a.proximaEvaluacion)-_aerDateKey(b.proximaEvaluacion))[0];

    return `<div class="aer-vivid-grid"><div class="aer-vivid-card"><div class="aer-action-hero"><div><h3>Evaluación de recursos</h3><div class="sub">Seguimiento del desempeño, histórico de evaluaciones y comentarios.</div></div><button class="aer-btn primary" onclick="aerAbrirEvaluacion()">+ Nueva evaluación</button></div><div class="aer-eval-kpis" style="margin-top:12px">${[['◉','Recursos evaluados',latest.length,'Total de la célula','purple'],['▥','Promedio general',`${avg}/100`,latest.length?'última evaluación por recurso':'sin evaluaciones','blue'],['◫','Pendientes por evaluar',pendientes,'Requieren evaluación','red'],['!','En observación',observacion,'Requiere seguimiento','red'],['★','Top performers',top,'Desempeño sobresaliente','green']].map(x=>`<div class="aer-vivid-card soft"><div class="aer-vivid-kpi-head"><span class="aer-vivid-icon ${x[4]}">${x[0]}</span><div><div class="aer-vivid-label">${x[1]}</div><div class="aer-vivid-value">${x[2]}</div><div class="aer-vivid-sub">${x[3]}</div></div></div></div>`).join('')}</div></div>

      <div class="aer-eval-bottom"><div class="aer-vivid-card"><div class="aer-section-title"><h3>Comentarios recientes</h3></div><div class="aer-eval-comments">${evOrdenadas.slice(0,5).map(x=>`<div class="aer-eval-comment"><span>${_aerFmtFecha(x.fechaEvaluacion)}</span><b>${_aerEsc(x.recurso)}</b><span>“${_aerEsc(x.comentario||'Sin comentario')}”</span><span class="tag">${_aerEvalCategoria(x.score)}</span></div>`).join('')||'<div class="aer-sub">Sin comentarios.</div>'}</div></div><div class="aer-vivid-card"><div class="aer-section-title"><h3>Últimas evaluaciones</h3></div><table class="aer-eval-history"><thead><tr><th>Fecha</th><th>Recurso</th><th>Evaluador</th><th>Resultado</th><th>Estado</th><th></th></tr></thead><tbody>${evOrdenadas.slice(0,5).map(x=>`<tr><td>${_aerFmtFecha(x.fechaEvaluacion)}</td><td>${_aerEsc(x.recurso)}</td><td>${_aerEsc(x.evaluador)}</td><td class="score">${x.score}/100</td><td><span class="aer-pill ${_aerEvalClase(x.score)}">${_aerEvalCategoria(x.score)}</span></td><td><button class="aer-btn" onclick="aerAbrirEvaluacion('${x.uid}')">⋯</button></td></tr>`).join('')||'<tr><td colspan="6">Sin evaluaciones.</td></tr>'}</tbody></table></div></div>

  function _aerVistaRiesgos() {
    const r=aerDashboardData.riesgos||{}, k=aerDashboardData.kpis||{}, ac=aerDashboardData.acciones||{};
    const activos=_aerDedupRiesgosVista(r.activos||[]);
    const crit=activos.filter(x=>/alto|crit/i.test(String(x.impacto||'')) || /alta|crit/i.test(String(x.probabilidad||'')));
    const abiertos=activos.filter(x=>!/cerr|mitigad|resuelto/i.test(String(x.estado||'')));
    const matrix={};
    activos.forEach(x=>{
      const key=`${String(x.probabilidad||'Media').toLowerCase()}|${String(x.impacto||'Medio').toLowerCase()}`;
      matrix[key]=(matrix[key]||0)+1;
    });
    const hoyIso=(new Date()).toISOString().slice(0,10);
    const vencidasAcc=(ac.vencidas||[]).filter(x=>x.fechaLimite&&x.fechaLimite<hoyIso);
    const exposure=crit.length>0?'Alta':activos.length>=3?'Media':(activos.length?'Media':'Baja');
    const abiertosCnt=abiertos.filter(x=>/abiert|proposed/i.test(String(x.estado||''))||!x.estado).length;
    const mitigCnt=abiertos.filter(x=>/mitig|progreso/i.test(String(x.estado||''))).length;
    const cerrCnt=Math.max(0,activos.length-abiertosCnt-mitigCnt);
    const atencion=vencidasAcc[0]||(ac.vencidas||[])[0]||null;
    const riesgoPct=x=>Math.max(15,Math.min(95,100-((/alto|alta|crit/i.test(String(x.impacto||''))?35:18)+(/alta|alto/i.test(String(x.probabilidad||''))?25:10))));

    return `<div class="aer-vivid-grid">
      <div class="aer-risk-kpis">
        <div class="aer-vivid-card soft"><div class="aer-vivid-kpi-head"><span class="aer-vivid-icon green">♡</span><div><div class="aer-vivid-label">Health score</div><div class="aer-vivid-value">${k.healthScore||0}/100</div><div class="aer-vivid-sub">${_aerEsc(k.healthLabel||'Salud general')}</div></div></div></div>

  function _aerTablaAcciones(filas) {

  }

  function _aerOpcionesEstadoAccion(sel){return ['Pendiente','En progreso','Detenido','Completado'].map(v=>`<option value="${v}" ${sel===v?'selected':''}>${v}</option>`).join('');}

  function _aerOpcionesDependenciaAccion(sel){const base=['','Cliente','Interna','NA'];const actual=String(sel||'');if(actual&&!base.includes(actual))base.splice(1,0,actual);return base.map(v=>`<option value="${_aerEsc(v)}" ${actual===v?'selected':''}>${v||'—'}</option>`).join('');}

  function _aerVistaAcciones() {

    const respCount={}; (filas||[]).forEach(x=>{const r=String(x.responsable||'').trim()||'Sin responsable'; respCount[r]=(respCount[r]||0)+1;});

  function _aerInitPlanFiltroMes(){

  function _aerFilaConsumeCapacidad(x, fechaIso) {
    if (!x) return false;
    const tipo=String(x.tipo||'').toLowerCase();
    const estado=String(x.estado||'').toLowerCase();
    const resp=String(x.responsable||'').trim();
    const esfuerzo=Number(x.esfuerzo!=null?x.esfuerzo:x.orden||0);
    if (!resp || /^pendiente$/i.test(resp) || tipo==='hito' || esfuerzo<=0) return false;
    if (/complet|cerr|por validar|detenido/.test(estado) || x.finReal) return false;
    if (x.inicioPlan && fechaIso && x.inicioPlan>fechaIso) return false;
    // Si ya venció pero sigue abierta, continúa ocupando capacidad hasta cerrarse.
    return true;
  }

  function _aerOcupacionActualPorResponsable(filas) {
    const hoy=_aerTodayIso();
    const nombres=[...new Set((filas||[])
      .map(x=>String(x.responsable||'').trim())
      .filter(x=>x && !/^pendiente$/i.test(x))
    )];
    const map={};
    nombres.forEach(n=>map[n]={puntos:0,actividades:[]});
    (filas||[]).forEach(x=>{
      if(!_aerFilaConsumeCapacidad(x,hoy)) return;
      const n=String(x.responsable||'').trim();
      if(!map[n]) map[n]={puntos:0,actividades:[]};
      const e=Number(x.esfuerzo!=null?x.esfuerzo:x.orden||0);
      map[n].puntos+=e;
      map[n].actividades.push(x);
    });
    return map;
  }

  function _aerMaxCapacidadEnRango(responsable,inicio,fin,excluirUid='',puntosNuevo=0,estadoNuevo='En progreso',tipoNuevo='Actividad') {
    responsable=String(responsable||'').trim();
    if(!responsable || /^pendiente$/i.test(responsable)) return {max:0,actual:0};
    const hoy=_aerTodayIso();
    const filas=((aerDashboardData&&aerDashboardData.plan)||{}).filas||[];
    const eventos={};
    const addEvt=(d,v)=>{ if(!d) return; eventos[d]=(eventos[d]||0)+v; };
    const addOneDay=iso=>{
      const d=new Date(iso+'T12:00:00');
      d.setDate(d.getDate()+1);
      return d.toISOString().slice(0,10);
    };
    const normalizaRango=(x)=>{
      let ini=x.inicioPlan||hoy;
      let fin=x.finPlan||ini;
      // Una actividad abierta vencida sigue ocupando al menos hasta hoy.
      if(fin<hoy) fin=hoy;
      return [ini,fin];
    };

    filas.forEach(x=>{
      if(x.uid===excluirUid) return;
      if(String(x.responsable||'').trim()!==responsable) return;
      if(String(x.tipo||'').toLowerCase()==='hito') return;
      if(/complet|cerr|por validar|detenido/i.test(String(x.estado||'')) || x.finReal) return;
      const e=Number(x.esfuerzo!=null?x.esfuerzo:x.orden||0);
      if(e<=0) return;
      const [ini,fn]=normalizaRango(x);
      addEvt(ini,e);
      addEvt(addOneDay(fn),-e);
    });

    const nuevoActivo = !/complet|cerr|por validar|detenido/i.test(String(estadoNuevo||'')) &&
      String(tipoNuevo||'').toLowerCase()!=='hito' && Number(puntosNuevo||0)>0;

    if(nuevoActivo){
      let ini=inicio||hoy;
      let fn=fin||ini;
      if(fn<hoy && /en progreso/i.test(String(estadoNuevo||''))) fn=hoy;
      addEvt(ini,Number(puntosNuevo||0));
      addEvt(addOneDay(fn),-Number(puntosNuevo||0));
    }

    let cur=0,max=0,actual=0;
    Object.keys(eventos).sort().forEach(d=>{
      cur+=eventos[d];
      max=Math.max(max,cur);
      if(d<=hoy) actual=cur;
    });
    return {max,actual};
  }

  function _aerActualizarAdvertenciaCapacidadModal(uid='') {
    const box=document.getElementById('ap-cap-warning');
    if(!box) return;
    const responsable=_aerVal('ap-resp');
    const esfuerzo=Number(_aerVal('ap-ord')||0);
    const inicio=_aerVal('ap-ip');
    const fin=_aerVal('ap-fp');
    const estado=_aerVal('ap-est')||'Por iniciar';
    const tipo=_aerVal('ap-tipo')||'Actividad';
    const cap=_aerMaxCapacidadEnRango(responsable,inicio,fin,uid,esfuerzo,estado,tipo);

    if(!responsable || /^pendiente$/i.test(responsable) || tipo==='Hito' || esfuerzo<=0 || /complet|por validar|detenido/i.test(estado)){
      box.className='aer-cap-modal ok';
      box.innerHTML='<b>Capacidad:</b> esta asignación no consume capacidad activa.';
      return;
    }
    if(cap.max>6){
      box.className='aer-cap-modal bad';
      box.innerHTML=`<b>⚠ Sobreasignación:</b> ${_aerEsc(responsable)} alcanzaría <b>${cap.max}/6 puntos</b> en el periodo seleccionado. El recurso supera su capacidad.`;
    }else if(cap.max===6){
      box.className='aer-cap-modal warn';
      box.innerHTML=`<b>Ocupado al 100%:</b> ${_aerEsc(responsable)} llegará a <b>6/6 puntos</b>. No debería recibir otra actividad concurrente.`;
    }else{
      box.className='aer-cap-modal ok';
      box.innerHTML=`<b>Capacidad disponible:</b> máximo previsto <b>${cap.max}/6 puntos</b>.`;
    }
  }

    aerPlanTableFilters = { tipo:'', actividad:'', responsable:'', compromisoDesde:'', compromisoHasta:'', estado:'', cierreDesde:'', cierreHasta:'' };
    if (aerTabActual === 'planeacion') _aerRenderTab();

  function _aerNormFilter(v) {
    return String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }

  function aerAplicarFiltrosPlan() {
    const f = aerPlanTableFilters || {};
    const rows = [...document.querySelectorAll('#aer-plan-table-body tr[data-plan-row]')];
    let visibles = 0;

    rows.forEach(tr => {
      const d = tr.dataset || {};
      const okTipo = !f.tipo || d.tipo === f.tipo;
      const okActividad = !f.actividad || _aerNormFilter(d.actividad).includes(_aerNormFilter(f.actividad));
      const okResp = !f.responsable || d.responsable === f.responsable;
      const okEstado = !f.estado || d.estado === f.estado;

      const compromiso = d.compromiso || '';
      const okCompDesde = !f.compromisoDesde || (compromiso && compromiso >= f.compromisoDesde);
      const okCompHasta = !f.compromisoHasta || (compromiso && compromiso <= f.compromisoHasta);

      const cierre = d.cierre || '';
      const okCierreDesde = !f.cierreDesde || (cierre && cierre >= f.cierreDesde);
      const okCierreHasta = !f.cierreHasta || (cierre && cierre <= f.cierreHasta);

      const visible = okTipo && okActividad && okResp && okEstado && okCompDesde && okCompHasta && okCierreDesde && okCierreHasta;
      tr.style.display = visible ? '' : 'none';
      if (visible) visibles++;
    });

    const count = document.getElementById('aer-plan-filter-count');
    if (count) count.textContent = `${visibles} de ${rows.length}`;

    // El checkbox "Seleccionar todas" solo considera las filas visibles.
    const all = document.getElementById('aer-plan-select-all');
    if (all) {
      const visibleChecks = rows.filter(r => r.style.display !== 'none').map(r => r.querySelector('.aer-plan-row-check')).filter(Boolean);
      const selectedVisible = visibleChecks.filter(cb => cb.checked);
      all.checked = visibleChecks.length > 0 && selectedVisible.length === visibleChecks.length;
      all.indeterminate = selectedVisible.length > 0 && selectedVisible.length < visibleChecks.length;
    }
  }

  function aerAutoGuardarEstadoCierre(uid,origen) {
    const row=((aerDashboardData.plan||{}).filas||[]).find(r=>r.uid===uid);
    if (!row) return;
    const sel=document.getElementById(`apt-est-${uid}`);
    const cierreEl=document.getElementById(`apt-close-${uid}`);
    const estado=sel?sel.value:(row.estado||'Por iniciar');
    let cierre=cierreEl?cierreEl.value:(row.finReal||'');

    if (cierreEl) {
      if (estado === 'Completado') {
        cierreEl.disabled=false;
        if (!cierre) {
          cierre = row.finReal || _aerTodayIso();
          cierreEl.value = cierre;
        }
      } else {
        cierre='';
        cierreEl.value='';
        cierreEl.disabled=true;
      }
    }

    const state=document.getElementById(`apt-save-${uid}`);
    if (state) { state.textContent='Guardando…'; state.className='aer-autosave-state saving'; }
    if (sel) sel.disabled=true;
    if (cierreEl) cierreEl.disabled=true;

    google.script.run
      .withSuccessHandler(res=>{
        if (!res || !res.ok) {
          if (state) { state.textContent='Error'; state.className='aer-autosave-state error'; }
          if (sel) sel.disabled=false;
          if (cierreEl) cierreEl.disabled = estado !== 'Completado';
          showError(res&&res.error?res.error:'No se pudo guardar.');
          return;
        }
        if (res.plan) aerDashboardData.plan=res.plan;
        if (state) { state.textContent='Guardado ✓'; state.className='aer-autosave-state saved'; state.style.display='inline-block'; }
        // Solo vuelve a pintar Planeación; no consulta Clockify ni recarga el dashboard completo.

  function _aerNormalizarFechaImport(v) {
    const s=String(v||'').trim();
    if(!s) return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
    if(m) {
      const p=aerDashboardData&&aerDashboardData.proyecto||{};
      const ref=String(p.fechaInicio||p.fechaFin||'');
      const y=(ref.match(/^(\d{4})/)||[])[1] || String(new Date().getFullYear());
      return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    }
    return s;
  }

  function _aerParseDelimitedLine(line, delim) {
    if(delim==='ESPACIOS') return String(line||'').trim().split(/\s{2,}/);
    return String(line||'').split(delim);
  }

  function _aerParsePlanText(txt) {
    txt=String(txt||'').replace(/\u00a0/g,' ').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
    if(!txt) return {ok:false,error:'Pega o carga datos primero.',items:[]};
    const lines=txt.split('\n').map(x=>x.replace(/\s+$/,'')).filter(x=>x.trim());
    if(!lines.length) return {ok:false,error:'No se encontraron filas.',items:[]};

    const probe=lines.slice(0,Math.min(5,lines.length)).join('\n');
    let delim='';
    if(probe.includes('\t')) delim='\t';
    else if(lines[0].includes(';')) delim=';';
    else if(lines[0].includes(',')) delim=',';
    else if(/\s{2,}/.test(lines[0])) delim='ESPACIOS';
    else return {ok:false,error:'No pude detectar columnas. Pega directamente desde Excel/Sheets para conservar tabuladores.',items:[]};

    const cols=['Tipo','Actividad','Responsable','Inicio_Plan','Fin_Plan','Inicio_Real','Fin_Real','Avance','Estado','Dependencia','Notas'];
    const first=_aerParseDelimitedLine(lines[0],delim).map(x=>String(x||'').trim());
    const header=first.some(x=>/^(tipo|actividad|responsable|inicio_plan|fin_plan|avance|estado)$/i.test(x));
    const start=header?1:0;
    const items=[];
    const errores=[];

    lines.slice(start).forEach((line,idx)=>{
      const a=_aerParseDelimitedLine(line,delim);
      // Con TSV/CSV conservamos celdas vacías. Con espacios múltiples sólo
      // es un fallback y no puede reconstruir columnas vacías perfectamente.
      const o={Orden:idx+1};
      cols.forEach((c,j)=>o[c]=String(a[j]==null?'':a[j]).trim());
      if(!o.Actividad) { errores.push(`Fila ${idx+1+start}: sin Actividad`); return; }
      o.Tipo=o.Tipo||'Actividad';
      o.Inicio_Plan=_aerNormalizarFechaImport(o.Inicio_Plan);
      o.Fin_Plan=_aerNormalizarFechaImport(o.Fin_Plan);
      o.Inicio_Real=_aerNormalizarFechaImport(o.Inicio_Real);
      o.Fin_Real=_aerNormalizarFechaImport(o.Fin_Real);
      if(o.Avance==='') o.Avance='0';
      if(!o.Estado) o.Estado=Number(o.Avance||0)>=100?'Completado':'Pendiente';
      items.push(o);
    });

    if(!items.length) return {ok:false,error:'No pude construir ninguna actividad. Revisa que las columnas estén separadas por TAB, ; o ,.',items:[],errores};
    return {ok:true,items,errores,delim,header};
  }

  function aerPrevisualizarImportPlan() {
    const status=document.getElementById('aer-plan-import-status');
    if(!status) return;
    const parsed=_aerParsePlanText(_aerVal('aer-plan-text'));
    if(!parsed.ok) {
      status.style.color='#c3273e';
      status.textContent=parsed.error;
      return;
    }
    status.style.color='#16864e';
    status.textContent=`Listo: ${parsed.items.length} actividad(es) detectada(s)${parsed.errores.length?` · ${parsed.errores.length} fila(s) omitida(s)`:''}.`;
  }

  function aerImportarPlan() {
    try {
      const status=document.getElementById('aer-plan-import-status');
      const btn=document.getElementById('aer-plan-import-btn');
      const parsed=_aerParsePlanText(_aerVal('aer-plan-text'));
      if(!parsed.ok) {
        if(status){status.style.color='#c3273e';status.textContent=parsed.error;}
        return;
      }
      const id=aerDashboardData&&aerDashboardData.proyecto&&aerDashboardData.proyecto.id;
      if(!id) {
        if(status){status.style.color='#c3273e';status.textContent='No encuentro el proyecto seleccionado. Cierra y vuelve a abrir el proyecto.';}
        return;
      }

      if(btn){btn.disabled=true;btn.textContent='Importando…';}
      if(status){status.style.color='var(--gris)';status.textContent=`Enviando ${parsed.items.length} actividad(es)…`;}

      google.script.run
        .withSuccessHandler(r=>{
          const st=document.getElementById('aer-plan-import-status');
          const b=document.getElementById('aer-plan-import-btn');
          if(!r||!r.ok){
            if(b){b.disabled=false;b.textContent='Importar';}
            const msg=r&&r.error?r.error:'El servidor no confirmó la importación.';
            if(st){st.style.color='#c3273e';st.textContent='Error: '+msg;}
            else alert('Error: '+msg);
            return;
          }
          const msg=`Importación completa: ${r.guardados||0} guardado(s)`+
            `${r.nuevos!=null?` · ${r.nuevos} nuevo(s)`:''}`+
            `${r.actualizados!=null?` · ${r.actualizados} actualizado(s)`:''}`+
            `${r.duplicadosEliminados?` · ${r.duplicadosEliminados} duplicado(s) eliminado(s)`:''}.`;
          if(st){st.style.color='#16864e';st.textContent=msg;}
          setTimeout(()=>{aerCerrarModal();aerRecargarProyecto();},650);
        })
        .withFailureHandler(err=>{
          const st=document.getElementById('aer-plan-import-status');
          const b=document.getElementById('aer-plan-import-btn');
          if(b){b.disabled=false;b.textContent='Importar';}
          const msg=err&&err.message?err.message:String(err||'Error desconocido');
          if(st){st.style.color='#c3273e';st.textContent='Error del servidor: '+msg;}
          else alert('Error del servidor: '+msg);
          console.error('guardarLotePlaneacionAER:',err);
        })
        .guardarLotePlaneacionAER(id,parsed.items);
    } catch(err) {
      const status=document.getElementById('aer-plan-import-status');
      const btn=document.getElementById('aer-plan-import-btn');
      if(btn){btn.disabled=false;btn.textContent='Importar';}
      if(status){status.style.color='#c3273e';status.textContent='Error al preparar importación: '+(err&&err.message?err.message:err);}
      console.error('aerImportarPlan:',err);
    }
  }

  function _ixsDate(d){

  function _ixsFases(data){
    const hist=Array.isArray(data.historialCompleto)?data.historialCompleto:[];
    const byName=new Map();
    hist.filter(x=>x&&x.fechaInicio).forEach(h=>{
      const key=String(h.fase||'').trim().toLowerCase();if(!key)return;
      if(!byName.has(key))byName.set(key,{name:h.fase,start:h.fechaInicio,end:h.fechaFin||h.fechaInicio,active:!!h.enCurso});
      else {const r=byName.get(key);if(_ixsDateMs(h.fechaInicio)<_ixsDateMs(r.start))r.start=h.fechaInicio;
        if(_ixsDateMs(h.fechaFin||h.fechaInicio)>_ixsDateMs(r.end))r.end=h.fechaFin||h.fechaInicio;
        if(h.enCurso)r.active=true;}
    });
    return Array.from(byName.values()).sort((a,b)=>_ixsDateMs(a.start)-_ixsDateMs(b.start));
  }
  function _ixsEtapaActual(data){
    const fases=_ixsFases(data||{});
    const susp=Array.isArray((data||{}).suspensiones)?data.suspensiones:[];
    const hoy=new Date(); hoy.setHours(0,0,0,0);
    const hoyMs=hoy.getTime();
    const inRange=(ms,a,b)=>Number.isFinite(ms)&&Number.isFinite(a)&&Number.isFinite(b)&&ms>=Math.min(a,b)&&ms<=Math.max(a,b);
    const suspActiva=susp.some(s=>{
      const ini=_ixsDateMs(s.fechaInicio), fin=_ixsDateMs(s.fechaFin||s.fechaInicio);
      return inRange(hoyMs,ini,fin);
    });
    if(suspActiva) return {texto:'Suspendido', clase:'orange'};

    const activa=fases.find(f=>{
      const ini=_ixsDateMs(f.start), fin=_ixsDateMs(f.end||f.start);
      return !!f.active || inRange(hoyMs,ini,fin);
    });
    if(activa) return {texto:_ixsTxt(activa.name||'En progreso'), clase:''};

    const futuras=(data&&Array.isArray(data.hitos)?data.hitos:[])
      .filter(h=>Number.isFinite(_ixsDateMs(h.fechaInicioPlan)) && _ixsDateMs(h.fechaInicioPlan)>=hoyMs)
      .sort((a,b)=>_ixsDateMs(a.fechaInicioPlan)-_ixsDateMs(b.fechaInicioPlan));
    if(futuras.length) return {texto:_ixsTxt(futuras[0].nombre||'Pendiente'), clase:''};

    if(fases.length){
      const ultima=fases.slice().sort((a,b)=>{
        const af=_ixsDateMs(a.end||a.start), bf=_ixsDateMs(b.end||b.start);
        return (Number.isFinite(bf)?bf:-Infinity)-(Number.isFinite(af)?af:-Infinity);
      })[0];
      return {texto:_ixsTxt(ultima.name||'Sin etapa'), clase:''};
    }

    return {texto:'Sin etapa', clase:''};
  }
  /* V75: fases + eventos adicionales (demo, QA y los demás hitos guardados). */
  function _ixsHitos(data){
    const hist=_ixsFases(data);
    const hoy=new Date();hoy.setHours(0,0,0,0);
    const hoyMs=hoy.getTime();
    const principales=(data.hitos||[]).map(h=>{
      const match=hist.find(x=>String(x.name||'').toLowerCase()===String(h.nombre||'').toLowerCase());
      const fin=match?(match.active?null:match.end):h.fechaFinPlan;
      return {name:h.nombre||'Fase',start:match?match.start:h.fechaInicioPlan,
        finish:fin||h.fechaFinPlan||h.fechaInicioPlan,
        state:match?(match.active?'En curso':_ixsDateMs(match.end)<hoyMs?'Completado':'En curso'):'Pendiente',extra:false};
    });
    const extras=(data.hitosAdicionales||[]).map(h=>{
      const cat=categoriaHito(h.tipo);
      const when=_ixsDateMs(h.fecha);
      return {name:nombreLimpioHito(h.tipo)||cat.etiqueta||'Hito',start:h.fecha,finish:h.fecha,
        state:Number.isFinite(when)&&when<hoyMs?'Completado':'Pendiente',extra:true,
        icon:cat.icono||'📌',group:cat.etiqueta||'Hitos adicionales',uid:h.indice,
        notes:h.observacion||''};
    });
    return principales.concat(extras).sort((a,b)=>{
      const am=_ixsDateMs(a.start),bm=_ixsDateMs(b.start);
      return (Number.isFinite(am)?am:Infinity)-(Number.isFinite(bm)?bm:Infinity);
    });
  }
  function _ixsFechaSalidaPRD(data){
    const isDeployment=x=>/^deployment(?:\s+(?:est|s\d+))?$/i.test(String(x||'').trim());
    const history=(data.historialCompleto||[]).filter(h=>isDeployment(h.fase)&&h.fechaFin);
    const plans=(data.hitos||[]).filter(h=>isDeployment(h.nombre)&&h.fechaFinPlan);
    const latest=(items,key)=>items.sort((a,b)=>_ixsDateMs(b[key])-_ixsDateMs(a[key]))[0];
    return (latest(history,'fechaFin')||{}).fechaFin||(latest(plans,'fechaFinPlan')||{}).fechaFinPlan||'';
  }

  function _ixsGantt(data){
    const plan=(data.hitos||[]).filter(x=>x.fechaInicioPlan&&x.fechaFinPlan)
      .map(x=>({name:x.nombre+' EST',from:x.fechaInicioPlan,to:x.fechaFinPlan,type:'plan'}));
    const real=_ixsFases(data).map(x=>({name:x.name,from:x.start,to:x.active?new Date():x.end,type:'real',active:x.active,markers:[]}));
    const holds=(data.suspensiones||[]).filter(x=>x.fechaInicio)
      .map(x=>({name:'Suspendido',from:x.fechaInicio,to:x.fechaFin||new Date(),type:'hold'}));
    const markers=(data.hitosAdicionales||[]).map(h=>{
      const time=_ixsDateMs(h.fecha);
      if(!Number.isFinite(time))return null;
      const cat=categoriaHito(h.tipo);
      return {time:time,icon:cat.icono||'📌',cls:['demo','qa','prod','uat'].includes(cat.clave)?cat.clave:'other',
        label:nombreLimpioHito(h.tipo)||cat.etiqueta||'Evento',group:cat.etiqueta||'Otros',date:h.fecha};
    }).filter(Boolean);
    const rows=plan.concat(real,holds);
    const times=rows.flatMap(x=>[_ixsDateMs(x.from),_ixsDateMs(x.to)]).concat(markers.map(x=>x.time)).filter(Number.isFinite);
    if(!times.length)return '<div class="ixs-empty">Sin fases disponibles en Historico_Proyectos.</div>';
    const now=Date.now();times.push(now);
    const day=864e5,min=Math.min(...times)-day*3,max=Math.max(...times)+day*3,range=Math.max(day,max-min);
    const pos=date=>( (_ixsDateMs(date)-min)/range*100 );
    const fmt=d=>_ixsDate(d);
    // Cada evento se asigna a la etapa real que contiene su fecha; de no
    // coincidir con ninguna etapa, a la barra real más cercana por intervalo.
    markers.forEach(m=>{
      let chosen=null,dist=Infinity;
      real.forEach(r=>{
        const a=_ixsDateMs(r.from),b=r.active?now:_ixsDateMs(r.to);
        if(!Number.isFinite(a)||!Number.isFinite(b))return;
        const lo=Math.min(a,b),hi=Math.max(a,b);
        const distance=m.time<lo?lo-m.time:m.time>hi?m.time-hi:0;
        if(distance<dist){dist=distance;chosen=r;}
      });
      if(chosen)chosen.markers.push(m);
    });
    // Cuando no existe una fase real, mantener visibles los hitos en una fila.
    const loneMarkers=real.length?[]:markers;
    const row=x=>{
      const l=_ixsLimit(pos(x.from)),r=_ixsLimit(pos(x.to));
      const grouped={};
      (x.markers||[]).forEach(m=>{const k=String(m.time);(grouped[k]||(grouped[k]=[])).push(m);});
      const markerHtml=(x.markers||[]).map(m=>{
        const same=grouped[String(m.time)],index=same.indexOf(m);
        const offset=(index-(same.length-1)/2)*14;
        const pct=_ixsLimit(pos(m.time));
        const title=_ixsTxt(m.label+' · '+fmt(m.date));
        return `<span class="ixs-time-mark ${m.cls}" style="left:clamp(10px,calc(${pct}% + ${offset}px),calc(100% - 10px))" title="${title}" aria-label="${title}">${_ixsTxt(m.icon)}</span>`;
      }).join('');
      const width=Math.max(.6,r-l);
      return `<div class="ixs-time-row"><div class="ixs-time-label">${_ixsTxt(x.name)}${x.active?' <span class="ixs-badge">En curso</span>':''}<small>${fmt(x.from)} → ${fmt(x.to)}</small></div>
        <div class="ixs-time-track"><i class="ixs-time-bar ${x.type==='plan'?'':x.type}" style="left:${l}%;width:${width}%"></i>${markerHtml}</div></div>`;
    };
    // Meses centrados en el intervalo VISIBLE, no al inicio de mes anterior.
    // Si un fragmento del mes es demasiado corto, no se imprime para evitar
    // dos etiquetas encima de la misma coordenada (juljul26).
    const monthLabels=[];
    const first=new Date(min),end=new Date(max);
    for(let d=new Date(first.getFullYear(),first.getMonth(),1),n=0;d<=end&&n<30;d=new Date(d.getFullYear(),d.getMonth()+1,1),n++){
      const next=new Date(d.getFullYear(),d.getMonth()+1,1);
      const a=Math.max(min,d.getTime()),b=Math.min(max,next.getTime());
      if(b<=a||((b-a)/range)*100<10)continue;
      const mid=((a+b)/2-min)/range*100;
      const label=d.toLocaleDateString('es-MX',{month:'short',year:'2-digit'}).replace(/\./g,'');
      monthLabels.push(`<span class="ixs-month-label" style="left:${_ixsLimit(mid)}%">${_ixsTxt(label)}</span>`);
    }
    const seen=new Set(),legend=[];
    markers.forEach(m=>{const key=m.group+'|'+m.icon;if(seen.has(key))return;seen.add(key);
      legend.push(`<span class="ixs-time-eventlegend"><span class="ixs-time-chip">${_ixsTxt(m.icon)}</span>${_ixsTxt(m.group)}</span>`);
    });
    const hoyPct=_ixsLimit(pos(new Date()));
    return `<div class="ixs-timeline"><div class="ixs-timeline-core">
      <div class="ixs-time-head"><span></span><div class="ixs-time-months" style="position:relative;height:22px">${monthLabels.join('')}</div></div>
      <i class="ixs-time-today-full" style="left:calc(171px + (100% - 171px) * ${hoyPct/100})"></i>
      ${plan.length?'<div class="ixs-time-section">Plan estimado (línea base)</div>'+plan.map(row).join(''):''}
      ${real.length?'<div class="ixs-time-section">Ejecución real</div>'+real.map(row).join(''):''}
      ${holds.length?'<div class="ixs-time-section">Suspensiones</div>'+holds.map(row).join(''):''}
      ${loneMarkers.length?'<div class="ixs-time-section">Hitos adicionales</div>'+row({name:'Eventos registrados',from:new Date(min),to:new Date(max),type:'events',markers:loneMarkers}):''}
      <div class="ixs-legend"><span><i style="background:#cbd0dd"></i>Planeación</span><span><i style="background:#5c31d5"></i>Ejecución</span><span><i style="background:#edae1d"></i>Suspendido</span>${legend.join('')}<span class="ixs-time-today-tag">┆ Hoy</span></div>
    </div></div>`;
  }

  function _ixsRecursoClave(v){return String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').toLowerCase();}
  function ixsCargarRecursos(){
    const id=ixsProyectoActual&&ixsProyectoActual.proyecto&&ixsProyectoActual.proyecto.id;if(!id)return;
    const st=ixsRecursosState,token=++st.requestId;
    st.proyectoId=id;st.cargando=true;st.error='';st.registros=[];_ixsPintarRecursos();
    google.script.run.withSuccessHandler(r=>{
      if(st.requestId!==token||st.proyectoId!==id)return;
      if(!r||!r.ok){st.error=r&&r.error||'No se pudieron consultar las asignaciones.';st.cargando=false;_ixsPintarRecursos();return;}
      st.filas=r.filas||[];_ixsPintarRecursos();
      google.script.run.withSuccessHandler(c=>{
        if(st.requestId!==token||st.proyectoId!==id)return;
        st.registros=c&&c.ok&&Array.isArray(c.registros)?c.registros:[];
        if(!c||!c.ok)st.error='Clockify: '+(c&&c.error||'No se pudieron consultar las horas.');
        st.cargando=false;_ixsPintarRecursos();
      }).withFailureHandler(e=>{if(st.requestId!==token)return;st.error='Clockify: '+(e&&e.message||e);st.cargando=false;_ixsPintarRecursos();}).getRegistrosClockifyProyecto(id);
    }).withFailureHandler(e=>{if(st.requestId!==token)return;st.error=e&&e.message||String(e);st.cargando=false;_ixsPintarRecursos();}).ixsRecursosLeer(id);
  }
  function _ixsPintarRecursos(){
    const box=document.getElementById('ixs-tab-contenido'),st=ixsRecursosState,d=ixsProyectoActual;
    if(!box||ixsTabActual!=='recursos'||!d||d.proyecto.id!==st.proyectoId)return;
    const base=(d.filasRecursosCompleto||[]).filter(x=>x.nombre),map=new Map();
    base.forEach(x=>{const key=_ixsRecursoClave(x.nombre);if(key&&!map.has(key))map.set(key,{nombre:x.nombre,rol:x.posicion||'',horasEstimadas:Number(x.horasEstimadas)||0,activo:true});});
    st.filas.forEach(x=>{const key=_ixsRecursoClave(x.nombre);if(key)map.set(key,Object.assign({},map.get(key)||{},x));});
    const hours=new Map();st.registros.forEach(r=>{const key=_ixsRecursoClave(r.recurso),n=Number(r.duracion);if(!key||!Number.isFinite(n))return;const prev=hours.get(key)||{nombre:r.recurso,horas:0};prev.horas+=n;hours.set(key,prev);});
    const rows=[...map].sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre,'es'));
    const missing=[...hours].filter(([key,x])=>x.horas>0&&!map.has(key));
    const inactive=rows.filter(([key,x])=>!x.activo&&(hours.get(key)||{}).horas>0);
    box.innerHTML=`<section class="ixs-card" style="padding:22px"><div class="ixs-section-head"><div><h3>${_ixsIcon('people')} Recursos del proyecto ${_ixsTxt(st.proyectoId)}</h3><small>Asignación, rol, horas estimadas y horas registradas en Clockify para este ID</small></div><button class="ixs-btn primary" onclick="ixsAbrirEditorRecurso()">+ Agregar recurso</button></div>
      ${st.cargando?'<div class="ixs-empty">Consultando asignaciones y Clockify…</div>':''}${st.error?`<div class="ixs-empty" style="color:#a32340">${_ixsTxt(st.error)}</div>`:''}
      ${missing.length?`<div class="ixs-resource-alert"><b>⚠ ${missing.length} recurso(s) con horas en Clockify sin asignación</b>${missing.map(([key,x])=>`<div>${_ixsTxt(x.nombre)} · ${_ixsNum(x.horas,2)} h <button class="ixs-btn" onclick="ixsAbrirEditorRecurso('${encodeURIComponent(x.nombre).replace(/'/g,'%27')}')">Asignar</button></div>`).join('')}</div>`:''}
      ${inactive.length?`<div class="ixs-resource-alert"><b>⚠ ${inactive.length} recurso(s) inactivo(s) con horas registradas en el ID</b></div>`:''}
      <div class="ixs-table-scroll"><table class="ixs-table"><thead><tr><th>Recurso</th><th>Rol</th><th>Horas estimadas</th><th>Horas en el ID</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${rows.map(([key,x])=>`<tr><td><b>${_ixsTxt(x.nombre)}</b></td><td>${_ixsTxt(x.rol)||'—'}</td><td>${_ixsNum(x.horasEstimadas,2)} h</td><td>${st.cargando?'…':st.error?'—':_ixsNum((hours.get(key)||{}).horas||0,2)+' h'}</td><td><span class="ixs-badge ${x.activo?'green':'orange'}">${x.activo?'Activo':'Inactivo'}</span></td><td><button class="ixs-btn" onclick="ixsAbrirEditorRecurso('${encodeURIComponent(x.nombre).replace(/'/g,'%27')}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6">Sin recursos asignados. Agrega el primero para este proyecto.</td></tr>'}</tbody></table></div>
      <small>Las horas de Clockify se suman para todos los registros devueltos de este ID de proyecto. Los cambios de rol, estimación y estado se guardan por proyecto.</small></section>`;
  }
  function ixsAbrirEditorRecurso(encoded){

  function ixsGuardarRecurso(e){
    e.preventDefault();const st=ixsRecursosState,form=e.target,btn=form.querySelector('[type=submit]');if(st.saving)return;
    const payload={idProyecto:st.proyectoId,nombre:form.elements.nombre.value,rol:form.elements.rol.value,horasEstimadas:form.elements.horas.value,activo:form.elements.activo.value==='true'};

  }
  function _ixsMiniHours(rows){
    const data=(rows||[]).slice().sort((a,b)=>Number(b.horasReales||0)-Number(a.horasReales||0));

  }
