<template id="tpl-horas">
  <div class="view-header">
    <div class="view-title">DETALLE DE <span class="accent">HORAS</span></div>
    <div class="filters">
      <button class="btn btn-modo active" id="btn-modo-resumen">📊 Resumen</button>
      <button class="btn btn-modo" id="btn-modo-proyecto">📁 Por Proyecto</button>
      <button class="btn btn-modo" id="btn-modo-persona">👤 Por Persona</button>
      <button class="btn btn-modo" id="btn-modo-capacidad">📈 Capacidad Instalada</button>
    </div>
  </div>

  <div id="horas-resumen-panel">
    <div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr);">
      <div class="kpi-card">
        <div class="kpi-label">⏱ Total de Horas Invertidas</div>
        <div class="kpi-value" id="kpi-resumen-horas">-</div>
        <div class="kpi-sub" id="kpi-resumen-horas-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">📅 Días Trabajados</div>
        <div class="kpi-value" id="kpi-resumen-dias">-</div>
        <div class="kpi-sub" id="kpi-resumen-dias-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">📋 Actividades Registradas</div>
        <div class="kpi-value" id="kpi-resumen-actividades">-</div>
        <div class="kpi-sub" id="kpi-resumen-actividades-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" style="color:var(--rojo);">⏰ Horas Fuera de Horario</div>
        <div class="kpi-value" id="kpi-resumen-fuera-horario" style="color:var(--rojo);">-</div>
        <div class="kpi-sub" id="kpi-resumen-fuera-horario-sub" style="color:var(--rojo);"></div>
      </div>
    </div>

    <div class="resumen-grid-top" style="grid-template-columns: 1fr 1.3fr; align-items:start;">
      <div class="card">
        <h3>⏰ RESUMEN DE HORARIOS</h3>
        <div id="donut-resumen-horarios"></div>
        <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
          <div style="font-size:11px; font-weight:700; color:var(--gris); letter-spacing:.4px; margin-bottom:6px;">TOP 5 RECURSOS CON MÁS HORAS FUERA DE HORARIO</div>
          <div id="top5-fuera-horario"></div>
        </div>
      </div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">🕐 HORAS FUERA DE HORARIO (DETALLE)</h3>
        </div>
        <table class="data-table" id="tabla-fuera-horario-detalle">
          <thead><tr><th>Fecha</th><th>Recurso</th><th>Horas</th><th>Descripción</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="tabla-fuera-horario-ocultos" style="display:none;"></div>
        <div style="text-align:center; margin-top:8px;">
          <a href="#" id="toggle-fuera-horario-detalle" style="font-size:12px; color:var(--vino); text-decoration:none; display:none;">Ver todas</a>
        </div>
      </div>
    </div>

    <div class="resumen-grid-top" style="grid-template-columns: 1.6fr 1fr; align-items:stretch;">
      <div class="card">
        <h3>HORAS POR DÍA</h3>
        <div id="grafica-horas-dia" style="overflow-x:auto;"></div>
      </div>
      <div class="card">
        <h3>DISTRIBUCIÓN DE HORAS</h3>
        <div id="donut-categorias-resumen"></div>
      </div>
    </div>

    <div class="resumen-grid-top" style="grid-template-columns: 1.6fr 1fr; align-items:start;">
      <div class="card">
        <h3>DETALLE POR RECURSO</h3>
        <div style="overflow-x:auto;">
          <table class="data-table" id="tabla-detalle-recurso-resumen">
            <thead>
              <tr><th>Recurso</th><th>Horas en Horario</th><th>Horas Fuera de Horario</th><th>Días Trabajados</th><th>Estado</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="card">
          <h3>RESUMEN POR PROYECTO</h3>
          <div id="lista-resumen-proyecto"></div>
        </div>
        <div class="card" style="background:#FAFAFB;">
          <h3 style="font-size:12.5px;">ℹ️ NOTAS</h3>
          <ul style="font-size:11px; color:var(--gris); margin:0; padding-left:18px; line-height:1.6;">
            <li>Las horas fuera de horario se consideran cuando el registro inicia fuera del rango laboral configurado.</li>
            <li>El detalle por recurso agrupa todas las horas registradas por esa persona en todos sus proyectos.</li>
            <li>Los porcentajes pueden variar por redondeo.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div id="horas-proyecto-panel" style="display:none;">
    <div class="filters" style="margin-bottom:14px;">
      <select class="filter" id="f-proyecto-horas"></select>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-size:11px; color:var(--gris); text-transform:uppercase; letter-spacing:.4px;" id="proy-cliente">Cliente</div>
          <div style="font-size:18px; font-weight:700; color:var(--gris-oscuro);" id="proy-nombre">Proyecto</div>
        </div>
        <div style="text-align:right; font-size:12px; color:var(--gris);">
          <span id="proy-estado" class="badge badge-activo"></span>
          <div style="margin-top:6px;" id="proy-fechas"></div>
        </div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Recursos Asignados</div>
        <div class="kpi-value" id="kpi-proy-recursos">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Horas Estimadas</div>
        <div class="kpi-value" id="kpi-horas-totales">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Horas Reales</div>
        <div class="kpi-value" id="kpi-proy-reales">-</div>
      </div>
      <div class="kpi-card destacada">
        <div class="kpi-label">% Horas Usadas</div>
        <div class="kpi-value" id="kpi-proy-pct-horas">-</div>
        <div class="kpi-sub" id="kpi-proy-balance-sub"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
        <h3 style="margin:0;">CARGA DE TRABAJO POR RECURSO</h3>
        <span id="rango-clockify-proyecto" style="font-size:11px; color:var(--gris);"></span>
      </div>
      <table class="data-table" id="tabla-horas-proyecto">
        <thead>
          <tr><th>Rol</th><th>Recurso</th><th>Banda</th><th>Costing Rate</th><th>Hrs Estimadas</th><th>Hrs Reales</th><th>Hrs No FACT</th><th>Balance</th><th>% Cumpl.</th><th>Costo Real</th><th>Estado</th></tr>
        </thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>

    <div class="resumen-grid-top">
      <div class="card">
        <h3>HORAS POR RECURSO — ESTIMADAS VS REALES</h3>
        <div id="comparativo-recurso"></div>
      </div>
      <div class="card">
        <h3>DISTRIBUCIÓN DE HORAS REALES</h3>
        <div id="donut-categoria-proyecto"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <h3>HORAS POR ROL — ESTIMADAS VS REALES</h3>
      <div id="comparativo-rol"></div>
    </div>

    <div class="card">
      <h3>INSIGHTS DEL PROYECTO</h3>
      <div id="insights-proyecto"></div>
    </div>
  </div>

  <div id="horas-persona-panel" style="display:none;">
    <div class="filters" style="margin-bottom:14px; flex-wrap:wrap;">
      <select class="filter" id="f-persona-horas"></select>
      <select class="filter" id="f-proyecto-filtro-persona">
        <option value="">Todos los proyectos</option>
      </select>
      <select class="filter" id="f-agrupacion-horas">
        <option value="dia">Por Día</option>
        <option value="semana">Por Semana</option>
        <option value="mes">Por Mes</option>
      </select>
      <div style="position:relative;">
        <button class="btn" id="btn-rango-fechas-persona" style="min-width:220px; text-align:left;">📅 <span id="etiqueta-rango-persona">Todo el histórico</span></button>
        <div id="panel-rango-fechas-persona" style="display:none; position:absolute; top:38px; left:0; z-index:50; background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.12); padding:12px; width:480px;">
          <div style="display:flex; gap:16px;">
            <div style="min-width:130px; display:flex; flex-direction:column; gap:2px; border-right:1px solid var(--border); padding-right:12px;">
              <a href="#" class="preset-rango-fecha" data-preset="hoy" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Hoy</a>
              <a href="#" class="preset-rango-fecha" data-preset="ayer" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Ayer</a>
              <a href="#" class="preset-rango-fecha" data-preset="estaSemana" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Esta semana</a>
              <a href="#" class="preset-rango-fecha" data-preset="semanaPasada" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Semana pasada</a>
              <a href="#" class="preset-rango-fecha" data-preset="ultimas2semanas" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Últimas 2 semanas</a>
              <a href="#" class="preset-rango-fecha" data-preset="esteMes" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Este mes</a>
              <a href="#" class="preset-rango-fecha" data-preset="mesPasado" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Mes pasado</a>
              <a href="#" class="preset-rango-fecha" data-preset="esteAnio" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Este año</a>
              <a href="#" class="preset-rango-fecha" data-preset="anioPasado" style="padding:6px 4px; font-size:12.5px; color:var(--gris-oscuro); text-decoration:none;">Año pasado</a>
              <a href="#" class="preset-rango-fecha" data-preset="todo" style="padding:6px 4px; font-size:12.5px; color:var(--vino); font-weight:600; text-decoration:none;">Todo el histórico</a>
            </div>
            <div style="flex:1;">
              <div style="font-size:11px; color:var(--gris); margin-bottom:6px;">Rango personalizado</div>
              <label style="font-size:11px; color:var(--gris-oscuro);">Desde</label>
              <input type="date" id="input-fecha-desde-persona" style="width:100%; padding:6px 8px; margin:2px 0 10px; border:1px solid var(--border); border-radius:6px; font-size:12px;">
              <label style="font-size:11px; color:var(--gris-oscuro);">Hasta</label>
              <input type="date" id="input-fecha-hasta-persona" style="width:100%; padding:6px 8px; margin:2px 0 12px; border:1px solid var(--border); border-radius:6px; font-size:12px;">
              <button class="btn btn-primary" id="btn-aplicar-rango-persona" style="width:100%;">Aplicar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px; display:flex; align-items:center; gap:14px;">
      <div id="persona-avatar" style="width:50px;height:50px;border-radius:50%;background:var(--vino);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;"></div>
      <div>
        <div style="font-size:17px;font-weight:700;color:var(--gris-oscuro);" id="persona-nombre-header"></div>
        <div style="font-size:12px;color:var(--gris);" id="persona-rol-header"></div>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr);">
      <div class="kpi-card">
        <div class="kpi-label">⏱ Total de Horas Trabajadas</div>
        <div class="kpi-value" id="kpi-horas-persona">-</div>
        <div class="kpi-sub" id="kpi-horas-persona-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" style="color:var(--verde);">✅ Horas Facturables</div>
        <div class="kpi-value" id="kpi-persona-facturables" style="color:var(--verde);">-</div>
        <div class="kpi-sub" id="kpi-persona-facturables-sub"></div>
        <div class="barra-track" style="height:6px;margin-top:6px;"><div class="barra-fill" id="barra-persona-facturables" style="background:var(--verde);"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" style="color:#4A2A94;">📋 Horas No Facturables</div>
        <div class="kpi-value" id="kpi-persona-nofacturables" style="color:#4A2A94;">-</div>
        <div class="kpi-sub" id="kpi-persona-nofacturables-sub"></div>
        <div class="barra-track" style="height:6px;margin-top:6px;"><div class="barra-fill" id="barra-persona-nofacturables" style="background:#4A2A94;"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" style="color:var(--rojo);">⚠ Horas Fuera de Horario</div>
        <div class="kpi-value" id="kpi-persona-fuerahorario" style="color:var(--rojo);">-</div>
        <div class="kpi-sub" id="kpi-persona-fuerahorario-sub"></div>
        <div class="barra-track" style="height:6px;margin-top:6px;"><div class="barra-fill" id="barra-persona-fuerahorario" style="background:var(--rojo);"></div></div>
      </div>
    </div>

    <div class="resumen-grid-top" style="grid-template-columns: 1.6fr 1fr; align-items:stretch;">
      <div class="card">
        <h3>HORAS POR PROYECTO</h3>
        <div id="grafica-horas-proyecto-persona" style="overflow-x:auto;"></div>
      </div>
      <div class="card">
        <h3>DISTRIBUCIÓN DE HORAS</h3>
        <div id="donut-estado-persona"></div>
      </div>
    </div>

    <div class="resumen-grid-top" style="grid-template-columns: 1.6fr 1fr; align-items:start;">
      <div class="card">
        <h3>REGISTROS DE <span id="persona-nombre-tabla"></span></h3>
        <div style="overflow-x:auto;">
          <table class="data-table" id="tabla-registros-persona">
            <thead>
              <tr><th>Fecha</th><th>Proyecto</th><th>Descripción</th><th>Inicio</th><th>Fin</th><th>Duración</th><th>Estado</th><th>Alerta</th><th>Facturable</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="card">
          <h3>HORAS POR ESTADO</h3>
          <div id="lista-estado-persona"></div>
        </div>
        <div class="card">
          <h3>PROYECTOS PRINCIPALES</h3>
          <div id="lista-proyectos-persona"></div>
        </div>
        <div class="card">
          <h3>🔔 ALERTAS</h3>
          <div id="lista-alertas-persona"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="horas-capacidad-panel" style="display:none;">
    <div style="font-size:12px; color:var(--gris); margin-bottom:12px;">
      Cada persona con un bloque por cada proyecto asignado: Id, Asignación, Horas, DH Modelo (días hábiles restantes), Etapa, Inicio y Fin.
    </div>
    <div style="display:flex; gap:16px; margin-bottom:14px; font-size:11.5px; color:var(--gris-oscuro);">
      <span><span style="display:inline-block;width:11px;height:11px;background:var(--verde);border-radius:3px;margin-right:5px;vertical-align:middle;"></span>Más de 20 días hábiles</span>
      <span><span style="display:inline-block;width:11px;height:11px;background:var(--amarillo);border-radius:3px;margin-right:5px;vertical-align:middle;"></span>Entre 10 y 20 días hábiles</span>
      <span><span style="display:inline-block;width:11px;height:11px;background:var(--rojo);border-radius:3px;margin-right:5px;vertical-align:middle;"></span>Menos de 10 días hábiles</span>
      <span><span style="display:inline-block;width:11px;height:11px;background:#E8E8E8;border-radius:3px;margin-right:5px;vertical-align:middle;"></span>Sin fecha Fin</span>
    </div>
    <div id="capacidad-loading" class="loading">Cargando capacidad instalada...</div>
    <div class="card" id="capacidad-tabla-contenedor" style="display:none; overflow-x:auto; max-height:75vh; overflow-y:auto; padding:0;">
      <table class="data-table capacidad-tabla">
        <thead>
          <tr id="capacidad-header-row1"></tr>
          <tr id="capacidad-header-row2"></tr>
        </thead>
        <tbody id="capacidad-body"></tbody>
      </table>
    </div>
  </div>
</template>
