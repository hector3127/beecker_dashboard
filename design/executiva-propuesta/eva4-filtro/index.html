.eva4-page{max-width:1680px;margin:auto;padding:20px 28px}.eva4-banner{background:linear-gradient(110deg,#603aff,#ab28ed,#ff3ba1);color:white;border-radius:18px;padding:24px;margin:16px 0}.eva4-banner h1{margin:0;font-size:36px}.eva4-banner p{margin:6px 0 0}.eva4-tables{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.eva4-card{background:white;border:1px solid #e4e0fa;border-radius:14px;padding:20px;margin-bottom:16px}.eva4-card h2{color:#1b1a9e;font-size:20px;margin:0 0 8px}.eva4-note{color:#60598c;font-size:13px;margin:8px 0 16px}.eva4-scroll{overflow:auto;max-height:650px}table.eva4{width:100%;border-collapse:collapse;font-size:12px}table.eva4 th{background:#efebfc;color:#352283;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:1}table.eva4 td,table.eva4 th{padding:10px;border-bottom:1px solid #efedf9}table.eva4 tr:nth-child(even){background:#faf9ff}table.eva4 .n{text-align:right;font-variant-numeric:tabular-nums}table.eva4 .total{background:#eee9ff;font-weight:800}.eva4-pill{padding:4px 8px;border-radius:14px;display:inline-block;white-space:nowrap}.ok,.active{background:#dcf7e9;color:#158053}.warning{background:#fff1d4;color:#9a6300}.critical,.suspended{background:#ffe2eb;color:#b1264d}.eva4-detail{min-width:1650px}.eva4-detail td{max-width:280px}.eva4-kpis{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.eva4-kpis span{background:#f1edff;padding:10px 16px;border-radius:10px}.eva4-filter{font:inherit;width:min(360px,100%);box-sizing:border-box;padding:10px;border:1px solid #dcd5f4;border-radius:9px;margin-bottom:14px}@media(max-width:1050px){.eva4-tables{grid-template-columns:1fr}.eva4-page{padding:16px}}
.eva4-banner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eva4-banner-title{flex:1 1 360px;min-width:0}
.eva4-month-form{display:flex;align-items:flex-end;gap:12px;padding:14px 16px;border:1px solid #ffffff80;border-radius:14px;background:#ffffffed;color:#241568;box-sizing:border-box;max-width:100%;margin:0}
.eva4-month-field{display:grid;gap:7px;min-width:0}
.eva4-month-field label{font-size:12px;font-weight:600;color:#514581}
.eva4-month-field input{font:inherit;font-size:16px;font-weight:700;color:#241568;background:#fff;border:1px solid #dfd5fa;border-radius:9px;padding:9px 11px;min-height:44px;box-sizing:border-box;min-width:0;width:190px;max-width:100%;color-scheme:light}
.eva4-month-form button{font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:10px 16px;border:1px solid #5827dc;border-radius:9px;background:#5827dc;color:#fff;cursor:pointer;white-space:nowrap}
.eva4-month-form button:hover{background:#4520b1}
.eva4-month-form :focus-visible{outline:3px solid #b49aef;outline-offset:3px}
@media(max-width:800px){.eva4-banner-title{flex-basis:100%}.eva4-month-form{width:100%}.eva4-month-field{flex:1}.eva4-month-field input{width:100%}}
@media(max-width:450px){.eva4-banner{padding:20px 16px;gap:18px}.eva4-banner h1{font-size:28px}.eva4-banner p{line-height:1.6;font-size:14px}.eva4-month-form{padding:12px;flex-direction:column;align-items:stretch}.eva4-month-form button{width:100%}}

.ej{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:#FFF3D6;color:#8A5600;font-size:11.5px;font-weight:700;vertical-align:middle;letter-spacing:.02em}
.nd{margin:4px 0 0 4px;font-size:12px;color:#5B5E95}
.err{margin:0 0 12px;padding:12px 18px;border-radius:12px;background:#FBE3E7;color:#A31B33;font-size:14.5px;font-weight:600}
.vacio{padding:26px;text-align:center;color:#4A4D86;font-size:15px}
.nav a.old{color:#7A7798;font-weight:600}
.flt select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:15px;color:#1B1A6B;width:100%;margin-top:4px;padding:0 20px 0 0;cursor:pointer}
a[data-pronto]{cursor:help}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1B1A6B;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#portal-freshness{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 12px;margin-left:auto}
#cached-page-state{display:inline-flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;max-width:420px;margin:0;font-size:11px;color:#756c9b}
.cached-refresh-button{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid #6530e5;border-radius:10px;background:linear-gradient(135deg,#7434ed,#5424ca);color:#fff;font:inherit;font-size:12px;font-weight:700;line-height:1.3;cursor:pointer;box-shadow:0 3px 10px #632bed26;transition:background .15s,box-shadow .15s}
.cached-refresh-button::before{content:'↻';font-size:17px;line-height:1}
.cached-refresh-button:hover{background:#4b20b8;box-shadow:0 4px 14px #632bed40}
.cached-refresh-button:focus-visible{outline:3px solid #c9b2ff;outline-offset:3px}
@media(max-width:700px){#portal-freshness{width:100%}#cached-page-state{max-width:100%}}

<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{const nav=document.querySelector('.portal-navigation .nav');if(!nav)return;const path=location.pathname;const section=path.includes('/comercial')?'comercial':path.includes('/ejecutiva')?'ejecutiva':path.includes('/operativa')?'operativa':null;if(section){nav.querySelectorAll('[data-section]').forEach(a=>{const selected=a.dataset.section===section;a.classList.toggle('on',selected);if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}})();
document.addEventListener('click', function (event) {
  var link = event.target.closest('[data-pronto]');
  if (!link) { return; }
  event.preventDefault();
  var toast = document.getElementById('toast');
  toast.textContent = 'Esta pantalla llega en la siguiente entrega.';
  toast.style.opacity = 1;
  clearTimeout(window.portalToastTimer);
  window.portalToastTimer = setTimeout(function () { toast.style.opacity = 0; }, 2400);
});
</script>
<script src="/static/portal/js/return_navigation.js" defer></script>
<script>const eva4Search=document.getElementById('eva4-search');if(eva4Search)eva4Search.addEventListener('input',()=>{const value=eva4Search.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();document.querySelectorAll('#eva4-processes tbody tr').forEach(row=>{row.hidden=!row.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(value);});});</script>
